# Casello web: SPA statica + proxy di /api verso il container API sulla stessa rete Docker di Coolify.
# L'host "casello-api" e' il "Network alias" della risorsa API in Coolify; entrambe le risorse devono
# avere "Connect to predefined network" attivo. Resolver + variabile: nginx parte anche se l'API e' giu'.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_upstream http://casello-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE / streaming degli agenti
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
