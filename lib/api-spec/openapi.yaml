        "404":
          $ref: "#/components/responses/NotFound"

  /team-chat-conversations/{id}/messages:
    post:
      operationId: sendTeamChatMessage
      tags: [team-chat]
      summary: Invia un messaggio e avvia il turno di Lucius
      description: >-
        Risponde subito col messaggio dell'utente; Lucius risponde in background (turnStatus running, poi idle).
        409 se un turno è già in corso, se la squadra è chiusa o se chi paga il modello ha raggiunto il tetto di
        spesa mensile. Massimo 10 messaggi al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamChatMessageCreate"
      responses:
        "202":
          description: Messaggio accettato, turno avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /team-chat-proposals/{id}/decision:
    post:
      operationId: decideTeamChatProposal
      tags: [team-chat]
      summary: Accetta o rifiuta una scheda di Lucius
      description: >-
        Accettando la modifica si applica alla squadra con le regole del salvataggio. 409 se la scheda è già decisa,
        se il valore è cambiato dopo la proposta (scheda stale) o se la squadra è chiusa.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamChatProposalDecision"
      responses:
        "200":
          description: Scheda aggiornata
