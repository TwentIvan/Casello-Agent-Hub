    delete:
      operationId: deleteMemoryHistoryEntry
      tags: [memories]
      summary: Elimina una voce dello storico (solo con il login; il costo del riassunto resta nella spesa)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/CharacterQuery"
      responses:
        "204":
          description: Voce eliminata
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /pending-actions:
    get:
      operationId: listPendingActions
      tags: [pending-actions]
      summary: Azioni in coda dell'utente corrente
      description: >-
        Le azioni L2 messe in coda dagli agenti (più recenti prima, massimo 200). Senza filtro solo quelle
        in attesa di conferma.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, executing, done, failed, rejected, all]
            default: pending
      responses:
        "200":
          description: Elenco delle azioni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedActionList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /pending-actions/{number}:
    get:
      operationId: getPendingAction
      tags: [pending-actions]
      summary: Dettaglio di un'azione in coda
      parameters:
        - $ref: "#/components/parameters/ActionNumberParam"
      responses:
        "200":
          description: Azione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /pending-actions/{number}/approve:
    post:
      operationId: approvePendingAction
      tags: [pending-actions]
      summary: Approva ed esegue un'azione in coda
      description: >-
        Esegue una sola volta la chiamata memorizzata, senza il modello. Con identità `user` serve il token
        dell'utente dell'app (vive solo per la durata della chiamata). Una richiesta già decisa dà 409.
        Se l'esecuzione fallisce la risposta è 200 con l'azione in stato `failed`. Massimo 20 decisioni al
        minuto per utente.
      parameters:
        - $ref: "#/components/parameters/ActionNumberParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveActionRequest"
      responses:
        "200":
          description: Azione dopo l'esecuzione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /pending-actions/{number}/reject:
    post:
      operationId: rejectPendingAction
      tags: [pending-actions]
      summary: Rifiuta un'azione in coda
      parameters:
        - $ref: "#/components/parameters/ActionNumberParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectActionRequest"
      responses:
        "200":
          description: Azione rifiutata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    CharacterQuery:
      name: character
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/MemoryCharacter"

    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    AttachmentIdParam:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer

    ToolIdParam:
      name: toolId
      in: path
      required: true
      schema:
        type: integer

    ActionNumberParam:
      name: number
      in: path
      required: true
      description: Numero progressivo dell'azione per utente
      schema:
        type: integer

    SkillCodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string

    SkillIdParam:
      name: skillId
      in: path
      required: true
      schema:
        type: integer

  responses:
    TooManyRequests:
      description: Troppe richieste
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflitto con lo stato corrente della risorsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Login richiesto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Risorsa non accessibile all'utente corrente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadGateway:
      description: Servizio esterno non raggiungibile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: Corpo della richiesta troppo grande
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    EmbedConfig:
      type: object
      required: [allowed, clientId, appName]
      properties:
        allowed:
          type: boolean
        clientId:
          type: string
          nullable: true
        appName:
          type: string
          nullable: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── GitHub ─────────────────────────────────────────────────────────────────
    GithubInstallation:
      type: object
      required: [installationId, accountLogin, accountType, repositorySelection, manageUrl]
      properties:
        installationId:
          type: integer
        accountLogin:
          type: string
        accountType:
          type: string
          description: User o Organization
        repositorySelection:
          type: string
          description: all o selected
        manageUrl:
          type: string
          description: Pagina di GitHub in cui gestire l'installazione

    GithubInstallations:
      type: object
      required: [installUrl, installations]
      properties:
        installUrl:
          type: string
          description: Pagina di GitHub in cui installare l'App
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GithubInstallation"

    GithubRepo:
      type: object
      required: [installationId, fullName, defaultBranch, private]
      properties:
        installationId:
          type: integer
        fullName:
          type: string
          description: proprietario/nome
        defaultBranch:
          type: string
        private:
          type: boolean

    # ── Auth ───────────────────────────────────────────────────────────────────

    CurrentUser:
      type: object
      required: [email, name, picture, identities, githubEnabled, auth]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
        picture:
          type: ["string", "null"]
        identities:
          type: array
          description: Account esterni collegati (Google, GitHub)
          items:
            $ref: "#/components/schemas/LinkedIdentity"
        githubEnabled:
          type: boolean
          description: Se il login e il collegamento con GitHub sono configurati sul server
        auth:
          description: Come è autenticata la richiesta (sessione del login o token personale)
          oneOf:
            - $ref: "#/components/schemas/CurrentUserSessionAuth"
            - $ref: "#/components/schemas/CurrentUserTokenAuth"

    CurrentUserSessionAuth:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [session]

    CurrentUserTokenAuth:
      type: object
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [token]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    AuthProviders:
      type: object
      required: [google, github]
      properties:
        google:
          type: boolean
        github:
          type: boolean
          description: Se il login con GitHub è configurato sul server

    LinkedIdentity:
      type: object
      required: [provider, username, email]
      properties:
        provider:
          type: string
          enum: [google, github]
        username:
          type: ["string", "null"]
          description: Login GitHub (null per Google)
        email:
          type: ["string", "null"]

    # ── App ────────────────────────────────────────────────────────────────────

    AppStatus:
      type: string
      enum: [active, inactive]

    AuthConfig:
      type: object
      required: [header, scheme]
      description: Come l'app riceve le credenziali (scheme null = valore grezzo)
      properties:
        header:
          type: string
          minLength: 1
        scheme:
          type: ["string", "null"]

    SourceType:
      type: string
      enum: [github, zip, none]
      description: Da dove l'architetto legge il codice dell'app

    App:
      type: object
      required: [id, name, slug, baseUrl, status, serviceSecretSet, sourceType, sourceRepo, sourceBranch, sourceTokenSet, sourceInstallationId, openapiUrl, functionalDescription, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
        internalBaseUrl:
          type: ["string", "null"]
          description: URL raggiunto dall'esecutore al posto di baseUrl (rete interna)
        mcpUrl:
          type: ["string", "null"]
          description: Indirizzo del server MCP dell'app
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecretSet:
          type: boolean
          description: Indica se il segreto di servizio è impostato (il valore non è mai esposto)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
          description: Repository GitHub nel formato owner/nome
        sourceBranch:
          type: ["string", "null"]
        sourceTokenSet:
          type: boolean
          description: Indica se il token GitHub di sola lettura è impostato (il valore non è mai esposto)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App da cui l'architetto scarica il repo (con un token ristretto
            a quel repo); null = token manuale della fase 3
        openapiUrl:
          type: ["string", "null"]
          description: URL dell'OpenAPI dell'app, letto (GET) dall'architetto
        functionalDescription:
          type: ["string", "null"]
          description: Descrizione funzionale dell'app per l'architetto
        status:
          $ref: "#/components/schemas/AppStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DefaultModel:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: ["integer", "null"]

    CentralinoModel:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: ["integer", "null"]

    CharacterSettings:
      type: object
      required: [alfredChatAiModelId, luciusAiModelId, alfredMonthlyBudgetUsd, luciusMonthlyBudgetUsd]
      properties:
        alfredChatAiModelId:
          type: ["integer", "null"]
        luciusAiModelId:
          type: ["integer", "null"]
        alfredMonthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
        luciusMonthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000

    CharacterSettingsView:
      description: Impostazioni dei personaggi più la spesa del mese (mese di calendario, ora italiana).
      allOf:
        - $ref: "#/components/schemas/CharacterSettings"
        - type: object
          required: [alfredSpentUsd, luciusSpentUsd, alfredUnpricedCount, luciusUnpricedCount]
          properties:
            alfredSpentUsd:
              type: number
              minimum: 0
            luciusSpentUsd:
              type: number
              minimum: 0
            alfredUnpricedCount:
              type: integer
              minimum: 0
            luciusUnpricedCount:
              type: integer
              minimum: 0

    AlfredSettings:
      type: object
      required: [aiModelId, voice, models]
      properties:
        aiModelId:
          type: ["integer", "null"]
        voice:
          type: string
        models:
          type: array
          items:
            type: object
            required: [id, name, accountName]
            properties:
              id:
                type: integer
              name:
                type: string
              accountName:
                type: string

    AlfredChoice:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: ["integer", "null"]
        voice:
          type: string

    AlfredSession:
      type: object
      required: [sessionId, token, model, voice, expiresAt]
      properties:
        sessionId:
          type: integer
        token:
          type: string
        model:
          type: string
        voice:
          type: string
        expiresAt:
          type: string

    AlfredCloseBody:
      type: object
      properties:
        transcript:
          type: string
          maxLength: 20000

    AlfredRenewBody:
      type: object
      properties:
        resumptionHandle:
          type: string
          minLength: 1
          maxLength: 4096

    AlfredUsageBody:
      type: object
      required: [promptTokens, completionTokens]
      properties:
        promptTokens:
          type: number
        completionTokens:
          type: number

    AlfredToolBody:
      type: object
      properties:
        args:
          type: object
          additionalProperties: true

    AlfredToolResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        result: {}
        error:
          type: string

    AppInput:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        mcpUrl:
          type: ["string", "null"]
          description: Indirizzo del server MCP dell'app
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: string
          description: Segreto di servizio (solo scrittura, salvato cifrato)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: string
          description: Token GitHub di sola lettura (solo scrittura, salvato cifrato)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo (solo con sourceType github);
            altrimenti 400 "installazione non trovata o non tua"
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"
        generalAgentAiModelId:
          type: ["integer", "null"]
          description: >-
            Modello dell'agente generale creato con l'app: deve essere di un account AI dell'utente
            (400 "modello non disponibile" altrimenti). Se assente si usa il modello predefinito
            dell'utente, se c'è; altrimenti l'agente nasce senza modello.

    AppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        mcpUrl:
          type: ["string", "null"]
          description: Indirizzo del server MCP dell'app
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: ["string", "null"]
          description: Segreto di servizio (solo scrittura); null lo cancella
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: ["string", "null"]
          description: Token GitHub di sola lettura (solo scrittura); null lo cancella
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo; null torna al token manuale.
            Passando a un sourceType diverso da github diventa null da sola
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"

    # ── Agent ──────────────────────────────────────────────────────────────────

    AgentStatus:
      type: string
      enum: [active, inactive, draft]

    AgentRole:
      type: string
      enum: [general, area]

    Agent:
      type: object
      required: [id, appId, name, aiModelId, status, role, defaultIdentity, toolIds, monthlyBudgetUsd, confirmWrites, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
          description: >-
            Id del modello come testo (compatibilità): con aiModelId impostato è il modelId del
            modello scelto
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello scelto tra quelli degli account AI; le run usano l'account di questo modello
            (chi configura paga). Null = nessun modello: l'agente non si può eseguire
        status:
          $ref: "#/components/schemas/AgentStatus"
        role:
          $ref: "#/components/schemas/AgentRole"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        toolIds:
          type: array
          items:
            type: integer
          description: ID dei tool del catalogo assegnati all'agente
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD delle run dell'agente; null = nessun limite
        confirmWrites:
          type: boolean
          description: >-
            Tutte le scritture (livello L1) vanno in "Da confermare". Per l'agente generale (Responsabile di prodotto) è sempre true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [appId, name]
      properties:
        appId:
          type: integer
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: string
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello di un account AI dell'utente (400 "modello non disponibile" altrimenti). Se assente si usa il modello predefinito dell'utente, se c'è;
            altrimenti l'agente nasce senza modello.
        status:
          $ref: "#/components/schemas/AgentStatus"

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: ["string", "null"]
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Se diverso da quello salvato deve essere un modello dell'utente (400 altrimenti); uguale a quello salvato non viene ricontrollato
        status:
          $ref: "#/components/schemas/AgentStatus"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite
        confirmWrites:
          type: boolean
          description: Tutte le scritture in "Da confermare"; per l'agente generale si ignora (sempre true)

    AgentModelAssignments:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: object
            required: [agentId, aiModelId]
            properties:
              agentId:
                type: integer
              aiModelId:
                type: ["integer", "null"]

    AgentToolsInput:
      type: object
      required: [toolIds]
      properties:
        toolIds:
          type: array
          items:
            type: integer

    # ── Tool ───────────────────────────────────────────────────────────────────

    ToolKind:
      type: string
      enum: [http, ui, composite, mcp]

    ToolLevel:
      type: string
      enum: [L0, L1, L2, L3]
      description: "Livello d'azione: L0 lettura, L1 azione reversibile, L2 con conferma, L3 vietata"

    ToolIdentity:
      type: string
      enum: [user, service]

    ToolStatus:
      type: string
      enum: [draft, active, disabled]

    AppTool:
      type: object
      required:
        - id
        - appId
        - name
        - kind
        - identity
        - level
        - levelOverride
        - status
        - paramsSchema
        - definition
        - needsVerification
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        level:
          $ref: "#/components/schemas/ToolLevel"
          description: Livello proposto; per i tool MCP lo dichiara il servizio (sola lettura)
        levelOverride:
          oneOf:
            - $ref: "#/components/schemas/ToolLevel"
            - type: "null"
          description: Livello scelto dall'utente, mai sotto `level`
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema dei parametri accettati dal tool
        definition:
          type: object
          additionalProperties: true
          description: Definizione dell'esecuzione (dipende da kind)
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
          description: Evidenze da cui il tool è stato derivato (proposte dall'architetto)
        needsVerification:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ToolEvidence:
      type: object
      required: [source, location]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    AppToolInput:
      type: object
      required: [name, kind, definition]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        level:
          $ref: "#/components/schemas/ToolLevel"
          description: Livello proposto; per i tool MCP lo dichiara il servizio (sola lettura)
        levelOverride:
          oneOf:
            - $ref: "#/components/schemas/ToolLevel"
            - type: "null"
          description: Livello scelto dall'utente, mai sotto `level`
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    AppToolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        level:
          $ref: "#/components/schemas/ToolLevel"
          description: Livello proposto; per i tool MCP lo dichiara il servizio (sola lettura)
        levelOverride:
          oneOf:
            - $ref: "#/components/schemas/ToolLevel"
            - type: "null"
          description: Livello scelto dall'utente, mai sotto `level`
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    # ── Run ────────────────────────────────────────────────────────────────────

    RunStatus:
      type: string
      description: >-
        awaiting_client resta solo per le run storiche: la pausa per conferma è stata sostituita dalla
        coda delle azioni e all'avvio le run ancora in pausa diventano cancelled.
      enum: [pending, running, succeeded, failed, awaiting_client, cancelled]

    Run:
      type: object
      required: [id, agentId, status, createdAt, cachedTokens]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: ["string", "null"]
          description: Input testuale passato all'agente
        output:
          type: ["string", "null"]
          description: Output prodotto dall'agente
        errorMessage:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        cachedTokens:
          type: integer
          description: Quanti dei token di prompt il provider ha letto dalla cache (0 se non lo riporta)
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o la run usa il vecchio gateway (costo parziale)

    RunStep:
      type: object
      required: [id, runId, position, type, createdAt]
      properties:
        id:
          type: integer
        runId:
          type: integer
        position:
          type: integer
        type:
          type: string
          description: >-
            model (chiamata al modello), tool (chiamata a un tool) o queued (azione accodata per la
            conferma dell'utente: args = { numero, destinatario, sintesi, argomenti } con gli argomenti
            sensibili oscurati)
        toolName:
          type: ["string", "null"]
        args:
          type: ["object", "null"]
          additionalProperties: true
        ok:
          type: ["boolean", "null"]
        httpStatus:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RunTrigger:
      type: object
      properties:
        input:
          type: string
          description: Input testuale da passare all'agente

    # ── Dashboard ──────────────────────────────────────────────────────────────

    DashboardStats:
      type: object
      required: [totalApps, totalAgents, totalRuns, successfulRuns, failedRuns, cancelledRuns, activeAgents, pendingActions]
      properties:
        totalApps:
          type: integer
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalRuns:
          type: integer
        successfulRuns:
          type: integer
        failedRuns:
          type: integer
        cancelledRuns:
          type: integer
        pendingActions:
          type: integer
          description: Azioni dell'utente corrente in attesa di conferma
        avgDurationMs:
          type: ["number", "null"]

    # ── Coda delle azioni ──────────────────────────────────────────────────────

    QueuedAction:
      type: object
      required: [number, status, kind, team, app, tool, agentId, runId, recipient, summary, args, result, errorMessage, decisionNote, createdAt, decidedAt, finishedAt]
      properties:
        number:
          type: integer
        status:
          type: string
          enum: [pending, executing, done, failed, rejected]
        kind:
          type: string
          enum: [action, plan, plan_change]
          description: Azione di uno strumento, piano o modifica del piano proposti dal capo di una squadra
        team:
          type: ["object", "null"]
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        app:
          type: ["object", "null"]
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        tool:
          type: ["object", "null"]
          required: [id, name, identity]
          properties:
            id:
              type: integer
            name:
              type: string
            identity:
              type: string
              enum: [user, service]
        agentId:
          type: ["integer", "null"]
        runId:
          type: ["integer", "null"]
        recipient:
          type: string
        summary:
          type: string
        args:
          description: Argomenti con i parametri sensibili oscurati
        result:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    QueuedActionList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/QueuedAction"

    ApproveActionRequest:
      type: object
      properties:
        userToken:
          type: string
          description: Token dell'utente dell'app, per gli strumenti con identità utente
          minLength: 1
          maxLength: 4096

    RejectActionRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    # ── Tetti di spesa ─────────────────────────────────────────────────────────

    UserBudget:
      type: object
      required: [capUsd, spentUsd, unpricedCount]
      properties:
        capUsd:
          type: ["number", "null"]
          description: Tetto mensile in USD; null = nessun limite
        spentUsd:
          type: number
          description: Spesa nota del mese sugli account AI dell'utente (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer
          description: Esecuzioni del mese con token consumati ma senza prezzo (la spesa reale è più alta)

    AgentBudget:
      type: object
      required: [agentId, agentName, appId, capUsd, spentUsd, unpricedCount]
      properties:
        agentId:
          type: integer
        agentName:
          type: string
        appId:
          type: integer
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese delle run dell'agente, con qualsiasi modello
        unpricedCount:
          type: integer

    AccountBudget:
      type: object
      required: [accountId, accountName, capUsd, spentUsd, unpricedCount]
      properties:
        accountId:
          type: integer
        accountName:
          type: string
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese su tutti i modelli dell'account (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer

    ModelBudget:
      type: object
      required: [aiModelId, modelName, accountId, accountName, capUsd, spentUsd, unpricedCount]
      properties:
        aiModelId:
          type: integer
        modelName:
          type: string
        accountId:
          type: integer
        accountName:
          type: string
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese sul modello (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer

    BudgetActiveRun:
      type: object
      required: [id, agentId, agentName, status]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"

    Budget:
      type: object
      required: [month, user, agents, accounts, models, activeRuns]
      properties:
        month:
          type: string
          description: Mese corrente, AAAA-MM (ora italiana)
        user:
          $ref: "#/components/schemas/UserBudget"
        agents:
          type: array
          description: Agenti con un tetto impostato
          items:
            $ref: "#/components/schemas/AgentBudget"
        accounts:
          type: array
          description: Account AI dell'utente con un tetto impostato
          items:
            $ref: "#/components/schemas/AccountBudget"
        models:
          type: array
          description: Modelli degli account dell'utente con un tetto impostato
          items:
            $ref: "#/components/schemas/ModelBudget"
        activeRuns:
          type: array
          description: >-
            Run pending, running o awaiting_client che spendono su un tetto già raggiunto (dell'utente, del
            loro agente, del loro modello o del suo account)
          items:
            $ref: "#/components/schemas/BudgetActiveRun"

    BudgetUpdate:
      type: object
      required: [monthlyBudgetUsd]
      properties:
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto mensile in USD (arrotondato al centesimo); null = nessun limite

    # ── Architetto ─────────────────────────────────────────────────────────────

    AnalysisStatus:
      type: string
      enum: [queued, running, completed, failed, interrupted]

    AnalysisExecutor:
      type: string
      enum: [cloud, local]
      description: Chi esegue l'analisi, il cloud di Casello o un agente locale via MCP

    AnalysisChapter:
      type: string
      enum: [tool, agent, skill, endpoint, completion, evolution]

    ItemDiff:
      type: string
      enum: [new, changed, removed, unchanged]
      description: Differenza rispetto allo stato approvato

    ItemStatus:
      type: string
      enum: [pending, approved, discarded, postponed]
      description: postponed solo per i capitoli endpoint, completion ed evolution

    AnalysisSources:
      type: object
      required: [code, openapi, mcp, description]
      properties:
        code:
          $ref: "#/components/schemas/SourceType"
        openapi:
          type: boolean
        mcp:
          type: boolean
          description: Elenco degli strumenti del server MCP dell'app letto all'avvio (false nelle analisi precedenti)
        description:
          type: boolean

    Analysis:
      type: object
      required: [id, appId, model, aiModelId, status, executor, sources, maxTokens, tokensUsed, cachedTokens, costUsd, phase, error, leaseLabel, leaseUntil, createdAt, finishedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        model:
          type: string
        aiModelId:
          type: ["integer", "null"]
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        executor:
          $ref: "#/components/schemas/AnalysisExecutor"
        sources:
          $ref: "#/components/schemas/AnalysisSources"
        maxTokens:
          type: integer
        tokensUsed:
          type: integer
          description: Token usati pesati per il budget (quelli letti dalla cache contano al 10%)
        cachedTokens:
          type: integer
          description: Token di prompt letti dalla cache del provider, per intero
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o l'analisi usa il vecchio gateway (costo parziale)
        phase:
          type: ["string", "null"]
          description: Fase corrente
        error:
          type: ["string", "null"]
        leaseLabel:
          type: ["string", "null"]
          description: Etichetta dell'agente locale che ha l'analisi in carico (solo con lease attiva)
        leaseUntil:
          type: ["string", "null"]
          format: date-time
          description: Scadenza della lease dell'agente locale
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    AnalysisPhaseDelivery:
      type: object
      required: [phase, submittedAt]
      properties:
        phase:
          type: string
        submittedAt:
          type: string
          format: date-time

    AnalysisLogEntry:
      type: object
      required: [at, phase, message]
      properties:
        at:
          type: string
          format: date-time
        phase:
          type: string
        message:
          type: string

    AnalysisEvidence:
      type: object
      required: [source, location, note]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    ItemIssue:
      type: object
      required: [repo, number, url, state, stateReason, checkedAt]
      properties:
        repo:
          type: string
          description: Repository della issue, nella forma proprietario/nome
        number:
          type: integer
        url:
          type: string
        state:
          type: string
          enum: [open, closed]
        stateReason:
          type: ["string", "null"]
          description: Motivo di chiusura riportato da GitHub (es. completed, not_planned)
        checkedAt:
          type: ["string", "null"]
          format: date-time
          description: Ultimo controllo dello stato su GitHub

    AnalysisItem:
      type: object
      required: [id, analysisId, chapter, ref, position, payload, diff, evidence, status, reviewNote, appliedAt, origin, issue]
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        origin:
          type: string
          enum: [architect, chat]
          description: Chi ha creato la voce (l'architetto o una proposta accettata in chat)
        chapter:
          $ref: "#/components/schemas/AnalysisChapter"
        ref:
          type: string
          description: Chiave stabile nell'analisi, es. tool:rosa_squadra
        position:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: >-
            Contenuto della proposta, la cui forma dipende dal capitolo. Le voci tool hanno `kind`
            ("http" | "mcp"), `level` ("L0".."L3", livello proposto) e, per gli strumenti MCP,
            `declaredLevel` (livello dichiarato dal servizio) e `definition` { mcpName }; le voci tool
            delle analisi precedenti ai livelli arrivano già convertite (`level` dai vecchi flag).
        diff:
          $ref: "#/components/schemas/ItemDiff"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisEvidence"
        status:
          $ref: "#/components/schemas/ItemStatus"
        reviewNote:
          type: ["string", "null"]
        appliedAt:
          type: ["string", "null"]
          format: date-time
        issue:
          oneOf:
            - $ref: "#/components/schemas/ItemIssue"
            - type: "null"
          description: Issue GitHub collegata alla voce (null se non creata o ancora in prenotazione)

    # ── Chat del piano ────────────────────────────────────────────────────────
    PlanTurnStatus:
      type: string
      enum: [idle, running]

    PlanConversation:
      type: object
      required: [id, appId, analysisId, aiModelId, title, tokensUsed, costUsd, turnStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        analysisId:
          type: integer
        aiModelId:
          type: ["integer", "null"]
        title:
          type: string
        tokensUsed:
          type: integer
        costUsd:
          type: ["number", "null"]
          description: null = costo parziale (prezzo mancante)
        turnStatus:
          $ref: "#/components/schemas/PlanTurnStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlanMessage:
      type: object
      required: [id, role, content, error, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Markdown
        error:
          type: boolean
          description: Messaggio del bot che riporta un errore
        createdAt:
          type: string
          format: date-time

    PlanProposal:
      type: object
      required: [id, messageId, kind, chapter, title, payload, rationale, targetItemId, status, itemId, decidedAt, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        kind:
          type: string
          enum: [add, update, discard]
        chapter:
          $ref: "#/components/schemas/AnalysisChapter"
        title:
          type: string
          description: Titolo della voce proposta (per discard, quello della voce di destinazione)
        payload:
          type: ["object", "null"]
          additionalProperties: true
          description: Contenuto proposto (add e update), null per discard
        rationale:
          type: string
        targetItemId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, stale]
        itemId:
          type: ["integer", "null"]
          description: Voce creata o modificata all'accettazione
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    PlanConversationDetail:
      allOf:
        - $ref: "#/components/schemas/PlanConversation"
        - type: object
          required: [messages, proposals, newerAnalysisId]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/PlanMessage"
            proposals:
              type: array
              items:
                $ref: "#/components/schemas/PlanProposal"
            newerAnalysisId:
              type: ["integer", "null"]
              description: Id di un'analisi completata più recente di quella della conversazione, se esiste

    AppPlan:
      type: object
      required: [analysisId, items, issues]
      properties:
        analysisId:
          type: ["integer", "null"]
          description: Ultima analisi completata dell'app (null se non ce n'è)
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisItem"
        issues:
          $ref: "#/components/schemas/PlanIssuesSummary"

    McpSyncResult:
      type: object
      required: [added, updated, disabled, unchanged, conflicts]
      properties:
        added:
          type: integer
        updated:
          type: integer
        disabled:
          type: integer
        unchanged:
          type: integer
        conflicts:
          type: array
          items:
            type: string
          description: Nomi degli strumenti MCP uguali a un tool non MCP del catalogo (lasciato invariato)

    PlanIssuesSummary:
      type: object
      required: [available, unavailableReason, repo, open, closed, approvedWithoutIssue, checkedAt]
      properties:
        available:
          type: boolean
          description: L'utente può creare issue (repository collegato tramite un'installazione sua)
        unavailableReason:
          type: ["string", "null"]
        repo:
          type: ["string", "null"]
          description: Repository delle issue (null se non disponibile)
        open:
          type: integer
          description: Voci del piano con issue aperta
        closed:
          type: integer
          description: Voci del piano con issue chiusa
        approvedWithoutIssue:
          type: integer
          description: Voci approvate di endpoint, completamento ed evoluzione senza issue
        checkedAt:
          type: ["string", "null"]
          format: date-time
          description: Lettura dello stato più vecchia tra le voci collegate

    PlanConversationCreate:
      type: object
      properties:
        aiModelId:
          type: ["integer", "null"]
          description: Modello di un account AI dell'utente; null o assente = modello di Lucius (o predefinito)
        analysisId:
          type: integer
          description: Analisi di riferimento (default l'ultima completata dell'app)

    PlanConversationUpdate:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: integer

    PlanMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000

    PlanIssuesRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: integer
        dryRun:
          type: boolean
          description: Solo anteprima, senza chiamare GitHub

    PlanIssuesPreview:
      type: object
      required: [repo, issues]
      properties:
        repo:
          type: string
        issues:
          type: array
          items:
            type: object
            required: [itemId, title, body, labels, skipped]
            properties:
              itemId:
                type: integer
              title:
                type: string
              body:
                type: string
              labels:
                type: array
                items:
                  type: string
              skipped:
                type: boolean
                description: Voce già collegata o non ammessa (non verrebbe creata)

    PlanIssuesResult:
      type: object
      required: [repo, results]
      properties:
        repo:
          type: string
        results:
          type: array
          items:
            type: object
            required: [itemId, outcome]
            properties:
              itemId:
                type: integer
              outcome:
                type: string
                enum: [created, skipped, failed]
              number:
                type: integer
              url:
                type: string
              error:
                type: string

    TeamChatConversation:
      type: object
      required: [id, teamInstanceId, aiModelId, title, tokensUsed, costUsd, turnStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        teamInstanceId:
          type: integer
        aiModelId:
          type: ["integer", "null"]
        title:
          type: string
        tokensUsed:
          type: integer
        costUsd:
          type: ["number", "null"]
          description: null = costo parziale (prezzo mancante)
        turnStatus:
          $ref: "#/components/schemas/PlanTurnStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamChatMessage:
      type: object
      required: [id, role, content, error, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Markdown
        error:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TeamChatProposal:
      type: object
      required: [id, messageId, kind, roleKey, payload, rationale, status, currentValue, decidedAt, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        kind:
          type: string
          enum: [role_identity, role_instructions]
        roleKey:
          type: string
        payload:
          type: ["object", "null"]
          additionalProperties: true
          description: "role_identity: {text}; role_instructions: {markdown}"
        rationale:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, stale]
        currentValue:
          type: string
          description: Identità o istruzioni attuali del ruolo ("" se non ci sono), per mostrare le differenze
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    TeamChatConversationDetail:
      allOf:
        - $ref: "#/components/schemas/TeamChatConversation"
        - type: object
          required: [messages, proposals]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/TeamChatMessage"
            proposals:
              type: array
              items:
                $ref: "#/components/schemas/TeamChatProposal"

    TeamChatConversationCreate:
      type: object
      properties:
        aiModelId:
          type: ["integer", "null"]
          description: Modello di un account AI dell'utente; null o assente = modello predefinito

    TeamChatMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000

    TeamChatProposalDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject]

    CharacterSubjectType:
      type: string
      enum: [alfred_thread, agent, skill, team_template, area_agents, area_skills, area_team_templates]

    CharacterProposalKind:
      type: string
      enum: [agent_prompt, agent_tools, skill_content, template_roles, agent_create, skill_create, template_create, decision, handoff]

    CharacterConversation:
      type: object
      required: [id, character, subjectType, subjectId, subjectTitle, aiModelId, title, tokensUsed, costUsd, turnStatus, archivedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        character:
          $ref: "#/components/schemas/MemoryCharacter"
        subjectType:
          $ref: "#/components/schemas/CharacterSubjectType"
        subjectId:
          type: ["string", "null"]
        subjectTitle:
          type: ["string", "null"]
          description: Titolo dell'oggetto alla creazione
        subjectGone:
          type: boolean
          description: L'argomento non esiste più; calcolato solo nel dettaglio
        aiModelId:
          type: ["integer", "null"]
        title:
          type: string
        tokensUsed:
          type: integer
        costUsd:
          type: ["number", "null"]
          description: null = costo parziale (prezzo mancante)
        turnStatus:
          $ref: "#/components/schemas/PlanTurnStatus"
        archivedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CharacterPageContext:
      type: object
      required: [page]
      properties:
        page:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[a-z_]+$"
        id:
          type: string
          minLength: 1
          maxLength: 100
        host:
          type: object
          description: Pagina dell'app ospite (pannello incorporato); ammesso solo con page "host"
          required: [app, page]
          properties:
            app:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
            page:
              type: string
              minLength: 1
              maxLength: 40
              pattern: "^[A-Za-z0-9._:-]+$"
            id:
              type: string
              minLength: 1
              maxLength: 40
              pattern: "^[A-Za-z0-9._:-]+$"
            title:
              type: string
              minLength: 1
              maxLength: 200
              pattern: "^[^\\r\\n]+$"

    CharacterMessage:
      type: object
      required: [id, role, content, error, pageContext, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Markdown
        error:
          type: boolean
        pageContext:
          oneOf:
            - $ref: "#/components/schemas/CharacterPageContext"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    CharacterProposal:
      type: object
      required: [id, messageId, kind, payload, rationale, status, decidedAt, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        kind:
          $ref: "#/components/schemas/CharacterProposalKind"
        payload:
          type: ["object", "null"]
          additionalProperties: true
        rationale:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, stale]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CharacterConversationDetail:
      allOf:
        - $ref: "#/components/schemas/CharacterConversation"
        - type: object
          required: [messages, proposals]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/CharacterMessage"
            proposals:
              type: array
              items:
                $ref: "#/components/schemas/CharacterProposal"

    CharacterConversationCreate:
      type: object
      required: [character, subjectType]
      properties:
        character:
          $ref: "#/components/schemas/MemoryCharacter"
        subjectType:
          type: string
          enum: [agent, skill, team_template, area_agents, area_skills, area_team_templates]
        subjectId:
          type: ["string", "null"]
          minLength: 1
          maxLength: 100

    CharacterConversationUpdate:
      type: object
      properties:
        aiModelId:
          type: ["integer", "null"]
          description: Modello di un account AI dell'utente
        title:
          type: string
          minLength: 1
          maxLength: 80

    CharacterMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
        pageContext:
          $ref: "#/components/schemas/CharacterPageContext"

    CharacterProposalDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject]

    MemoryCharacter:
      type: string
      enum: [alfred, lucius]

    MemoryNote:
      type: object
      required: [id, content, ref, createdAt, updatedAt]
      properties:
        id:
          type: integer
        content:
          type: string
        ref:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemoryNoteCreate:
      type: object
      required: [character, content]
      properties:
        character:
          $ref: "#/components/schemas/MemoryCharacter"
        content:
          type: string
          maxLength: 2000

    MemoryNoteUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 2000

    MemoryHistoryEntry:
      type: object
      required: [id, kind, refId, title, summary, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [alfred_session, plan_conversation, team_chat]
        refId:
          type: integer
        title:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time

    PlanProposalDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject]

    PlanProposalDecisionResult:
      type: object
      required: [proposal, item]
      properties:
        proposal:
          $ref: "#/components/schemas/PlanProposal"
        item:
          oneOf:
            - $ref: "#/components/schemas/AnalysisItem"
            - type: "null"
          description: Voce creata o modificata (null se rifiutata)

    AnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/Analysis"
        - type: object
          required: [architectureMap, log, items, deliveredPhases]
          properties:
            deliveredPhases:
              type: array
              description: Fasi consegnate dall'agente locale, in ordine di fase (vuoto per le analisi cloud)
              items:
                $ref: "#/components/schemas/AnalysisPhaseDelivery"
            architectureMap:
              type: ["object", "null"]
              additionalProperties: true
            log:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisLogEntry"
            items:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisItem"

    AnalysisStart:
      type: object
      description: >-
        Con executor cloud (default) aiModelId è obbligatorio (altrimenti 400 "scegli un modello");
        con executor local non si indica.
      properties:
        executor:
          $ref: "#/components/schemas/AnalysisExecutor"
        aiModelId:
          type: integer
          description: Modello di un account AI dell'utente
        maxTokens:
          type: integer
          minimum: 50000
          maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)

    AnalysisItemUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"
        payload:
          type: object
          additionalProperties: true
        reviewNote:
          type: ["string", "null"]
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Solo con status approved su un agente nuovo: modello dell'agente creato, di un account AI
            dell'utente (400 "modello non disponibile" altrimenti). Se assente si usa il modello
            predefinito dell'utente, se c'è; un agente esistente mantiene il suo modello.

    IssueExport:
      type: object
      required: [markdown, count]
      properties:
        markdown:
          type: string
        count:
          type: integer

    AgentSkill:
      type: object
      required: [id, agentId, name, description, instructions, toolNames, paramsSchema, status]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        instructions:
          type: string
        toolNames:
          type: array
          items:
            type: string
        paramsSchema:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: string
          enum: [draft, active]

    # ── Account AI ─────────────────────────────────────────────────────────────

    AiProvider:
      type: string
      pattern: "^[a-z0-9_-]{1,64}$"
      description: Slug di un provider della tabella providers

    AiProviderProtocol:
      type: string
      enum: [openai_compatible, anthropic, bedrock, vertex, azure, unknown]

    AiProviderStatus:
      type: string
      enum: [managed, coming, unmanaged]
      description: >-
        managed: esecutore disponibile; coming: protocollo noto ancora senza esecutore (non selezionabile);
        unmanaged: sconosciuto al registro, configurabile come compatibile OpenAI con indirizzo dell'utente

    AiProviderInfo:
      type: object
      required: [slug, name, protocol, status, defaultBaseUrl, editableBaseUrl]
      properties:
        slug:
          $ref: "#/components/schemas/AiProvider"
        name:
          type: string
        protocol:
          $ref: "#/components/schemas/AiProviderProtocol"
        status:
          $ref: "#/components/schemas/AiProviderStatus"
        defaultBaseUrl:
          type: ["string", "null"]
          description: Indirizzo predefinito; null se lo inserisce l'utente
        editableBaseUrl:
          type: boolean
          description: L'utente inserisce l'indirizzo (custom, provider non gestiti e gestiti senza indirizzo predefinito)

    AiAccountStatus:
      type: string
      enum: [unverified, ok, error]

    AiAccount:
      type: object
      required: [id, name, provider, baseUrl, allowPrivateNetwork, isDefault, status, lastError, lastCheckedAt, keySet, modelCount, monthlyBudgetUsd]
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        baseUrl:
          type: string
        allowPrivateNetwork:
          type: boolean
          description: Consente http e indirizzi privati (solo custom e provider non gestiti); loopback, link-local e metadati restano vietati
        isDefault:
          type: boolean
        status:
          $ref: "#/components/schemas/AiAccountStatus"
        lastError:
          type: ["string", "null"]
          description: Messaggio fisso dell'ultimo errore del provider
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        keySet:
          type: boolean
          description: Indica se la chiave è impostata (il valore non è mai esposto)
        modelCount:
          type: integer
          description: Numero di modelli dell'account (nascosti compresi)
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD su tutti i modelli dell'account; null = nessun limite

    AiAccountInput:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Chiave del provider (solo scrittura, salvata cifrata); vuota solo per custom
        baseUrl:
          type: ["string", "null"]
          maxLength: 2048
          description: Obbligatorio per custom, provider non gestiti e gestiti senza indirizzo predefinito; gli altri usano il base URL predefinito
        allowPrivateNetwork:
          type: boolean
          description: Solo custom e provider non gestiti

    OAuthGrant:
      type: object
      required: [id, clientName, redirectHost, createdAt, lastUsedAt, canDecide]
      properties:
        id:
          type: integer
        clientName:
          type: string
        redirectHost:
          type: string
          description: Host dell'indirizzo di ritorno registrato dal client
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        canDecide:
          type: boolean
          description: Può approvare e rifiutare le azioni in coda (ambito api:write o embed)

    Node:
      type: object
      required: [id, name, status, executor, version, skills, workspaceRoot, maxConcurrent, lastSeenAt, online]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        executor:
          type: ["string", "null"]
        version:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        workspaceRoot:
          type: ["string", "null"]
        maxConcurrent:
          type: integer
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
        online:
          type: boolean
          description: Ha comunicato negli ultimi 2 minuti

    NodeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    NodeCreated:
      type: object
      required: [node, token]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string
          description: Valore del token del nodo, mostrato una sola volta

    NodeToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Valore del token, mostrato una sola volta

    NodeHeartbeat:
      type: object
      required: [pending]
      properties:
        pending:
          type: integer
          description: Compiti in attesa che il nodo potrebbe prendere

    NodeCapabilities:
      type: object
      required: [version, executor, skills, workspaceRoot, maxConcurrent]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 100
        executor:
          type: string
          minLength: 1
          maxLength: 100
          description: Esecutore dichiarato (es. claude-code)
        skills:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Nomi delle skill disponibili sul nodo
        workspaceRoot:
          type: string
          maxLength: 300
          description: Radice degli spazi di lavoro (testo descrittivo)
        maxConcurrent:
          type: integer
          minimum: 1
          maximum: 3
        folders:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 300
          description: >-
            Sottocartelle della radice (percorsi relativi con `/`, fino a 3 livelli), per la scelta dello spazio
            di lavoro in console. Facoltativo: un nodo che non lo manda lascia invariato l'elenco salvato.

    NodeFolders:
      type: object
      required: [nodeId, workspaceRoot, folders, foldersUpdatedAt]
      properties:
        nodeId:
          type: integer
        workspaceRoot:
          type: ["string", "null"]
        folders:
          type: ["array", "null"]
          items:
            type: string
        foldersUpdatedAt:
          type: ["string", "null"]
          format: date-time

    NodeLease:
      type: object
      required: [leaseToken]
      properties:
        leaseToken:
          type: string
          minLength: 1
          maxLength: 200

    NodeLeaseRenewed:
      type: object
      required: [leaseExpiresAt]
      properties:
        leaseExpiresAt:
          type: string
          format: date-time

    NodeReport:
      type: object
      required: [leaseToken, status, outcome]
      properties:
        leaseToken:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [done, blocked, failed]
        outcome:
          type: string
          minLength: 1
          maxLength: 300
        detail:
          type: string
          maxLength: 20000
        costUsd:
          type: number
          minimum: 0
          maximum: 100000
        promptTokens:
          type: integer
          minimum: 0
          maximum: 2000000000
        completionTokens:
          type: integer
          minimum: 0
          maximum: 2000000000
        sessionId:
          type: string
          minLength: 1
          maxLength: 200

    NodeTaskPackage:
      type: object
      required: [taskId, leaseToken, leaseExpiresAt, team, workspace, role, task, plan, caselloSkills, nodeSkills, attachments]
      properties:
        taskId:
          type: integer
        leaseToken:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        team:
          type: object
          required: [id, name, refType, refId, refTitle]
          properties:
            id:
              type: integer
            name:
              type: string
            refType:
              type: string
            refId:
              type: string
            refTitle:
              type: string
        workspace:
          type: ["string", "null"]
          description: Spazio di lavoro della squadra, relativo alla radice del nodo (null se non impostato)
        role:
          type: object
          required: [key, name, task, preferredModel]
          properties:
            key:
              type: string
            name:
              type: string
            task:
              type: string
            preferredModel:
              type: ["string", "null"]
              description: Modello preferito, solo indicativo
        task:
          type: object
          required: [planTaskId, title, instructions]
          properties:
            planTaskId:
              type: string
            title:
              type: string
            instructions:
              type: string
        plan:
          type: object
          required: [objective, constraints, openPoints, tasks, manualActions]
          properties:
            objective:
              type: string
            constraints:
              type: array
              items:
                type: string
            openPoints:
              type: array
              items:
                type: string
            tasks:
              type: array
              items:
                type: object
                required: [id, title, roleKey, status, outcome]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  roleKey:
                    type: string
                  status:
                    type: string
                    enum: [planned, running, waiting_node, done, blocked, failed]
                  outcome:
                    type: ["string", "null"]
            manualActions:
              type: array
              items:
                type: object
                required: [id, text, done]
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  done:
                    type: boolean
        caselloSkills:
          type: array
          items:
            type: object
            required: [code, version, content]
            properties:
              code:
                type: string
              version:
                type: ["integer", "null"]
                description: Versione fissata del catalogo; null per le skill specializzate
              content:
                type: string
        nodeSkills:
          type: array
          items:
            type: string
          description: Nomi delle skill del nodo richieste dal ruolo
        attachments:
          type: array
          items:
            type: object
            required: [id, name, contentType, sizeBytes, sha256]
            properties:
              id:
                type: integer
              name:
                type: string
              contentType:
                type: string
              sizeBytes:
                type: integer
              sha256:
                type: string

    ApiTokenInfo:
      type: object
      required: [id, name, createdAt, expiresAt, lastUsedAt, revokedAt, scopes]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    ApiTokenScope:
      type: string
      enum: [mcp, api:read, api:write, runs]
      description: "mcp = server MCP; api:read = solo lettura su /api; api:write = lettura e scrittura su /api; runs = solo avvio e lettura delle run (POST /agents/{id}/runs, GET /runs/{id} e /runs/{id}/steps)"

    ApiTokenCreate:
      type: object
      required: [name, expiresInDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
        scopes:
          type: array
          description: Almeno uno, senza ripetizioni; se omesso vale solo mcp
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    ApiTokenCreated:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: Valore del token, mostrato una sola volta
        info:
          $ref: "#/components/schemas/ApiTokenInfo"

    AiAccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Assente o "" = invariata; null la rimuove (solo custom); un valore la sostituisce
        baseUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Solo se il provider ha l'indirizzo modificabile (vedi AiProviderInfo.editableBaseUrl)
        allowPrivateNetwork:
          type: boolean
          description: Solo custom e provider non gestiti
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite

    AiModel:
      type: object
      required:
        [id, accountId, modelId, displayName, contextTokens, priceInput, priceOutput, priceSource, hidden,
         availability, supportsTools, status, deprecationDate, releasedAt, selectable, recommended, lastProbeAt,
         lastProbeOk, monthlyBudgetUsd]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        modelId:
          type: string
          description: Id del modello presso il provider (es. deepseek-chat)
        displayName:
          type: string
        contextTokens:
          type: ["integer", "null"]
        priceInput:
          type: ["number", "null"]
          description: USD per milione di token di input
        priceOutput:
          type: ["number", "null"]
          description: USD per milione di token di output
        priceSource:
          type: ["string", "null"]
          enum: [provider, manual, seed, catalog, null]
        hidden:
          type: boolean
        availability:
          type: string
          enum: [available, unavailable, unknown]
          description: Disponibilità vista da Casello (verifica dell'account, chiamate reali, prove)
        supportsTools:
          type: ["boolean", "null"]
          description: Supporto degli strumenti (null = non noto)
        status:
          type: string
          enum: [available, unavailable, retired]
          description: >-
            Stato effettivo: ritirato se il catalogo lo dà ritirato o la dismissione è passata, poi non
            disponibile, altrimenti disponibile
        deprecationDate:
          type: ["string", "null"]
          format: date-time
          description: Data di dismissione dal catalogo
        releasedAt:
          type: ["string", "null"]
          format: date-time
          description: Data di rilascio dal catalogo
        selectable:
          type: boolean
          description: Disponibile e con strumenti non esclusi
        recommended:
          type: boolean
          description: Preselezione del gruppo (solo in GET /ai/models)
        lastProbeAt:
          type: ["string", "null"]
          format: date-time
        lastProbeOk:
          type: ["boolean", "null"]
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD sul modello; null = nessun limite

    AiModelProbeResult:
      type: object
      required: [ok, error, costUsd, model]
      properties:
        ok:
          type: boolean
        error:
          type: ["string", "null"]
          description: Messaggio fisso dell'errore del provider
        costUsd:
          type: ["number", "null"]
          description: Costo della prova in USD (null se un prezzo manca o la prova non è riuscita)
        model:
          $ref: "#/components/schemas/AiModel"

    AiModelInput:
      type: object
      required: [modelId]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        contextTokens:
          type: ["integer", "null"]
          minimum: 1
          maximum: 100000000

    AiModelUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        hidden:
          type: boolean
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite

    AiModelGroup:
      type: object
      required: [account, models]
      properties:
        account:
          $ref: "#/components/schemas/AiAccount"
        models:
          type: array
          items:
            $ref: "#/components/schemas/AiModel"

    CostEstimate:
      type: object
      required: [maxUsd, typicalUsd]
      properties:
        maxUsd:
          type: ["number", "null"]
          description: Costo massimo in USD (null se un prezzo manca)
        typicalUsd:
          type: ["number", "null"]
          description: Costo tipico in USD (60% del massimo)

    # ── Catalogo dei modelli ───────────────────────────────────────────────────

    CatalogModelMode:
      type: string
      enum: [chat, embedding, image_generation, image_edit, audio_transcription, audio_speech, video_generation, rerank, moderation, ocr, search, realtime, responses, completion, other]

    CatalogOfferStatus:
      type: string
      enum: [available, deprecated, retired]

    CatalogCheapestOffer:
      type: object
      required: [provider, priceInput, priceOutput]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        priceInput:
          type: number
          description: USD per milione di token
        priceOutput:
          type: number
          description: USD per milione di token

    CatalogModelSummary:
      type: object
      required: [id, canonicalKey, author, family, version, mode, supportsTools, supportsVision, supportsReasoning, releasedAt, offerCount, providerCount, cheapestOffer, inMyAccounts]
      properties:
        id:
          type: integer
        canonicalKey:
          type: string
        author:
          type: string
        family:
          type: string
        version:
          type: string
        mode:
          $ref: "#/components/schemas/CatalogModelMode"
        supportsTools:
          type: ["boolean", "null"]
        supportsVision:
          type: ["boolean", "null"]
        supportsReasoning:
          type: ["boolean", "null"]
        releasedAt:
          type: ["string", "null"]
          format: date-time
        offerCount:
          type: integer
          description: Offerte visibili (senza le ritirate, salvo includeRetired)
        providerCount:
          type: integer
          description: Provider distinti tra le offerte visibili
        cheapestOffer:
          oneOf:
            - $ref: "#/components/schemas/CatalogCheapestOffer"
            - type: "null"
        inMyAccounts:
          type: boolean

    CatalogModelPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogModelSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CatalogOffer:
      type: object
      required: [id, provider, providerName, providerStatus, providerModelId, priceInput, priceOutput, contextTokens, supportsTools, status, deprecationDate, inMyAccounts]
      properties:
        id:
          type: integer
        provider:
          $ref: "#/components/schemas/AiProvider"
        providerName:
          type: string
        providerStatus:
          $ref: "#/components/schemas/AiProviderStatus"
        providerModelId:
          type: string
        priceInput:
          type: ["number", "null"]
          description: USD per milione di token
        priceOutput:
          type: ["number", "null"]
          description: USD per milione di token
        contextTokens:
          type: ["integer", "null"]
        supportsTools:
          type: ["boolean", "null"]
        status:
          $ref: "#/components/schemas/CatalogOfferStatus"
        deprecationDate:
          type: ["string", "null"]
          format: date-time
        inMyAccounts:
          type: boolean

    CatalogProvider:
      type: object
      required: [slug, name, protocol, status, origin, firstSeenAt, modelCount, hasMyAccount]
      properties:
        slug:
          $ref: "#/components/schemas/AiProvider"
        name:
          type: string
        protocol:
          $ref: "#/components/schemas/AiProviderProtocol"
        status:
          $ref: "#/components/schemas/AiProviderStatus"
        origin:
          type: string
          enum: [registry, discovered]
        firstSeenAt:
          type: string
          format: date-time
        modelCount:
          type: integer
        hasMyAccount:
          type: boolean

    ProviderIssueText:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
          description: Markdown in italiano

    CatalogChange:
      type: object
      required: [provider, modelId, version]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        modelId:
          type: string
        version:
          type: string

    CatalogSummaryView:
      type: object
      required: [firstRun, added, retired, deprecating, priceChanged, newProviders, accounts]
      properties:
        firstRun:
          type: boolean
        added:
          type: array
          items:
            $ref: "#/components/schemas/CatalogChange"
        retired:
          type: array
          items:
            $ref: "#/components/schemas/CatalogChange"
        deprecating:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CatalogChange"
              - type: object
                required: [deprecationDate]
                properties:
                  deprecationDate:
                    type: string
        priceChanged:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CatalogChange"
              - type: object
                required: [oldInput, oldOutput, newInput, newOutput]
                properties:
                  oldInput:
                    type: ["number", "null"]
                  oldOutput:
                    type: ["number", "null"]
                  newInput:
                    type: ["number", "null"]
                  newOutput:
                    type: ["number", "null"]
        newProviders:
          type: array
          description: Provider scoperti in questa esecuzione (non gestiti)
          items:
            type: object
            required: [slug, name, count]
            properties:
              slug:
                $ref: "#/components/schemas/AiProvider"
              name:
                type: string
              count:
                type: integer
        accounts:
          type: array
          description: Solo gli account dell'utente corrente
          items:
            type: object
            required: [accountId, accountName, missing]
            properties:
              accountId:
                type: integer
              accountName:
                type: string
              missing:
                type: array
                items:
                  type: string

    CatalogRunView:
      type: object
      required: [id, trigger, status, startedAt, finishedAt, error, summary]
      properties:
        id:
          type: integer
        trigger:
          type: string
          enum: [scheduled, manual]
        status:
          type: string
          enum: [running, completed, partial, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
        summary:
          oneOf:
            - $ref: "#/components/schemas/CatalogSummaryView"
            - type: "null"

    CatalogStatus:
      type: object
      required: [running, latest, lastCompleted]
      properties:
        running:
          type: boolean
        latest:
          oneOf:
            - $ref: "#/components/schemas/CatalogRunView"
            - type: "null"
        lastCompleted:
          description: Ultima esecuzione completed o partial, da cui leggere le novità
          oneOf:
            - $ref: "#/components/schemas/CatalogRunView"
            - type: "null"

    # ── Catalogo delle skill ────────────────────────────────────────────────────

    SkillKind:
      type: string
      enum: [casello, node]
      description: >-
        `casello` = istruzioni salvate in Casello; `node` = nome della skill installata sul nodo locale.

    CatalogSkill:
      type: object
      required: [code, name, description, kind, currentVersion, deprecated, content, toolHints, createdAt, updatedAt]
      description: Skill con il contenuto e i suggerimenti sugli strumenti della versione corrente
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/SkillKind"
        currentVersion:
          type: integer
        deprecated:
          type: boolean
        content:
          type: string
        toolHints:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CatalogSkillInput:
      type: object
      required: [code, name, kind, content]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/SkillKind"
        content:
          type: string
          description: "`casello`: istruzioni (max 20 000 caratteri); `node`: nome della skill sul nodo"
        toolHints:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100

    CatalogSkillUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        content:
          type: string
        toolHints:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100

    CatalogSkillVersion:
      type: object
      required: [code, version, content, toolHints, createdAt]
      properties:
        code:
          type: string
        version:
          type: integer
        content:
          type: string
        toolHints:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    # ── Squadre ─────────────────────────────────────────────────────────────────

    TeamRole:
      type: object
      required: [key, name, task, isLead, runsOn, aiModelId, tools, skills]
      description: Ruolo di un modello di squadra (manifesto in ingresso)
      properties:
        key:
          type: string
          pattern: "^[a-z0-9_-]{1,40}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        task:
          type: string
          maxLength: 8000
        isLead:
          type: boolean
        runsOn:
          type: string
          enum: [cloud, node]
        aiModelId:
          type: integer
          nullable: true
        tools:
          type: array
          items:
            type: integer
        skills:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"

    TeamRoleView:
      type: object
      required: [key, name, task, isLead, runsOn, model, tools, skills]
      description: Ruolo arricchito per la lettura (strumenti, skill e modello con nome)
      properties:
        key:
          type: string
        name:
          type: string
        task:
          type: string
        isLead:
          type: boolean
        runsOn:
          type: string
          enum: [cloud, node]
        model:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        tools:
          type: array
          items:
            type: object
            required: [id, name, available]
            description: Uno strumento eliminato dal catalogo ha solo `id`, `name` e `available` false
            properties:
              id:
                type: integer
              appId:
                type: integer
              appName:
                type: string
              name:
                type: string
              level:
                type: string
                enum: [L0, L1, L2, L3]
              available:
                type: boolean
        skills:
          type: array
          items:
            type: object
            required: [code, name, kind, deprecated]
            properties:
              code:
                type: string
              version:
                type: integer
              name:
                type: string
              kind:
                $ref: "#/components/schemas/SkillKind"
              deprecated:
                type: boolean
              local:
                type: boolean

    TeamTemplate:
      type: object
      required: [id, name, description, version, archived, instanceCount, roles, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        archived:
          type: boolean
        instanceCount:
          type: integer
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamRoleView"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamTemplateInput:
      type: object
      required: [name, roles]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamRole"

    TeamTemplateDeleteResult:
      type: object
      required: [deleted, archived]
      properties:
        deleted:
          type: boolean
        archived:
          type: boolean

    TeamInstanceRole:
      type: object
      required: [key, name, task, isLead, runsOn, aiModelId, tools, skills, localSkills]
      description: Ruolo di una squadra (manifesto in ingresso, skill fissate a una versione)
      properties:
        key:
          type: string
          pattern: "^[a-z0-9_-]{1,40}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        task:
          type: string
          maxLength: 8000
        isLead:
          type: boolean
        runsOn:
          type: string
          enum: [cloud, node]
        aiModelId:
          type: integer
          nullable: true
        tools:
          type: array
          items:
            type: integer
        skills:
          type: array
          items:
            type: object
            required: [code, version]
            properties:
              code:
                type: string
                pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
              version:
                type: integer
                minimum: 1
        localSkills:
          type: array
          description: Codici delle skill specializzate della squadra usate dal ruolo
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"

    TeamWorkRef:
      type: object
      required: [appId, type, id]
      description: Lavoro di riferimento di una squadra
      properties:
        appId:
          type: integer
        type:
          type: string
          pattern: "^[a-z0-9_-]{1,40}$"
        id:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          maxLength: 300

    TeamLocalSkill:
      type: object
      required: [code, name, kind, content]
      description: Skill specializzata di una sola squadra
      properties:
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/SkillKind"
        content:
          type: string
        toolHints:
          type: array
          items:
            type: string

    TeamInstanceCreate:
      type: object
      required: [name, ref]
      properties:
        templateId:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
        ref:
          $ref: "#/components/schemas/TeamWorkRef"
        roles:
          type: array
          description: Obbligatori senza modello, ignorati con il modello
          items:
            $ref: "#/components/schemas/TeamInstanceRole"

    TeamInstanceSave:
      type: object
      required: [name, roles, localSkills]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        refTitle:
          type: string
          maxLength: 300
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamInstanceRole"
        localSkills:
          type: array
          items:
            $ref: "#/components/schemas/TeamLocalSkill"
        status:
          type: string
          enum: [draft, active]
          description: >-
            Facoltativo e solo uguale allo stato attuale: si attiva con `POST /team-instances/{id}/activate` e una
            squadra attiva non torna in bozza.
        nodeWorkspace:
          type: string
          nullable: true
          maxLength: 300
          description: >-
            Spazio di lavoro sul nodo: percorso relativo, solo lettere, cifre, `._ -` e `/`, senza `/` iniziale né
            `..` (altrimenti 400 «spazio di lavoro non valido»). Omesso = invariato, null = tolto.

    TeamAttachment:
      type: object
      required: [id, name, contentType, sizeBytes, sha256, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        createdAt:
          type: string
          format: date-time

    TeamUpdateItem:
      type: object
      required: [id, type, roleKey, roleName]
      description: Aggiornamento proposto a una squadra
      properties:
        id:
          type: string
          description: "Deterministico: tipo:chiave del ruolo[:campo|codice della skill]"
        type:
          type: string
          enum: [role_added, role_removed, role_changed, skill_added, skill_removed, skill_version]
        roleKey:
          type: string
        roleName:
          type: string
        field:
          type: string
          enum: [name, task, isLead, runsOn, aiModelId, tools]
        from:
          description: Valore attuale nella squadra (role_changed)
        to:
          description: Valore proposto dal modello (role_changed) o ruolo da aggiungere (role_added)
        skillCode:
          type: string
        fromVersion:
          type: integer
        toVersion:
          type: integer

    TeamSaveAsTemplate:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [new, new_version]
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Obbligatorio con `new`; con `new_version` si ignora
        promote:
          type: array
          maxItems: 100
          description: Skill specializzate da promuovere nel catalogo, con il nuovo codice
          items:
            type: object
            required: [localCode, code]
            properties:
              localCode:
                type: string
              code:
                type: string

    TeamUpdateApply:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Id delle voci da applicare, senza ripetizioni
          items:
            type: string
            maxLength: 200

    TeamPlanTask:
      type: object
      required: [id, title, roleKey, instructions, status, outcome]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        title:
          type: string
          minLength: 1
          maxLength: 200
        roleKey:
          type: string
          minLength: 1
          maxLength: 40
        instructions:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [planned, running, waiting_node, done, blocked, failed]
        outcome:
          type: string
          nullable: true
          maxLength: 300

    TeamManualAction:
      type: object
      required: [id, text, done, doneAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        text:
          type: string
          minLength: 1
          maxLength: 500
        done:
          type: boolean
        doneAt:
          type: string
          format: date-time
          nullable: true

    TeamPlanInput:
      type: object
      required: [objective, constraints, openPoints, tasks, manualActions]
      properties:
        objective:
          type: string
          maxLength: 2000
        constraints:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 500
        openPoints:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 500
        tasks:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TeamPlanTask"
        manualActions:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TeamManualAction"

    TeamPlan:
      type: object
      required: [objective, constraints, openPoints, tasks, manualActions, version, status, approvedVersion, updatedAt]
      properties:
        objective:
          type: string
        constraints:
          type: array
          items:
            type: string
        openPoints:
          type: array
          items:
            type: string
        tasks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TeamPlanTask"
              - type: object
                required: [updatedAt]
                properties:
                  updatedAt:
                    type: string
                    format: date-time
        manualActions:
          type: array
          items:
            $ref: "#/components/schemas/TeamManualAction"
        version:
          type: integer
        status:
          type: string
          enum: [draft, proposed, approved]
        approvedVersion:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time

    TeamInstance:
      type: object
      required: [id, name, status, template, ref, roles, localSkills, createdAt, updatedAt, closedAt, activatedBy, monthlyBudgetUsd, lastTurnAt, nodeWorkspace]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [draft, active, closed]
        template:
          type: object
          nullable: true
          description: Modello di origine e versione copiata (null se creata da zero o modello eliminato)
          required: [id, name, version]
          properties:
            id:
              type: integer
            name:
              type: string
            version:
              type: integer
        ref:
          type: object
          required: [appId, appName, type, id, title]
          properties:
            appId:
              type: integer
            appName:
              type: string
            type:
              type: string
            id:
              type: string
            title:
              type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamRoleView"
        localSkills:
          type: array
          items:
            type: object
            required: [code, name, kind, content, toolHints]
            properties:
              code:
                type: string
              name:
                type: string
              kind:
                $ref: "#/components/schemas/SkillKind"
              content:
                type: string
              toolHints:
                type: array
                items:
                  type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        activatedBy:
          type: integer
          nullable: true
          description: Utente che ha attivato la squadra (riceve le voci in coda)
        monthlyBudgetUsd:
          type: number
          nullable: true
          description: Tetto mensile in USD di turni e compiti (null = nessun tetto)
        lastTurnAt:
          type: string
          format: date-time
          nullable: true
        nodeWorkspace:
          type: string
          nullable: true
          description: Spazio di lavoro sul nodo locale, percorso relativo alla radice del nodo (null = non impostato)

    TeamMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000

    TeamMessageResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean

    TeamBudgetInput:
      type: object
      required: [monthlyBudgetUsd]
      properties:
        monthlyBudgetUsd:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000000

    TeamEventsReadInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer

    TeamStep:
      type: object
      required: [id, position, type, toolName, args, ok, httpStatus, durationMs, error, createdAt]
      properties:
        id:
          type: integer
        position:
          type: integer
        type:
          type: string
          description: model (chiamata al modello), tool (chiamata a uno strumento) o queued (azione accodata)
        toolName:
          type: ["string", "null"]
        args:
          description: Argomenti con i valori sensibili oscurati
          nullable: true
        ok:
          type: ["boolean", "null"]
        httpStatus:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TeamTask:
      type: object
      required: [id, instanceId, planTaskId, roleKey, instructions, status, outcome, detail, error, aiModelId, promptTokens, completionTokens, cachedTokens, costUsd, createdAt, startedAt, finishedAt, nodeId, nodeName, leaseExpiresAt, sessionId]
      properties:
        id:
          type: integer
        instanceId:
          type: integer
        planTaskId:
          type: string
        roleKey:
          type: string
        instructions:
          type: string
        status:
          type: string
          enum: [queued, running, waiting_node, done, blocked, failed, cancelled]
        outcome:
          type: ["string", "null"]
        detail:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        aiModelId:
          type: ["integer", "null"]
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        cachedTokens:
          type: integer
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        nodeId:
          type: ["integer", "null"]
          description: Nodo locale a cui è assegnato il compito (solo ruoli `node`)
        nodeName:
          type: ["string", "null"]
          description: Nome del nodo (null se il compito non ha nodo o il nodo è stato eliminato)
        leaseExpiresAt:
          type: ["string", "null"]
          format: date-time
          description: Scadenza della lease del nodo (il token della lease non si espone mai)
        sessionId:
          type: ["string", "null"]
          description: Id della sessione di Claude Code sul nodo
        steps:
          type: array
          description: Passi dell'esecuzione (solo nel dettaglio)
          items:
            $ref: "#/components/schemas/TeamStep"

    TeamTurnReason:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [request, task_finished, decision, activation, restart]
        text:
          type: string
        taskId:
          type: integer
        number:
          type: integer
        outcome:
          type: string
          enum: [approved, rejected]
        note:
          type: ["string", "null"]

    TeamTurn:
      type: object
      required: [id, instanceId, reasons, status, error, aiModelId, promptTokens, completionTokens, cachedTokens, costUsd, createdAt, startedAt, finishedAt, steps]
      properties:
        id:
          type: integer
        instanceId:
          type: integer
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/TeamTurnReason"
        status:
          type: string
          enum: [queued, running, done, failed]
        error:
          type: ["string", "null"]
        aiModelId:
          type: ["integer", "null"]
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        cachedTokens:
          type: integer
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TeamStep"

    TeamEvent:
      type: object
      required: [id, instanceId, type, taskId, bulletin, detail, readAt, createdAt]
      properties:
        id:
          type: integer
        instanceId:
          type: integer
        type:
          type: string
          enum: [piano_proposto, compito_finito, bloccato, decisione_richiesta, azione_manuale_richiesta, lavoro_finito, interrotto]
        taskId:
          type: ["integer", "null"]
        bulletin:
          type: string
        detail:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
