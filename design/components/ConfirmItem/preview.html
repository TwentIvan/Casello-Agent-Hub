<!doctype html><html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap"><style>
body{margin:0;background:var(--surface-0);font-family:var(--font-sans);color:var(--ink)}
.w{padding:var(--space-3)}
.c{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3);max-width:560px}
.h{display:flex;align-items:center;gap:var(--space-2);font:500 12px/16px var(--font-mono);letter-spacing:.04em;color:var(--accent-text)}
.d{width:8px;height:8px;background:var(--accent)}
.t{font-weight:500;font-size:14px;line-height:20px;margin:var(--space-2) 0 0}
.m{font-size:12px;line-height:16px;color:var(--ink-muted);margin:2px 0 var(--space-2)}
.s{font-size:14px;line-height:20px;color:var(--ink);margin:0 0 var(--space-3)}
.cost{font:400 12px/16px var(--font-mono);color:var(--ink-muted);margin-left:auto}
.a{display:flex;gap:var(--space-2);align-items:center}
input{flex:1;min-width:0;font:400 14px/20px var(--font-sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:var(--space-2)}
input::placeholder{color:var(--ink-muted)}
button{font:500 14px/20px var(--font-sans);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.p{background:var(--accent);color:var(--on-accent)}.sb{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong)}
</style></head><body><div class="w"><div class="c">
<div class="h"><span class="d"></span>#2 · da confermare<span class="cost">0,42 €</span></div>
<p class="t">Pubblicare il commento sul work item</p>
<p class="m">Squadra Revisione · The Hub Up · WI 1174</p>
<p class="s">Il capo propone di rispondere al cliente con l'analisi della modifica e i tempi stimati.</p>
<div class="a"><input placeholder="Nota (facoltativa)" aria-label="Nota"><button class="sb">Rifiuta</button><button class="p">Approva</button></div>
</div></div><script></script></body></html>
