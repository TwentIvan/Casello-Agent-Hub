openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casello — hub per agentificare applicazioni
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login Google e sessione (tutte le altre route richiedono la sessione, tranne /healthz)
  - name: apps
    description: Applicazioni registrate
  - name: agents
    description: Configurazioni agenti
  - name: tools
    description: Catalogo dei tool delle app e loro assegnazione agli agenti
  - name: runs
    description: Esecuzioni degli agenti
  - name: dashboard
    description: Statistiche aggregate
  - name: models
    description: Modelli AI selezionabili

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  # /auth/login e /auth/callback sono redirect del flusso OIDC (Google), non chiamate JSON.

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Utente della sessione corrente
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Chiude la sessione
      responses:
        "204":
          description: Sessione chiusa

  # ─── Apps ───────────────────────────────────────────────────────────────────

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: Elenca tutte le app registrate
      responses:
        "200":
          description: Lista di app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
    post:
      operationId: createApp
      tags: [apps]
      summary: Registra una nuova app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: App creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"

  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Recupera una app per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: App trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Aggiorna una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdate"
      responses:
        "200":
          description: App aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Elimina una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: App eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Agents ─────────────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Elenca tutti gli agenti
      parameters:
        - name: appId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per app
      responses:
        "200":
          description: Lista di agenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Crea un nuovo agente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Recupera un agente per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Aggiorna un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Elimina un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Agente eliminato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: L'agente generale di un'app non si può eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Tools ──────────────────────────────────────────────────────────────────

  /apps/{id}/tools:
    get:
      operationId: listAppTools
      tags: [tools]
      summary: Elenca i tool del catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Lista di tool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppTool"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAppTool
      tags: [tools]
      summary: Aggiunge un tool al catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolInput"
      responses:
        "201":
          description: Tool creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/tools/{toolId}:
    patch:
      operationId: updateAppTool
      tags: [tools]
      summary: Aggiorna un tool del catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolUpdate"
      responses:
        "200":
          description: Tool aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAppTool
      tags: [tools]
      summary: Elimina un tool dal catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      responses:
        "204":
          description: Tool eliminato
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/tools:
    put:
      operationId: setAgentTools
      tags: [tools]
      summary: Imposta i tool di un agente
      description: >-
        Sostituisce l'insieme dei tool assegnati all'agente. I tool devono appartenere
        alla stessa app dell'agente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentToolsInput"
      responses:
        "200":
          description: Agente con i tool aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Runs ───────────────────────────────────────────────────────────────────

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Elenca tutte le esecuzioni (dalla più recente)
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per agente
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
          description: Filtra per stato
      responses:
        "200":
          description: Lista di esecuzioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /agents/{id}/runs:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Avvia un'esecuzione dell'agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, usato per i tool con identità user.
            Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      description: >-
        Crea la run e la avvia in background: risponde subito con la run in stato pending.
        Lo stato (running, poi succeeded o failed) si segue con GET /runs/{id}.
      responses:
        "202":
          description: Esecuzione avviata (stato pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Recupera un'esecuzione per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/steps:
    get:
      operationId: listRunSteps
      tags: [runs]
      summary: Elenca i passi di un'esecuzione (in ordine di posizione)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Passi dell'esecuzione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStep"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Riprende un'esecuzione in attesa del client
      description: >-
        Conferma o rifiuta l'azione in sospeso di una run in stato awaiting_client e la
        riavvia in background. Risponde 409 se la run non è in pausa o la pausa è scaduta.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, se quello dato all'avvio non è più in memoria
            (riavvio del server o pausa lunga). Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunResume"
      responses:
        "202":
          description: Esecuzione ripresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─── Dashboard ──────────────────────────────────────────────────────────────

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche aggregate del hub
      responses:
        "200":
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Models ─────────────────────────────────────────────────────────────────

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: Elenca i modelli selezionabili per gli agenti (model_name di LiteLLM)
      responses:
        "200":
          description: Lista di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    ToolIdParam:
      name: toolId
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflitto con lo stato corrente della risorsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Login richiesto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Auth ───────────────────────────────────────────────────────────────────

    CurrentUser:
      type: object
      required: [email, name, picture]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
        picture:
          type: ["string", "null"]

    # ── App ────────────────────────────────────────────────────────────────────

    AppStatus:
      type: string
      enum: [active, inactive]

    AuthConfig:
      type: object
      required: [header, scheme]
      description: Come l'app riceve le credenziali (scheme null = valore grezzo)
      properties:
        header:
          type: string
          minLength: 1
        scheme:
          type: ["string", "null"]

    App:
      type: object
      required: [id, name, slug, baseUrl, status, serviceSecretSet, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
        internalBaseUrl:
          type: ["string", "null"]
          description: URL raggiunto dall'esecutore al posto di baseUrl (rete interna)
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecretSet:
          type: boolean
          description: Indica se il segreto di servizio è impostato (il valore non è mai esposto)
        status:
          $ref: "#/components/schemas/AppStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppInput:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: string
          description: Segreto di servizio (solo scrittura, salvato cifrato)
        status:
          $ref: "#/components/schemas/AppStatus"

    AppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: ["string", "null"]
          description: Segreto di servizio (solo scrittura); null lo cancella
        status:
          $ref: "#/components/schemas/AppStatus"

    # ── Agent ──────────────────────────────────────────────────────────────────

    AgentStatus:
      type: string
      enum: [active, inactive, draft]

    AgentRole:
      type: string
      enum: [general, area]

    Agent:
      type: object
      required: [id, appId, name, status, role, defaultIdentity, toolIds, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        role:
          $ref: "#/components/schemas/AgentRole"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        toolIds:
          type: array
          items:
            type: integer
          description: ID dei tool del catalogo assegnati all'agente
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [appId, name]
      properties:
        appId:
          type: integer
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"

    AgentToolsInput:
      type: object
      required: [toolIds]
      properties:
        toolIds:
          type: array
          items:
            type: integer

    # ── Model ──────────────────────────────────────────────────────────────────

    Model:
      type: object
      required: [id, label, isDefault]
      properties:
        id:
          type: string
          description: model_name di LiteLLM, da usare in Agent.model
        label:
          type: string
        isDefault:
          type: boolean
          description: Modello usato quando un agente viene creato senza model

    # ── Tool ───────────────────────────────────────────────────────────────────

    ToolKind:
      type: string
      enum: [http, ui, composite]

    ToolIdentity:
      type: string
      enum: [user, service]

    ToolStatus:
      type: string
      enum: [draft, active, disabled]

    AppTool:
      type: object
      required:
        - id
        - appId
        - name
        - kind
        - identity
        - requiresConfirmation
        - readOnly
        - status
        - paramsSchema
        - definition
        - needsVerification
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema dei parametri accettati dal tool
        definition:
          type: object
          additionalProperties: true
          description: Definizione dell'esecuzione (dipende da kind)
        evidence:
          type: ["object", "null"]
          additionalProperties: true
          description: Evidenze da cui il tool è stato derivato
        needsVerification:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppToolInput:
      type: object
      required: [name, kind, definition]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["object", "null"]
          additionalProperties: true
        needsVerification:
          type: boolean

    AppToolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["object", "null"]
          additionalProperties: true
        needsVerification:
          type: boolean

    # ── Run ────────────────────────────────────────────────────────────────────

    RunStatus:
      type: string
      enum: [pending, running, succeeded, failed, awaiting_client, cancelled]

    Run:
      type: object
      required: [id, agentId, status, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: ["string", "null"]
          description: Input testuale passato all'agente
        output:
          type: ["string", "null"]
          description: Output prodotto dall'agente
        errorMessage:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        pendingAction:
          oneOf:
            - $ref: "#/components/schemas/PendingAction"
            - type: "null"
          description: Azione in attesa del client (solo con stato awaiting_client)
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]

    PendingActionKind:
      type: string
      enum: [confirmation, ui]

    PendingAction:
      type: object
      required: [kind, toolName, args, summary]
      properties:
        kind:
          $ref: "#/components/schemas/PendingActionKind"
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        summary:
          type: string

    RunStep:
      type: object
      required: [id, runId, position, type, createdAt]
      properties:
        id:
          type: integer
        runId:
          type: integer
        position:
          type: integer
        type:
          type: string
          description: "model (chiamata al modello) o tool (chiamata a un tool)"
        toolName:
          type: ["string", "null"]
        args:
          type: ["object", "null"]
          additionalProperties: true
        ok:
          type: ["boolean", "null"]
        httpStatus:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RunDecision:
      type: string
      enum: [approved, rejected]

    RunResume:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/RunDecision"

    RunTrigger:
      type: object
      properties:
        input:
          type: string
          description: Input testuale da passare all'agente

    # ── Dashboard ──────────────────────────────────────────────────────────────

    DashboardStats:
      type: object
      required: [totalApps, totalAgents, totalRuns, successfulRuns, failedRuns, activeAgents]
      properties:
        totalApps:
          type: integer
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalRuns:
          type: integer
        successfulRuns:
          type: integer
        failedRuns:
          type: integer
        avgDurationMs:
          type: ["number", "null"]
