<!doctype html><html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap"><style>
body{margin:0;background:var(--surface-1);font-family:var(--font-sans)}
.r{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-4) var(--space-3);flex-wrap:wrap}
button{font:500 14px/20px var(--font-sans);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.p{background:var(--accent);color:var(--on-accent)}
.s{background:var(--surface-2);color:var(--ink);border-color:var(--border-strong)}
.q{background:none;color:var(--accent-text);padding-left:var(--space-2);padding-right:var(--space-2)}
button:disabled{opacity:.45;cursor:not-allowed}
</style></head><body><div class="r">
<button class="p">Approva</button><button class="s">Rifiuta</button><button class="q">Scrivi al capo</button><button class="p" disabled>Approva</button>
</div><script></script></body></html>
