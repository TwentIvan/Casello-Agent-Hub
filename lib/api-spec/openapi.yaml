              schema:
                $ref: "#/components/schemas/CharacterConversationDetail"

  /character-conversations:
    get:
      operationId: listCharacterConversations
      tags: [characters]
      summary: Conversazioni dell'utente con un personaggio
      description: >-
        Dalla più recente (`updatedAt`), al massimo 100. Non comprende il filo di Alfred
        (si legge da `/characters/alfred/thread`).
      parameters:
        - name: character
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MemoryCharacter"
        - name: subjectType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CharacterSubjectType"
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Conversazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CharacterConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createCharacterConversation
      tags: [characters]
      summary: Apre una conversazione con un personaggio su un argomento
      description: >-
        Verifica l'argomento (404 «argomento non trovato» se manca o non è di quel personaggio). Il filo di Alfred
        non si crea qui. Il modello iniziale è quello del personaggio, poi il predefinito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterConversationCreate"
      responses:
        "201":
          description: Conversazione creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /character-conversations/{id}:
    get:
      operationId: getCharacterConversation
      tags: [characters]
      summary: Conversazione con messaggi e schede
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCharacterConversation
      tags: [characters]
      summary: Cambia il modello o il titolo della conversazione
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterConversationUpdate"
      responses:
        "200":
          description: Conversazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCharacterConversation
      tags: [characters]
      summary: Elimina la conversazione
      description: "Il filo di Alfred aperto non si elimina (409): si ricomincia."
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Conversazione eliminata
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /character-conversations/{id}/messages:
    post:
      operationId: sendCharacterMessage
      tags: [characters]
      summary: Invia un messaggio e avvia il turno del personaggio
      description: >-
        Risponde subito col messaggio dell'utente; il personaggio risponde in background (turnStatus running, poi idle).
        409 se un turno è già in corso, se l'argomento non esiste più, se la conversazione è archiviata o se è raggiunto
        il tetto di spesa. Massimo 10 messaggi al minuto per utente e personaggio.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterMessageCreate"
      responses:
        "202":
          description: Messaggio accettato, turno avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /character-proposals/{id}/decision:
    post:
      operationId: decideCharacterProposal
      tags: [characters]
      summary: Accetta o rifiuta una scheda di un personaggio
      description: >-
        Accettando la modifica si applica con le regole del salvataggio dell'oggetto; una scheda `decision` di Alfred
        approva o rifiuta la voce in coda. 409 se la scheda è già decisa o non più attuale (stale).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterProposalDecision"
      responses:
        "200":
          description: Scheda aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

