openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casello — hub per agentificare applicazioni
servers:
  - url: /api
    description: Base API path
tags:
  - name: nodes
    description: Nodi locali registrati e protocollo del nodo
  - name: health
    description: Health operations
  - name: embed
    description: Plugin incorporabile di Botcave (configurazione pubblica per le app ospiti)
  - name: auth
    description: Login (Google, GitHub) e sessione (tutte le altre route richiedono la sessione, tranne /healthz e /auth/providers)
  - name: apps
    description: Applicazioni registrate
  - name: agents
    description: Configurazioni agenti
  - name: tools
    description: Catalogo dei tool delle app e loro assegnazione agli agenti
  - name: runs
    description: Esecuzioni degli agenti
  - name: dashboard
    description: Statistiche aggregate
  - name: github
    description: Installazioni e repository dell'App GitHub di Casello
  - name: alfred
    description: Alfred, il maggiordomo vocale (modello, voce, sessioni)
  - name: ai
    description: Account AI dell'utente (provider, chiave, modelli e prezzi) e stima dei costi
  - name: catalog
    description: Catalogo dei modelli per provider e suo aggiornamento
  - name: architect
    description: Analisi dell'architetto (proposte su tool, agenti, skill, endpoint ed evoluzione) e skill degli agenti
  - name: pending-actions
    description: Coda delle azioni in attesa di conferma
  - name: plan-chat
    description: Chat con il bot sul piano di un'app (conversazioni, messaggi e proposte)
  - name: skills
    description: Catalogo delle skill con codice, versionate, usate dalle squadre di agenti
  - name: teams
    description: Modelli di squadra di agenti e le loro istanze
  - name: team-chat
    description: Chat di Lucius sulla definizione di una squadra (conversazioni, messaggi, schede) e scarico delle istruzioni dei ruoli
  - name: characters
    description: Conversazioni scritte con Alfred e Lucius (filo di Alfred, argomenti, messaggi, schede)
  - name: memories
    description: Memoria dei personaggi (Alfred, Lucius) - appunti e storico delle conversazioni

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /embed/config:
    get:
      operationId: getEmbedConfig
      tags: [embed]
      summary: Configurazione del plugin per un'origine ospite (pubblica)
      description: >-
        Dice se l'origine è tra quelle ammesse (EMBED_ALLOWED_ORIGINS) e con quale client OAuth si collega.
        Origine mancante o non valida: sempre allowed false, mai un errore.
      parameters:
        - name: origin
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Configurazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedConfig"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  # /auth/login e /auth/callback sono redirect del flusso OIDC (Google), non chiamate JSON.
  # Lo stesso vale per /auth/github/login, /auth/github/link e /auth/github/callback (GitHub).

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Utente della sessione corrente
      description: >-
        Con la sessione del login o con un token personale (api:read o api:write); auth dice quale.
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: Metodi di accesso disponibili
      description: Pubblica (senza sessione), serve alla pagina di login per mostrare i pulsanti.
      responses:
        "200":
          description: Metodi di accesso configurati sul server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Chiude la sessione
      responses:
        "204":
          description: Sessione chiusa

  /auth/github:
    delete:
      operationId: unlinkGithub
      tags: [auth]
      summary: Scollega l'account GitHub e le sue installazioni
      description: >
        Rimuove l'identità GitHub dell'utente corrente e le installazioni dell'App a lui collegate.
        Risponde 409 se l'utente resterebbe senza modo di entrare (nessun'altra identità ed email
        non ammessa).
      responses:
        "204":
          description: Account GitHub scollegato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/tokens:
    get:
      operationId: listApiTokens
      tags: [auth]
      summary: Elenca i token personali dell'utente
      description: >-
        Token personali (server MCP e /api, secondo gli ambiti), i più recenti per primi, revocati
        compresi. Non contiene mai il valore del token né il suo hash. Solo con il login: con un
        token risponde 403.
      responses:
        "200":
          description: Token dell'utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      tags: [auth]
      summary: Crea un token personale
      description: >-
        Il valore del token (prefisso cas_) compare solo in questa risposta: a riposo resta solo
        l'hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [auth]
      summary: Revoca un token personale
      description: 404 se il token non è dell'utente o è già revocato.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Token revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/oauth-grants:
    get:
      operationId: listOAuthGrants
      tags: [nodes]
      summary: Elenca le app collegate (connettore OAuth)
      description: >-
        Collegamenti non revocati dell'utente (app come Claude che usano `/mcp` con OAuth), dal più recente.
        Solo con il login: con un token risponde 403.
      responses:
        "200":
          description: Collegamenti attivi dell'utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthGrant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/oauth-grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      tags: [nodes]
      summary: Revoca un collegamento OAuth
      description: >-
        I token del collegamento smettono di valere subito. 404 "collegamento non trovato" se non è
        dell'utente o è già revocato. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Collegamento revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: Elenca i nodi locali dell'utente
      description: >-
        Nodi locali registrati, per nome, con le capacità dichiarate e se sono vivi (comunicato negli
        ultimi 2 minuti). Solo con il login: con un token risponde 403.
      responses:
        "200":
          description: Nodi dell'utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createNode
      tags: [nodes]
      summary: Registra un nodo locale
      description: >-
        Crea il nodo e il suo token d'ambito `node`, che compare solo in questa risposta. Nome unico per
        utente (409 "nome già usato"). Solo con il login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Nodo creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/nodes/{id}:
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Elimina un nodo locale e i suoi token
      description: 404 se il nodo non è dell'utente. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Nodo eliminato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/nodes/{id}/disable:
    post:
      operationId: disableNode
      tags: [nodes]
      summary: Disattiva un nodo locale
      description: Il token del nodo smette di valere sul protocollo. 404 se il nodo non è dell'utente. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Nodo disattivato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/nodes/{id}/token:
    post:
      operationId: regenerateNodeToken
      tags: [nodes]
      summary: Rigenera il token di un nodo locale
      description: >-
        Revoca i token precedenti del nodo e ne crea uno nuovo, mostrato solo in questa risposta.
        404 se il nodo non è dell'utente. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Nuovo token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/nodes/{id}/folders:
    get:
      operationId: getNodeFolders
      tags: [nodes]
      summary: Cartelle dichiarate da un nodo locale
      description: >-
        Sottocartelle della radice degli spazi di lavoro comunicate dal nodo con l'heartbeat (percorsi relativi,
        fino a 3 livelli e 2 000 voci; solo nomi di cartelle, mai file). `folders` null se il nodo non le ha mai
        comunicate. 404 se il nodo non è dell'utente. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cartelle del nodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeFolders"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /node/heartbeat:
    post:
      operationId: nodeHeartbeat
      tags: [nodes]
      summary: Heartbeat del nodo locale
      description: >-
        Protocollo dei nodi: solo con il token d'ambito `node` di un nodo attivo (sessione e token
        personali: 403). Aggiorna le capacità dichiarate e `last_seen_at`; risponde con il numero di compiti
        che il nodo potrebbe prendere. 6 al minuto per nodo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCapabilities"
      responses:
        "200":
          description: Heartbeat registrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeHeartbeat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /node/claim:
    post:
      operationId: nodeClaim
      tags: [nodes]
      summary: Prende in carico un compito in attesa
      description: >-
        Il compito `waiting_node` più vecchio di una squadra attiva dell'utente del nodo, il cui ruolo ha tutte le
        skill `node` dichiarate dal nodo, nel rispetto di `maxConcurrent`; lo porta a `running` con una lease di 15
        minuti. 204 se non c'è niente da prendere. 6 al minuto per nodo.
      responses:
        "200":
          description: Pacchetto del compito preso in carico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTaskPackage"
        "204":
          description: Nessun compito da prendere
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /node/tasks/{id}/ping:
    post:
      operationId: nodePing
      tags: [nodes]
      summary: Rinnova la lease di un compito
      description: >-
        Rinnova di 15 minuti la lease del compito preso dal nodo. Lease non valida o scaduta → 409. 4 al minuto per
        compito.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeLease"
      responses:
        "200":
          description: Lease rinnovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeLeaseRenewed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /node/tasks/{id}/report:
    post:
      operationId: nodeReport
      tags: [nodes]
      summary: Riferisce l'esito di un compito
      description: >-
        Chiude il compito come i compiti cloud: stato ed esito nel PLAN, evento, turno del capo. Il costo riferito
        conta solo nel tetto della squadra. Lease non valida o scaduta → 409 e nulla salvato.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeReport"
      responses:
        "204":
          description: Esito registrato
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /node/tasks/{id}/attachments/{attachmentId}:
    get:
      operationId: nodeGetAttachment
      tags: [nodes]
      summary: Scarica un allegato citato dal compito
      description: >-
        Contenuto di un allegato citato dal compito preso dal nodo, con l'header `X-Lease-Token`. Lease non valida o
        scaduta → 409; allegato non citato dal compito o di un'altra squadra → 404. Un allegato eliminato dopo
        l'assegnazione si scarica comunque.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/AttachmentIdParam"
        - name: X-Lease-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contenuto dell'allegato
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/default-model:
    get:
      operationId: getDefaultModel
      tags: [ai]
      summary: Modello predefinito dell'utente
      description: >-
        Modello proposto per gli agenti che Casello crea (agente generale di un'app nuova, agenti
        approvati dall'architetto, agenti creati senza modello). Null se non impostato o se il modello
        è stato eliminato. Solo con il login: con un token risponde 403.
      responses:
        "200":
          description: Modello predefinito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setDefaultModel
      tags: [ai]
      summary: Imposta o toglie il modello predefinito dell'utente
      description: >-
        Il modello deve essere di un account AI dell'utente (400 "modello non disponibile"
        altrimenti); null lo toglie. Solo con il login: con un token risponde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultModel"
      responses:
        "200":
          description: Modello predefinito aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/centralino-model:
    get:
      operationId: getCentralinoModel
      tags: [ai]
      summary: Modello del centralino
      description: >-
        Modello con cui il centralino riassume lo stato delle squadre quando sono più di 5. Null se non
        impostato (vale il modello predefinito). Solo con il login: con un token risponde 403.
      responses:
        "200":
          description: Modello del centralino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentralinoModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setCentralinoModel
      tags: [ai]
      summary: Imposta o toglie il modello del centralino
      description: >-
        Il modello deve essere di un account AI dell'utente (400 "modello non disponibile"
        altrimenti); null lo toglie. Solo con il login: con un token risponde 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentralinoModel"
      responses:
        "200":
          description: Modello del centralino aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentralinoModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/characters:
    get:
      operationId: getCharacterSettings
      tags: [alfred]
      summary: Modelli e tetti di Alfred e Lucius nelle aree
      description: >-
        Modello della chat e tetto mensile di Alfred, modello e tetto mensile di Lucius. Con la spesa del
        mese di ciascun personaggio e il numero di esecuzioni senza prezzo. Null = modello predefinito / nessun tetto. Con il login o con il token del pannello incorporato; con un altro token risponde 403.
      responses:
        "200":
          description: Impostazioni dei personaggi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSettingsView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateCharacterSettings
      tags: [alfred]
      summary: Imposta modelli e tetti di Alfred e Lucius
      description: >-
        Sostituisce tutti e quattro i campi. I modelli devono essere di un account AI dell'utente (400
        "modello non disponibile"); i tetti sono numeri >= 0 (400 altrimenti). Solo con il login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterSettings"
      responses:
        "200":
          description: Impostazioni aggiornate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterSettingsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/alfred:
    get:
      operationId: getAlfredSettings
      tags: [alfred]
      summary: Modello e voce di Alfred
      description: >-
        Modello e voce salvati, più i modelli idonei ad Alfred dell'utente (account Gemini, nome con live o
        native-audio, non ritirati; senza chiamare Gemini). Solo con il login: con un token risponde 403.
      responses:
        "200":
          description: Impostazioni di Alfred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfredSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setAlfredSettings
      tags: [alfred]
      summary: Imposta modello e voce di Alfred
      description: >-
        Il modello deve essere di un account AI dell'utente (400 "modello non disponibile"), idoneo per nome e
        con bidiGenerateContent secondo Gemini (400 "modello non adatto ad Alfred"; 502 se Gemini non risponde
        o rifiuta la chiave). Voce fuori elenco: 400 "voce non disponibile". Con aiModelId null il modello si
        toglie senza chiamare Gemini; senza voce questa resta com'è. Solo con il login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfredChoice"
      responses:
        "200":
          description: Impostazioni di Alfred aggiornate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfredSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"

  /alfred/sessions:
    post:
      operationId: startAlfredSession
      tags: [alfred]
      summary: Avvia una sessione di Alfred
      description: >-
        Chiude le altre sessioni attive dell'utente, crea la sessione e un token temporaneo di Gemini Live con
        modello, istruzioni, voce e strumenti già fissati. 409 senza modello di Alfred, con modello non più
        disponibile o con un tetto di spesa raggiunto; 502 se Gemini non risponde o rifiuta la chiave; massimo
        10 avvii al minuto per utente. Solo con il login.
      responses:
        "201":
          description: Sessione avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfredSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /alfred/sessions/{id}/renew:
    post:
      operationId: renewAlfredSession
      tags: [alfred]
      summary: Nuovo token per una sessione di Alfred attiva
      description: >-
        Ricontrolla modello e tetti e rilascia un nuovo token temporaneo (scadenza dei 30 minuti o
        riconnessione). Con `resumptionHandle` (1..4096 caratteri) il token porta l'handle di ripresa di
        Gemini, così la conversazione continua. Stesso limite di 10 al minuto dell'avvio. Sessione chiusa o
        altrui: 404 "sessione non trovata". Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfredRenewBody"
      responses:
        "200":
          description: Nuovo token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfredSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /alfred/sessions/{id}/usage:
    post:
      operationId: recordAlfredUsage
      tags: [alfred]
      summary: Registra i token consumati da una sessione di Alfred
      description: >-
        Contatori cumulativi della sessione (interi non negativi): Casello tiene il massimo tra il valore
        salvato e quello ricevuto e ricalcola il costo. Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfredUsageBody"
      responses:
        "204":
          description: Consumo registrato
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /alfred/sessions/{id}/close:
    post:
      operationId: closeAlfredSession
      tags: [alfred]
      summary: Chiude una sessione di Alfred
      description: >-
        Con `transcript` (facoltativo, al massimo 20 000 caratteri) Botcave ne ricava, in background, un
        riassunto per lo storico di Alfred; la trascrizione non si salva mai. Oltre il limite: 400.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfredCloseBody"
      responses:
        "204":
          description: Sessione chiusa
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /alfred/sessions/{id}/tools/{name}:
    post:
      operationId: runAlfredTool
      tags: [alfred]
      summary: Esegue uno strumento di Alfred
      description: >-
        Il browser inoltra qui le chiamate di strumento di Gemini Live. Strumento sconosciuto o sessione non
        attiva: 404; altrimenti 200 con `ok` vero e `result`, oppure `ok` falso e `error` (messaggio fisso).
        Limite di 60 chiamate al minuto per utente (429). Solo con il login.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfredToolBody"
      responses:
        "200":
          description: Esito dello strumento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfredToolResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ─── Apps ───────────────────────────────────────────────────────────────────

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: Elenca tutte le app registrate
      responses:
        "200":
          description: Lista di app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
    post:
      operationId: createApp
      tags: [apps]
      summary: Registra una nuova app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: App creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Recupera una app per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: App trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Aggiorna una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdate"
      responses:
        "200":
          description: App aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Elimina una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: App eliminata
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: L'app è il lavoro di riferimento di una o più squadre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Agents ─────────────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Elenca tutti gli agenti
      parameters:
        - name: appId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per app
      responses:
        "200":
          description: Lista di agenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Crea un nuovo agente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Recupera un agente per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Aggiorna un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Elimina un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Agente eliminato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: L'agente generale di un'app non si può eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Tools ──────────────────────────────────────────────────────────────────

  /apps/{id}/mcp-tools/refresh:
    post:
      operationId: refreshAppMcpTools
      tags: [tools]
      summary: Aggiorna il catalogo dagli strumenti del server MCP dell'app
      description: >-
        Legge gli strumenti del server MCP dell'app: i nuovi entrano come bozza, quelli esistenti aggiornano
        descrizione, schema e livello, quelli spariti dal server vengono disattivati; un nome uguale a un tool
        non MCP non cambia nulla e finisce in `conflicts`. Massimo 6 al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esito della sincronizzazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpSyncResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}/tools:
    get:
      operationId: listAppTools
      tags: [tools]
      summary: Elenca i tool del catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Lista di tool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppTool"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAppTool
      tags: [tools]
      summary: Aggiunge un tool al catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolInput"
      responses:
        "201":
          description: Tool creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/tools/{toolId}:
    patch:
      operationId: updateAppTool
      tags: [tools]
      summary: Aggiorna un tool del catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolUpdate"
      responses:
        "200":
          description: Tool aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAppTool
      tags: [tools]
      summary: Elimina un tool dal catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      responses:
        "204":
          description: Tool eliminato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Il tool ha azioni in coda o già decise (si disattiva invece di eliminarlo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apps/{id}/agent-models:
    put:
      operationId: setAppAgentModels
      tags: [agents]
      summary: Imposta il modello di più agenti di un'app
      description: >-
        Assegna in una sola chiamata il modello di ciascun agente indicato (null = nessun modello).
        Tutto o niente: se un agente non è dell'app o un modello non è dell'utente non cambia nulla.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelAssignments"
      responses:
        "200":
          description: Gli agenti aggiornati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/tools:
    put:
      operationId: setAgentTools
      tags: [tools]
      summary: Imposta i tool di un agente
      description: >-
        Sostituisce l'insieme dei tool assegnati all'agente. I tool devono appartenere
        alla stessa app dell'agente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentToolsInput"
      responses:
        "200":
          description: Agente con i tool aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Runs ───────────────────────────────────────────────────────────────────

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Elenca le esecuzioni (dalla più recente, paginate)
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per agente
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
          description: Filtra per stato
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Numero massimo di esecuzioni restituite
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Restituisce solo le esecuzioni con id minore di questo (paginazione a cursore)
      responses:
        "200":
          description: Lista di esecuzioni, dalla più recente (id decrescente)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /agents/{id}/runs:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Avvia un'esecuzione dell'agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, usato per i tool con identità user.
            Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      description: >-
        Crea la run in stato pending e la mette in coda: risponde subito. La avvia lo scheduler quando c'è
        posto (al massimo 2 run in corso per agente e 6 in tutto, in ordine di creazione); i tetti di spesa
        si ricontrollano alla partenza. Lo stato (running, poi succeeded o failed) si segue con GET /runs/{id}.
      responses:
        "202":
          description: Run in coda (stato pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Agente senza modello ("scegli un modello per l'agente") o tetto di spesa mensile raggiunto
            (dell'agente o dell'utente che paga il modello): la run non viene creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            Troppe run in attesa per questo agente (al massimo 200): la run non viene creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Recupera un'esecuzione per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/steps:
    get:
      operationId: listRunSteps
      tags: [runs]
      summary: Elenca i passi di un'esecuzione (in ordine di posizione)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Passi dell'esecuzione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStep"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Annulla un'esecuzione non ancora conclusa
      description: >-
        Porta a cancelled una run pending o running, interrompe le chiamate
        in corso (modello e tool) e non avvia altri passi. Durata, token e costo già registrati
        restano. Risponde 409 se la run è già conclusa (succeeded, failed, cancelled).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione annullata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─── Architetto ─────────────────────────────────────────────────────────────

  /apps/{id}/analyses:
    get:
      operationId: listAnalyses
      tags: [architect]
      summary: Elenca le analisi dell'architetto di una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startAnalysis
      tags: [architect]
      summary: Avvia un'analisi leggendo le sorgenti configurate sull'app
      description: >-
        Avvia in background l'analisi con le sorgenti dell'app (repository GitHub, OpenAPI,
        descrizione funzionale). Risponde 409 se per l'app c'è già un'analisi in corso o se chi paga il
        modello ha raggiunto il tetto di spesa mensile (solo executor cloud). Con
        sourceInstallationId non serve il token manuale, ma l'utente corrente deve avere quell'installazione
        (altrimenti 403 "installazione non trovata o non tua"). Con executor local l'analisi resta in coda
        finché un agente locale (via MCP) non la prende: niente modello (aiModelId e model vietati) e
        nessun controllo sulle sorgenti, il codice lo legge l'agente sul proprio clone.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStart"
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/analyses/zip:
    post:
      operationId: startZipAnalysis
      tags: [architect]
      summary: Avvia un'analisi caricando il codice come archivio zip
      description: >-
        Il corpo è l'archivio zip (application/zip, al massimo 50 MB). Il codice resta solo in
        memoria per la durata dell'analisi. Risponde 409 se per l'app c'è già un'analisi in corso.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: aiModelId
          in: query
          required: false
          schema:
            type: integer
          description: Modello di un account AI (obbligatorio, altrimenti 400 "scegli un modello")
        - name: maxTokens
          in: query
          required: false
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)
        - name: executor
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AnalysisExecutor"
          description: Con local risponde 400 "con l'agente locale lo zip non serve"
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [architect]
      summary: Recupera un'analisi con mappa, log ed elementi della proposta
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /analyses/{id}/release:
    post:
      operationId: releaseAnalysis
      tags: [architect]
      summary: Rilascia la lease di un'analisi locale, che torna in coda
      description: >-
        Solo per un'analisi locale in coda o in corso (altrimenti 409): la lease dell'agente viene
        azzerata e un altro agente (o lo stesso) può riprenderla dalla prima fase senza esito.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi di nuovo in coda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /analyses/{id}/cancel:
    post:
      operationId: cancelAnalysis
      tags: [architect]
      summary: Annulla un'analisi locale
      description: >-
        Solo per un'analisi locale in coda o in corso (altrimenti 409): si chiude come failed con
        errore "annullata dalla console"; gli elementi già consegnati restano.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi annullata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /analyses/{id}/issues:
    get:
      operationId: exportAnalysisIssues
      tags: [architect]
      summary: Esporta in Markdown gli elementi di un capitolo o di tutta l'analisi
      description: >-
        Con `chapter`: issue per endpoint, completion ed evolution, documentazione compatta per
        tool, agent e skill. Senza `chapter`: un unico Markdown con tutti i capitoli non vuoti
        nell'ordine delle fasi, ciascuno sotto un titolo `#`.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: chapter
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AnalysisChapter"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemStatus"
          description: Stato degli elementi da esportare (default approved)
      responses:
        "200":
          description: Issue in Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /analysis-items/{id}:
    patch:
      operationId: updateAnalysisItem
      tags: [architect]
      summary: Rivede un elemento della proposta (approva, scarta, rimanda, modifica)
      description: >-
        Approvando un elemento dei capitoli tool, agent o skill la proposta viene applicata.
        Se non è applicabile risponde 400 e l'elemento resta in attesa.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisItemUpdate"
      responses:
        "200":
          description: Elemento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /agents/{id}/skills:
    get:
      operationId: listAgentSkills
      tags: [architect]
      summary: Elenca le skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Skill dell'agente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSkill"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/skills/{skillId}:
    delete:
      operationId: deleteAgentSkill
      tags: [architect]
      summary: Elimina una skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/SkillIdParam"
      responses:
        "204":
          description: Skill eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── GitHub ─────────────────────────────────────────────────────────────────

  /github/installations:
    get:
      operationId: listGithubInstallations
      tags: [github]
      summary: Installazioni dell'App GitHub collegate all'utente
      description: >-
        Installazioni salvate per l'utente corrente, con il link per gestirle e quello per
        installare l'App su un altro account. 404 se GitHub non è configurato.
      responses:
        "200":
          description: Installazioni e link di installazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubInstallations"
        "404":
          $ref: "#/components/responses/NotFound"

  /github/repos:
    get:
      operationId: listGithubRepos
      tags: [github]
      summary: Repository visibili all'App nelle installazioni dell'utente
      description: >-
        Repository di tutte le installazioni dell'utente, ordinati per nome completo, senza doppioni.
        Un'installazione revocata (401/404 da GitHub) viene eliminata per l'utente e saltata.
        404 se GitHub non è configurato; 502 se GitHub non risponde.
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GithubRepo"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ─── Dashboard ──────────────────────────────────────────────────────────────

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche aggregate del hub
      responses:
        "200":
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /budget:
    get:
      operationId: getBudget
      tags: [dashboard]
      summary: Tetti e spesa del mese corrente
      description: >-
        Spesa del mese (calendario, ora italiana) sugli account AI dell'utente corrente e sugli agenti con
        un tetto, più le run in corso o in attesa che spendono su un tetto già raggiunto (da poter annullare).
      responses:
        "200":
          description: Riepilogo del mese
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    put:
      operationId: updateBudget
      tags: [dashboard]
      summary: Imposta il tetto di spesa mensile dell'utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Riepilogo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Catalogo delle skill ───────────────────────────────────────────────────

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: Elenca le skill del catalogo
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SkillKind"
        - name: q
          in: query
          required: false
          description: Ricerca (senza maiuscole) nel codice e nel nome
          schema:
            type: string
            maxLength: 100
        - name: deprecated
          in: query
          required: false
          description: Filtra per stato di deprecazione, `true` o `false` (se omesso, tutte)
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Skill del catalogo, in ordine di codice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createSkill
      tags: [skills]
      summary: Crea una skill (versione 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSkillInput"
      responses:
        "201":
          description: Skill creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /skills/{code}:
    get:
      operationId: getSkill
      tags: [skills]
      summary: Dettaglio di una skill (versione corrente)
      parameters:
        - $ref: "#/components/parameters/SkillCodeParam"
      responses:
        "200":
          description: Skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSkill"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSkill
      tags: [skills]
      summary: Aggiorna una skill
      description: >-
        Nome e descrizione si cambiano senza nuova versione; `content` o `toolHints` creano la versione
        successiva (massimo 200 versioni per skill, oltre 409).
      parameters:
        - $ref: "#/components/parameters/SkillCodeParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSkillUpdate"
      responses:
        "200":
          description: Skill aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /skills/{code}/deprecate:
    post:
      operationId: deprecateSkill
      tags: [skills]
      summary: Depreca una skill
      description: Resta valida dove è già usata, ma non si può aggiungere a ruoli nuovi o modificati.
      parameters:
        - $ref: "#/components/parameters/SkillCodeParam"
      responses:
        "200":
          description: Skill deprecata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSkill"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills/{code}/versions:
    get:
      operationId: listSkillVersions
      tags: [skills]
      summary: Elenca le versioni di una skill
      parameters:
        - $ref: "#/components/parameters/SkillCodeParam"
      responses:
        "200":
          description: Versioni, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogSkillVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills/{code}/versions/{version}:
    get:
      operationId: getSkillVersion
      tags: [skills]
      summary: Una versione di una skill
      parameters:
        - $ref: "#/components/parameters/SkillCodeParam"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Versione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSkillVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Modelli di squadra ─────────────────────────────────────────────────────

  /team-templates:
    get:
      operationId: listTeamTemplates
      tags: [teams]
      summary: Elenca i modelli di squadra
      parameters:
        - name: archived
          in: query
          required: false
          description: "`true` per i modelli archiviati (default, solo quelli non archiviati)"
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Modelli, dal più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createTeamTemplate
      tags: [teams]
      summary: Crea un modello di squadra (versione 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTemplateInput"
      responses:
        "201":
          description: Modello creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-templates/{id}:
    get:
      operationId: getTeamTemplate
      tags: [teams]
      summary: Dettaglio di un modello (versione corrente)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Modello
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveTeamTemplate
      tags: [teams]
      summary: Salva il modello (crea la versione successiva)
      description: >-
        Tutto o niente, se una regola è violata non nasce nessuna versione.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTemplateInput"
      responses:
        "200":
          description: Modello salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTeamTemplate
      tags: [teams]
      summary: Elimina il modello (archivia se ha istanze)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTemplateDeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-templates/{id}/versions/{version}:
    get:
      operationId: getTeamTemplateVersion
      tags: [teams]
      summary: I ruoli di una versione del modello
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Ruoli della versione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamRoleView"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Istanze di squadra ─────────────────────────────────────────────────────

  /team-instances:
    get:
      operationId: listTeamInstances
      tags: [teams]
      summary: Elenca le squadre (istanze), dalla modificata più di recente
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, closed]
        - name: appId
          in: query
          required: false
          schema:
            type: integer
          description: App del lavoro di riferimento
        - name: refType
          in: query
          required: false
          schema:
            type: string
        - name: refId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Squadre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createTeamInstance
      tags: [teams]
      summary: Crea una squadra per un lavoro (da un modello o da zero)
      description: >-
        Con `templateId` copia la versione corrente del modello fissando ogni skill alla sua versione
        corrente; senza modello `roles` è obbligatorio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInstanceCreate"
      responses:
        "201":
          description: Squadra creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}:
    get:
      operationId: getTeamInstance
      tags: [teams]
      summary: Dettaglio di una squadra
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Squadra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveTeamInstance
      tags: [teams]
      summary: Salva la squadra (ruoli e skill specializzate)
      description: >-
        Tutto o niente. Le skill specializzate inviate sostituiscono quelle esistenti. Una squadra chiusa
        non si salva (409). Il salvataggio non cambia lo stato: `status` diverso da quello attuale → 400 («usa
        Attiva per avviare la squadra», da bozza ad attiva) o 409 («una squadra attiva non torna in bozza:
        chiudila»).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInstanceSave"
      responses:
        "200":
          description: Squadra salvata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/attachments:
    get:
      operationId: listTeamAttachments
      tags: [teams]
      summary: Allegati della squadra (non eliminati)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Allegati, dal più vecchio (senza contenuto)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamAttachment"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadTeamAttachment
      tags: [teams]
      summary: Carica un allegato della squadra
      description: >-
        Il corpo è il file grezzo (al massimo 10 MB; 50 MB di allegati non eliminati per squadra), il nome nell'header
        `X-Attachment-Name` (anche codificato con encodeURIComponent; senza `/`, `\`, `..`, max 200 caratteri) e il
        tipo nel `Content-Type`. Squadra chiusa → 409; nome già usato da un allegato non eliminato della squadra (senza
        distinguere le maiuscole) → 409 «nome già usato».
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-Attachment-Name
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Allegato salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamAttachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /team-instances/{id}/attachments/{attachmentId}:
    get:
      operationId: getTeamAttachment
      tags: [teams]
      summary: Scarica un allegato della squadra
      description: >-
        Risponde con `Content-Disposition: attachment` e `X-Content-Type-Options: nosniff`.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/AttachmentIdParam"
      responses:
        "200":
          description: Contenuto dell'allegato
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTeamAttachment
      tags: [teams]
      summary: Elimina un allegato della squadra
      description: Lo toglie dall'elenco e dal limite di spazio; i compiti del nodo che lo citano già lo scaricano comunque.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/AttachmentIdParam"
      responses:
        "204":
          description: Allegato eliminato
        "404":
          $ref: "#/components/responses/NotFound"

  /team-instances/{id}/close:
    post:
      operationId: closeTeamInstance
      tags: [teams]
      summary: Chiude la squadra (non si riapre)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Squadra chiusa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/updates:
    get:
      operationId: getTeamInstanceUpdates
      tags: [teams]
      summary: Aggiornamenti proposti alla squadra
      description: >-
        Differenze tra la versione del modello copiata e quella corrente (confronto di contenuto per chiave
        del ruolo) e skill del catalogo fissate a una versione non più recente. Squadra chiusa → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Aggiornamenti proposti
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamUpdateItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/updates/apply:
    post:
      operationId: applyTeamInstanceUpdates
      tags: [teams]
      summary: Applica gli aggiornamenti scelti
      description: >-
        Tutto o niente. Se una voce non è più tra quelle attuali o la squadra è cambiata nel frattempo → 409
        «aggiornamenti cambiati: ricarica». Se non restano voci del modello la squadra passa alla sua versione
        corrente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateApply"
      responses:
        "200":
          description: Squadra aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/save-as-template:
    post:
      operationId: saveTeamInstanceAsTemplate
      tags: [teams]
      summary: Salva la squadra come modello
      description: >-
        `new` crea un modello nuovo (nome obbligatorio); `new_version` crea la versione successiva del modello
        d'origine (409 se la squadra non ha un modello o è archiviato). Le skill del catalogo perdono la
        versione; le skill specializzate in `promote` entrano nel catalogo (versione 1) con il codice indicato,
        le altre vengono tolte dai ruoli. Tutto o niente; un codice già usato nel catalogo → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSaveAsTemplate"
      responses:
        "201":
          description: Modello creato o nuova versione salvata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/plan:
    get:
      operationId: getTeamPlan
      tags: [teams]
      summary: PLAN corrente della squadra
      description: Se la squadra non ha ancora un PLAN ne crea uno `draft` vuoto (versione 1).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: PLAN corrente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPlan"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveTeamPlan
      tags: [teams]
      summary: Correzione del PLAN da parte dell'utente
      description: >-
        Salva il PLAN completo come versione nuova già `approved`, rifiuta le proposte di PLAN ancora in coda
        della squadra («superata dalla modifica dell'utente») e accoda un turno del capo. `roleKey` dei compiti
        deve esistere tra i ruoli (400). Squadra chiusa → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPlanInput"
      responses:
        "200":
          description: PLAN salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/plan/manual-actions/{actionId}/done:
    post:
      operationId: markTeamManualActionDone
      tags: [teams]
      summary: Segna come fatta un'azione manuale del PLAN
      description: Aggiorna il PLAN corrente senza creare una versione nuova. Squadra chiusa → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PLAN aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPlan"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/activate:
    post:
      operationId: activateTeamInstance
      tags: [teams]
      summary: Attiva la squadra
      description: >-
        `draft` → `active`: chi attiva riceve le voci in coda della squadra. Crea il PLAN `draft` se manca e accoda
        un turno del capo (motivo `activation`). Squadra già attiva o chiusa → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Squadra attivata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/messages:
    post:
      operationId: sendTeamMessage
      tags: [teams]
      summary: Scrive al capo della squadra
      description: >-
        Accoda un turno del capo con motivo `request` (o aggiunge il motivo al turno già in coda). Solo squadre
        attive (409). 10 messaggi al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMessageInput"
      responses:
        "202":
          description: Messaggio accodato al capo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /team-instances/{id}/budget:
    put:
      operationId: setTeamBudget
      tags: [teams]
      summary: Imposta il tetto di spesa mensile della squadra
      description: >-
        Tetto in USD sulla spesa del mese di turni e compiti della squadra (null = nessun tetto). Raggiunto il
        tetto, turni e compiti non partono. Squadra chiusa → 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamBudgetInput"
      responses:
        "200":
          description: Tetto salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/tasks:
    get:
      operationId: listTeamTasks
      tags: [teams]
      summary: Esecuzioni dei compiti della squadra, dalla più recente (senza passi)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Compiti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamTask"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-instances/{id}/tasks/{taskId}:
    get:
      operationId: getTeamTask
      tags: [teams]
      summary: Esecuzione di un compito con i passi
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compito con i passi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTask"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-instances/{id}/turns:
    get:
      operationId: listTeamTurns
      tags: [teams]
      summary: Turni del capo, dal più recente (ultimi 50), con i passi
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Turni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamTurn"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-instances/{id}/events:
    get:
      operationId: listTeamEvents
      tags: [teams]
      summary: Eventi della squadra, dal più recente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-events:
    get:
      operationId: listUnreadTeamEvents
      tags: [teams]
      summary: Bollettino delle squadre attivate dall'utente
      description: >-
        Con `unread=true` solo gli eventi non letti, altrimenti tutti; al massimo i 200 più recenti. Non li segna
        come letti.
      parameters:
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Eventi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"

  /team-events/read:
    post:
      operationId: markTeamEventsRead
      tags: [teams]
      summary: Segna come letti gli eventi indicati
      description: Solo eventi delle squadre attivate dall'utente; gli altri si ignorano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamEventsReadInput"
      responses:
        "200":
          description: Eventi segnati
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Account AI ─────────────────────────────────────────────────────────────

  /ai/providers:
    get:
      operationId: listAiProviders
      tags: [ai]
      summary: Provider del registro per la creazione degli account AI
      description: >-
        Provider della tabella providers (registro e scoperti), senza quello del vecchio gateway: prima
        i gestiti per nome, poi quelli in arrivo, poi i non gestiti.
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProviderInfo"

  /ai/accounts:
    get:
      operationId: listAiAccounts
      tags: [ai]
      summary: Elenca gli account AI dell'utente
      description: >-
        Account dell'utente corrente (il predefinito per primo, poi per nome). La chiave non è mai
        esposta: solo keySet.
      responses:
        "200":
          description: Account AI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAccount"
    post:
      operationId: createAiAccount
      tags: [ai]
      summary: Crea un account AI e ne legge i modelli
      description: >-
        Il provider si legge dalla tabella providers: sconosciuto → 400; in arrivo (coming) → 400.
        Valida il base URL (lo indicano custom, i provider non gestiti e i gestiti senza indirizzo
        predefinito; gli altri usano quello predefinito), legge /models del provider con la chiave e
        salva account e modelli. Se il provider non
        fornisce l'elenco dei modelli l'account si salva comunque (status ok, zero modelli, aggiunta
        manuale). Ogni altro errore del provider → 400 con il messaggio fisso e nulla di salvato. Il
        primo account dell'utente diventa predefinito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountInput"
      responses:
        "201":
          description: Account creato e verificato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}:
    patch:
      operationId: updateAiAccount
      tags: [ai]
      summary: Modifica un account AI
      description: >-
        Nome, chiave (assente o "" = invariata, null = rimossa, solo custom), base URL e
        allowPrivateNetwork (solo custom). Una chiave o un base URL nuovi rileggono i modelli come
        verifyAiAccount. Account di un altro utente → 404.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountUpdate"
      responses:
        "200":
          description: Account aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAiAccount
      tags: [ai]
      summary: Elimina un account AI e i suoi modelli
      description: >-
        409 "account usato da: <nomi>" se un agente o un'analisi in coda o in corso usa uno dei suoi
        modelli; le analisi concluse perdono solo il collegamento (aiModelId null) e tengono modello e
        costo. Se era il predefinito, diventa predefinito l'account più vecchio rimasto all'utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Account eliminato
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/accounts/{id}/verify:
    post:
      operationId: verifyAiAccount
      tags: [ai]
      summary: Rilegge i modelli del provider
      description: >-
        Aggiunge i modelli nuovi e aggiorna nome, contesto e prezzi (non quelli inseriti a mano) degli
        esistenti; i modelli non più elencati restano. Un errore del provider non fa fallire la
        richiesta: l'account torna con status error e lastError.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Stato dell'account dopo la verifica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}/default:
    post:
      operationId: setDefaultAiAccount
      tags: [ai]
      summary: Rende l'account il predefinito dell'utente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account predefinito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/accounts/{id}/models:
    get:
      operationId: listAiAccountModels
      tags: [ai]
      summary: Elenca i modelli di un account (nascosti compresi)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Modelli dell'account, per nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAiAccountModel
      tags: [ai]
      summary: Aggiunge a mano un modello all'account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: Modello aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/models/{id}:
    patch:
      operationId: updateAiModel
      tags: [ai]
      summary: Modifica nome, prezzi o visibilità di un modello
      description: Un prezzo indicato (anche null) rende la fonte dei prezzi "manual".
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Modello aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/models/{id}/probe:
    post:
      operationId: probeAiModel
      tags: [ai]
      summary: Prova un modello con una chiamata da 1 token
      description: >-
        Solo per i modelli degli account dell'utente. Una chiamata con un messaggio
        minimo e max_tokens 1, a carico dell'account; aggiorna esito e data dell'ultima prova e la
        disponibilità. Massimo 5 prove al minuto per IP.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esito della prova (anche quando il provider rifiuta la chiamata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelProbeResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: Modelli selezionabili dall'utente, raggruppati per account
      description: >-
        Account dell'utente (il predefinito per primo, poi per nome; quelli in errore in fondo). I modelli nascosti sono esclusi; quelli non
        selezionabili restano con `selectable: false`. Al massimo un modello consigliato per gruppo.
      responses:
        "200":
          description: Gruppi di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModelGroup"

  /ai/estimate:
    get:
      operationId: estimateAnalysisCost
      tags: [ai]
      summary: Stima del costo di un'analisi
      description: >-
        Massimo = maxTokens × (0.95 × prezzo input + 0.05 × prezzo output) / 1e6; tipico = 60% del
        massimo; USD arrotondati a 4 decimali, null se un prezzo manca.
      parameters:
        - name: aiModelId
          in: query
          required: true
          schema:
            type: integer
        - name: maxTokens
          in: query
          required: false
          description: Tetto di token dell'analisi, come in AnalysisStart (default 1000000)
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
      responses:
        "200":
          description: Stima
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/models:
    get:
      operationId: listCatalogModels
      tags: [catalog]
      summary: Catalogo dei modelli, a pagine
      description: >-
        Modelli con almeno un'offerta visibile (le `retired` sono escluse senza `includeRetired`). `q` cerca,
        senza distinguere maiuscole, in chiave canonica, famiglia, versione, autore e id presso i provider.
        `cheapestOffer` è l'offerta con prezzi noti e somma input+output minima; `maxPrice` filtra su quella
        somma. `usable`: solo modelli offerti dal provider di un account dell'utente. `inMyAccounts`: un
        modello di un account dell'utente è collegato a una delle offerte. Ordine predefinito per nome
        (famiglia, versione); `price` crescente (senza prezzo in fondo), `released` e `context` decrescenti.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: mode
          in: query
          required: false
          description: Tipo del modello; `all` per tutti
          schema:
            type: string
            enum: [all, chat, embedding, image_generation, image_edit, audio_transcription, audio_speech, video_generation, rerank, moderation, ocr, search, realtime, responses, completion, other]
            default: chat
        - name: author
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 100
        - name: provider
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AiProvider"
        - name: tools
          in: query
          required: false
          schema:
            type: boolean
        - name: vision
          in: query
          required: false
          schema:
            type: boolean
        - name: reasoning
          in: query
          required: false
          schema:
            type: boolean
        - name: usable
          in: query
          required: false
          schema:
            type: boolean
        - name: maxPrice
          in: query
          required: false
          description: USD per milione di token, input+output dell'offerta più economica
          schema:
            type: number
            minimum: 0
        - name: minContext
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: includeRetired
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, price, released, context]
            default: name
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Pagina di modelli
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModelPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /catalog/models/{id}/offers:
    get:
      operationId: listCatalogModelOffers
      tags: [catalog]
      summary: Offerte di un modello del catalogo
      description: >-
        Tutte le offerte, anche ritirate, per prezzo (input+output) crescente; senza prezzo in fondo e le
        ritirate dopo tutte le altre.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Offerte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/providers:
    get:
      operationId: listCatalogProviders
      tags: [catalog]
      summary: Provider del catalogo
      description: >-
        Provider della tabella providers senza quello del vecchio gateway: prima i gestiti, poi in arrivo,
        poi i non gestiti, per nome. `modelCount` conta i modelli con un'offerta non ritirata; `hasMyAccount` dice se
        l'utente ha un account presso il provider. `q` cerca in slug e nome.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiProviderStatus"
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogProvider"
        "400":
          $ref: "#/components/responses/BadRequest"

  /catalog/providers/{slug}/issue:
    get:
      operationId: getProviderIssue
      tags: [catalog]
      summary: Testo di issue per gestire un provider non gestito
      description: Solo per i provider `unmanaged`; 404 per gli altri.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiProvider"
      responses:
        "200":
          description: Titolo e corpo in markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderIssueText"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/status:
    get:
      operationId: getCatalogStatus
      tags: [catalog]
      summary: Ultimo aggiornamento del catalogo
      description: >-
        `running` dice se un aggiornamento è in corso. Il riepilogo contiene solo gli account
        dell'utente corrente.
      responses:
        "200":
          description: Stato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStatus"

  /catalog/refresh:
    post:
      operationId: refreshCatalog
      tags: [catalog]
      summary: Avvia l'aggiornamento del catalogo
      description: Risponde subito con l'esecuzione `running`; prosegue in background. Massimo 2 al minuto per IP.
      responses:
        "202":
          description: Aggiornamento avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRunView"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ─── Chat del piano ─────────────────────────────────────────────────────────

  /apps/{id}/plan:
    get:
      operationId: getAppPlan
      tags: [plan-chat]
      summary: Piano dell'app (endpoint, completamento, evoluzione)
      description: >-
        Voci dei capitoli endpoint, completion ed evolution dell'ultima analisi completata, più le voci
        nate in chat e approvate delle analisi precedenti. Senza analisi completata analysisId è null.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Piano dell'app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/plan/issues:
    post:
      operationId: createPlanIssues
      tags: [plan-chat]
      summary: Crea (o mostra in anteprima) le issue GitHub delle voci approvate del piano
      description: >-
        Le voci (endpoint, completamento, evoluzione approvate) diventano issue sul repository collegato
        tramite l'App GitHub. Con dryRun l'anteprima non chiama GitHub. Le voci già collegate o non ammesse
        risultano skipped. Massimo 5 creazioni al minuto per utente (le anteprime non contano).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanIssuesRequest"
      responses:
        "200":
          description: Anteprima (dryRun) o esito per voce
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlanIssuesPreview"
                  - $ref: "#/components/schemas/PlanIssuesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}/plan/issues/refresh:
    post:
      operationId: refreshPlanIssues
      tags: [plan-chat]
      summary: Rilegge da GitHub lo stato delle issue collegate alle voci del piano
      description: >-
        Legge le issue con l'etichetta casello del repository collegato (aggiornate dall'ultima lettura) e
        aggiorna stato e motivo della chiusura delle voci; un'issue non più nell'elenco resta com'era.
        Massimo 6 al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Riepilogo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanIssuesSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}/plan-conversations:
    get:
      operationId: listPlanConversations
      tags: [plan-chat]
      summary: Conversazioni dell'utente sul piano di una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazioni, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanConversation"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPlanConversation
      tags: [plan-chat]
      summary: Apre una conversazione sul piano
      description: >-
        Senza analysisId usa l'ultima analisi completata dell'app (nessuna: 409). Il modello deve essere
        di un account dell'utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanConversationCreate"
      responses:
        "201":
          description: Conversazione creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /plan-conversations/{id}:
    get:
      operationId: getPlanConversation
      tags: [plan-chat]
      summary: Conversazione con messaggi e proposte
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlanConversation
      tags: [plan-chat]
      summary: Cambia il modello della conversazione
      description: Solo con nessun turno in corso (altrimenti 409).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanConversationUpdate"
      responses:
        "200":
          description: Conversazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePlanConversation
      tags: [plan-chat]
      summary: Elimina la conversazione (le voci accettate restano)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Conversazione eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  /plan-conversations/{id}/messages:
    post:
      operationId: sendPlanMessage
      tags: [plan-chat]
      summary: Invia un messaggio e avvia il turno del bot
      description: >-
        Risponde subito col messaggio dell'utente; il bot risponde in background (turnStatus running,
        poi idle). 409 se un turno è già in corso, se il modello non è più disponibile o se chi paga il
        modello ha raggiunto il tetto di spesa mensile.
        Massimo 10 messaggi al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanMessageCreate"
      responses:
        "202":
          description: Messaggio accettato, turno avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /plan-proposals/{id}/decision:
    post:
      operationId: decidePlanProposal
      tags: [plan-chat]
      summary: Accetta o rifiuta una proposta del bot
      description: 409 se la proposta è già decisa o la voce di destinazione è cambiata (proposta stale).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanProposalDecision"
      responses:
        "200":
          description: Proposta aggiornata ed eventuale voce creata o modificata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanProposalDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /team-instances/{id}/team-chat-conversations:
    get:
      operationId: listTeamChatConversations
      tags: [team-chat]
      summary: Conversazioni dell'utente con Lucius su una squadra
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazioni, dalla più recente
          content:
            application/json:
