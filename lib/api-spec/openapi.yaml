        Zip con un file `<key>.md` per ogni ruolo che ha istruzioni, `attachment; filename="<squadra>-ruoli.zip"`.
        404 se nessun ruolo ha istruzioni.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Archivio zip
