name: Build & deploy (Casello)

on:
  push:
    # I branch feat/** buildano (collaudo), ma solo main deploya
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Un run alla volta per branch. Su main i run si accodano e non vengono mai annullati a metà
# deploy: GitHub tiene in attesa solo il più recente, quindi in produzione vince l'ultimo merge.
# Sui feat/** un nuovo push annulla il collaudo in corso.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/twentivan/casello-api
  IMAGE_WEB: ghcr.io/twentivan/casello-web

jobs:
  # Test dell'API (Vitest + Postgres in memoria) e della console: girano a ogni push e bloccano la build
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @workspace/api-server run test

      - run: pnpm --filter @workspace/casello run test

  # Botcave Nodo: si ricostruisce su macOS solo se la versione (package.json) o la minima (min-version.txt) differiscono da
  # quelle pubblicate in produzione. Altrimenti si riusano zip, binario e manifest già pubblicati (verificati con sha256 e
  # dimensione del manifest): un deploy che non tocca il nodo non aspetta un runner macOS.
  nodo-plan:
    name: Botcave Nodo da ricostruire?
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4

      # I file pubblicati hanno la versione nel nome e la cache immutable: codice del nodo cambiato senza alzare la versione
      # = i nodi non si aggiornerebbero (o prenderebbero un file vecchio dalla cache). Solo sui push dei branch diversi da main.
      - name: Versione di Botcave Nodo alzata se cambia il codice
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet FETCH_HEAD -- artifacts/casello-nodo/src; then
            echo "artifacts/casello-nodo/src uguale a main: nessun controllo della versione"
            exit 0
          fi
          main_version=$(git show FETCH_HEAD:artifacts/casello-nodo/package.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{console.log("")}})')
          branch_version=$(node -p 'require("./artifacts/casello-nodo/package.json").version')
          echo "versione su main: ${main_version:-assente}, su questo branch: ${branch_version}"
          if [ -n "$main_version" ] && [ "$main_version" = "$branch_version" ]; then
            echo "::error file=artifacts/casello-nodo/package.json::artifacts/casello-nodo/src è cambiato rispetto a main ma la versione è ancora ${branch_version}: alza \"version\" in artifacts/casello-nodo/package.json (i file pubblicati hanno la versione nel nome e la cache immutable)"
            exit 1
          fi

      - name: Confronto con la versione pubblicata e riuso dei file
        id: plan
        run: |
          set -euo pipefail
          base="https://casello.fantamister.cloud/downloads/nodo"
          out="docker/nodo-downloads"
          version=$(node -p 'require("./artifacts/casello-nodo/package.json").version')
          min=$(tr -d '[:space:]' < artifacts/casello-nodo/min-version.txt)
          manifest=$(mktemp)
          reuse=false
          if curl -fsS --max-time 30 "$base/nodo-manifest.json" -o "$manifest"; then
            read -r pub_version pub_min < <(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(m.version??"", m.minVersion??"")' "$manifest" || echo "- -")
            echo "pubblicata: ${pub_version} (minima ${pub_min}); questo commit: ${version} (minima ${min})"
            if [ "$pub_version" = "$version" ] && [ "$pub_min" = "$min" ]; then reuse=true; fi
          else
            echo "manifest pubblicato non raggiungibile: si ricostruisce"
          fi
          if [ "$reuse" = true ]; then
            # Nomi e impronte dal manifest; nomi solo [A-Za-z0-9._-] (niente percorsi)
            for kind in binary app; do
              read -r file sha size < <(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))[process.argv[2]]??{};console.log(m.file??"", m.sha256??"", m.size??"")' "$manifest" "$kind")
              if ! [[ "$file" =~ ^[A-Za-z0-9._-]+$ ]] || [ -z "$sha" ] || [ -z "$size" ]; then echo "voce $kind del manifest non valida"; reuse=false; break; fi
              if ! curl -fsS --max-time 600 "$base/$file" -o "$out/$file"; then echo "download di $file non riuscito"; reuse=false; break; fi
              got_size=$(wc -c < "$out/$file" | tr -d "[:space:]")
              got_sha=$(sha256sum "$out/$file" | cut -d' ' -f1)
              if [ "$got_size" != "$size" ] || [ "$got_sha" != "$sha" ]; then echo "$file non corrisponde al manifest"; reuse=false; break; fi
            done
          fi
          if [ "$reuse" = true ]; then
            cp "$manifest" "$out/nodo-manifest.json"
            echo "si riusano i file pubblicati della versione ${version}"
          else
            find "$out" -type f ! -name .gitkeep -delete
            echo "Botcave Nodo va ricostruito su macOS"
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.reuse == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nodo-downloads
          path: docker/nodo-downloads/
          if-no-files-found: error
          retention-days: 7

  # Botcave Nodo per Mac: eseguibile unico (Node 24 + casello-nodo) universale arm64/x64, app zippata e manifest.
  # Gli artefatti finiscono in docker/nodo-downloads/ delle immagini: web li serve da /downloads/nodo/, l'API legge il manifest.
  build-nodo:
    name: Build Botcave Nodo (macOS)
    needs: [test, nodo-plan]
    if: needs.nodo-plan.outputs.reuse != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @workspace/casello-nodo...

      - run: pnpm --filter @workspace/casello-nodo run test

      # La prova di --version in x64 gira con Rosetta: installata se manca (già presente = errore ignorato)
      - name: Rosetta per la prova x64
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build dell'app, del binario e del manifest
        run: bash artifacts/casello-nodo/scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nodo-downloads
          path: docker/nodo-downloads/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.app }}
    needs: [test, nodo-plan, build-nodo]
    # build-nodo saltato (file del nodo riusati) non deve saltare la build delle immagini
    if: >-
      always() && needs.test.result == 'success' && needs.nodo-plan.result == 'success' &&
      (needs.build-nodo.result == 'success' || (needs.build-nodo.result == 'skipped' && needs.nodo-plan.outputs.reuse == 'true'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: docker/api.Dockerfile
            image: ghcr.io/twentivan/casello-api
          - app: web
            dockerfile: docker/web.Dockerfile
            image: ghcr.io/twentivan/casello-web
    steps:
      - uses: actions/checkout@v4

      # Zip, binario e manifest di Botcave Nodo dal job build-nodo, prima delle build delle immagini
      - uses: actions/download-artifact@v4
        with:
          name: nodo-downloads
          path: docker/nodo-downloads/

      - uses: docker/setup-buildx-action@v3

      - name: Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prova dell'immagine web (nginx): /embed incorporabile solo dalle origini ammesse, console mai in iframe.
      # Parte prima del push: se fallisce, nessuna immagine viene pubblicata. La build qui riempie la cache gha.
      - name: Build dell'immagine web per la prova
        if: matrix.app == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: web-smoke
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Prova dell'immagine web (frame-ancestors)
        if: matrix.app == 'web'
        run: |
          set -euo pipefail
          run_web() { # <origini ammesse>
            docker rm -f web-smoke-run >/dev/null 2>&1 || true
            docker run -d --name web-smoke-run -e EMBED_ALLOWED_ORIGINS="$1" -p 8088:80 web-smoke >/dev/null
            for _ in $(seq 1 30); do
              curl -fs localhost:8088/health >/dev/null && return 0
              sleep 1
            done
            echo "::error::il container web non risponde"; docker logs web-smoke-run; exit 1
          }
          expect() { # <path> <testo atteso nelle intestazioni>
            local out; out=$(curl -sI "localhost:8088$1")
            if ! grep -qiF -- "$2" <<<"$out"; then
              echo "::error::$1: manca '$2'"; echo "$out"; docker logs web-smoke-run; exit 1
            fi
          }
          run_web https://hubup.fantamister.cloud
          expect /embed "frame-ancestors https://hubup.fantamister.cloud"
          expect / "frame-ancestors 'none'"
          expect /embed/v1/botcave.js "200 OK"
          # Botcave Nodo: manifest pubblicato con la console, cache di un'ora
          expect /downloads/nodo/nodo-manifest.json "200 OK"
          expect /downloads/nodo/nodo-manifest.json "max-age=3600"
          # Webhook degli inneschi: il segreto e' nel percorso, la location non deve scriverlo ne' nell'access log ne' nell'error log
          conf=$(docker exec web-smoke-run nginx -T 2>/dev/null)
          hooks=$(awk '/location \^~ \/api\/hooks\//{f=1} f{print} f&&/^    }/{exit}' <<<"$conf")
          for directive in "access_log off;" "error_log /dev/stderr crit;"; do
            if ! grep -qF -- "$directive" <<<"$hooks"; then
              echo "::error::location /api/hooks/: manca '$directive'"; echo "$hooks"; exit 1
            fi
          done
          # Abbinamento dei nodi: il codice e' nel percorso, stesse due direttive
          pairings=$(awk '/location \^~ \/api\/account\/node-pairings\//{f=1} f{print} f&&/^    }/{exit}' <<<"$conf")
          for directive in "access_log off;" "error_log /dev/stderr crit;"; do
            if ! grep -qF -- "$directive" <<<"$pairings"; then
              echo "::error::location /api/account/node-pairings/: manca '$directive'"; echo "$pairings"; exit 1
            fi
          done
          run_web ""
          expect /embed "frame-ancestors 'none'"
          docker rm -f web-smoke-run >/dev/null

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # :latest è quello che deploya Coolify: lo scrive solo main, i feat/** hanno solo il tag sha
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy su Coolify
    needs: build
    # always(): build-nodo saltato più indietro nella catena non deve saltare il deploy; conta solo l'esito di build
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK_API: ${{ secrets.COOLIFY_WEBHOOK_API }}
      COOLIFY_WEBHOOK_WEB: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
    steps:
      - name: Deploy API e web (con attesa della fine)
        # Il webhook di Coolify risponde subito e il deploy prosegue in background: se il job
        # finisse lì, la concurrency non servirebbe e un secondo merge arriverebbe a deploy in
        # corso (Coolify lo scarta e resta l'immagine vecchia). Quindi si attende lo stato finale.
        run: |
          set -euo pipefail

          deploy() {
            local name="$1" webhook="$2"
            local sep='?'
            [[ "$webhook" == *\?* ]] && sep='&'
            # force=true: Coolify riscarica l'immagine anche se il tag (latest) è lo stesso
            local resp
            resp=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "${webhook}${sep}force=true")
            echo "$name: $resp"

            local uuid
            uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$resp")
            if [[ -z "$uuid" ]]; then
              echo "::error::$name: Coolify non ha messo in coda il deploy"
              return 1
            fi

            local api_base="${webhook%%/api/v1/*}/api/v1"
            local status
            for _ in $(seq 1 60); do
              if ! status=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
                "$api_base/deployments/$uuid" | jq -r '.status'); then
                echo "::warning::$name: stato del deploy non leggibile (al token serve il permesso read), non attendo"
                return 0
              fi
              echo "$name: $status"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled*) echo "::error::$name: deploy $status"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$name: deploy non concluso dopo 10 minuti"
            return 1
          }

          deploy API "$COOLIFY_WEBHOOK_API"
          deploy web "$COOLIFY_WEBHOOK_WEB"
