        "201":
          description: Conversazione creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChatConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /team-chat-conversations/{id}:
    get:
      operationId: getTeamChatConversation
      tags: [team-chat]
      summary: Conversazione con messaggi e schede
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazione trovata
