openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casello — hub per agentificare applicazioni
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login (Google, GitHub) e sessione (tutte le altre route richiedono la sessione, tranne /healthz e /auth/providers)
  - name: apps
    description: Applicazioni registrate
  - name: agents
    description: Configurazioni agenti
  - name: tools
    description: Catalogo dei tool delle app e loro assegnazione agli agenti
  - name: runs
    description: Esecuzioni degli agenti
  - name: dashboard
    description: Statistiche aggregate
  - name: models
    description: Modelli AI selezionabili
  - name: github
    description: Installazioni e repository dell'App GitHub di Casello
  - name: ai
    description: Account AI dell'utente (provider, chiave, modelli e prezzi) e stima dei costi
  - name: architect
    description: Analisi dell'architetto (proposte su tool, agenti, skill, endpoint ed evoluzione) e skill degli agenti

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  # /auth/login e /auth/callback sono redirect del flusso OIDC (Google), non chiamate JSON.
  # Lo stesso vale per /auth/github/login, /auth/github/link e /auth/github/callback (GitHub).

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Utente della sessione corrente
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: Metodi di accesso disponibili
      description: Pubblica (senza sessione), serve alla pagina di login per mostrare i pulsanti.
      responses:
        "200":
          description: Metodi di accesso configurati sul server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Chiude la sessione
      responses:
        "204":
          description: Sessione chiusa

  /auth/github:
    delete:
      operationId: unlinkGithub
      tags: [auth]
      summary: Scollega l'account GitHub e le sue installazioni
      description: >
        Rimuove l'identità GitHub dell'utente corrente e le installazioni dell'App a lui collegate.
        Risponde 409 se l'utente resterebbe senza modo di entrare (nessun'altra identità ed email
        non ammessa).
      responses:
        "204":
          description: Account GitHub scollegato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─── Apps ───────────────────────────────────────────────────────────────────

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: Elenca tutte le app registrate
      responses:
        "200":
          description: Lista di app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
    post:
      operationId: createApp
      tags: [apps]
      summary: Registra una nuova app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: App creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Recupera una app per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: App trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Aggiorna una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdate"
      responses:
        "200":
          description: App aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Elimina una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: App eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Agents ─────────────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Elenca tutti gli agenti
      parameters:
        - name: appId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per app
      responses:
        "200":
          description: Lista di agenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Crea un nuovo agente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Recupera un agente per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Aggiorna un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Elimina un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Agente eliminato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: L'agente generale di un'app non si può eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Tools ──────────────────────────────────────────────────────────────────

  /apps/{id}/tools:
    get:
      operationId: listAppTools
      tags: [tools]
      summary: Elenca i tool del catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Lista di tool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppTool"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAppTool
      tags: [tools]
      summary: Aggiunge un tool al catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolInput"
      responses:
        "201":
          description: Tool creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/tools/{toolId}:
    patch:
      operationId: updateAppTool
      tags: [tools]
      summary: Aggiorna un tool del catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolUpdate"
      responses:
        "200":
          description: Tool aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAppTool
      tags: [tools]
      summary: Elimina un tool dal catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      responses:
        "204":
          description: Tool eliminato
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/tools:
    put:
      operationId: setAgentTools
      tags: [tools]
      summary: Imposta i tool di un agente
      description: >-
        Sostituisce l'insieme dei tool assegnati all'agente. I tool devono appartenere
        alla stessa app dell'agente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentToolsInput"
      responses:
        "200":
          description: Agente con i tool aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Runs ───────────────────────────────────────────────────────────────────

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Elenca tutte le esecuzioni (dalla più recente)
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per agente
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
          description: Filtra per stato
      responses:
        "200":
          description: Lista di esecuzioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /agents/{id}/runs:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Avvia un'esecuzione dell'agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, usato per i tool con identità user.
            Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      description: >-
        Crea la run e la avvia in background: risponde subito con la run in stato pending.
        Lo stato (running, poi succeeded o failed) si segue con GET /runs/{id}.
      responses:
        "202":
          description: Esecuzione avviata (stato pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Recupera un'esecuzione per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/steps:
    get:
      operationId: listRunSteps
      tags: [runs]
      summary: Elenca i passi di un'esecuzione (in ordine di posizione)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Passi dell'esecuzione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStep"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Riprende un'esecuzione in attesa del client
      description: >-
        Conferma o rifiuta l'azione in sospeso di una run in stato awaiting_client e la
        riavvia in background. Risponde 409 se la run non è in pausa o la pausa è scaduta.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, se quello dato all'avvio non è più in memoria
            (riavvio del server o pausa lunga). Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunResume"
      responses:
        "202":
          description: Esecuzione ripresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─── Architetto ─────────────────────────────────────────────────────────────

  /apps/{id}/analyses:
    get:
      operationId: listAnalyses
      tags: [architect]
      summary: Elenca le analisi dell'architetto di una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startAnalysis
      tags: [architect]
      summary: Avvia un'analisi leggendo le sorgenti configurate sull'app
      description: >-
        Avvia in background l'analisi con le sorgenti dell'app (repository GitHub, OpenAPI,
        descrizione funzionale). Risponde 409 se per l'app c'è già un'analisi in corso. Con
        sourceInstallationId non serve il token manuale, ma l'utente corrente deve avere quell'installazione
        (altrimenti 403 "installazione non trovata o non tua").
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStart"
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/analyses/zip:
    post:
      operationId: startZipAnalysis
      tags: [architect]
      summary: Avvia un'analisi caricando il codice come archivio zip
      description: >-
        Il corpo è l'archivio zip (application/zip, al massimo 50 MB). Il codice resta solo in
        memoria per la durata dell'analisi. Risponde 409 se per l'app c'è già un'analisi in corso.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: aiModelId
          in: query
          required: false
          schema:
            type: integer
          description: Modello di un account AI (esattamente uno tra aiModelId e model)
        - name: model
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Compatibilità, modello AI come model_name di LiteLLM
        - name: maxTokens
          in: query
          required: false
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [architect]
      summary: Recupera un'analisi con mappa, log ed elementi della proposta
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /analyses/{id}/issues:
    get:
      operationId: exportAnalysisIssues
      tags: [architect]
      summary: Esporta in Markdown gli elementi di un capitolo come issue
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: chapter
          in: query
          required: true
          schema:
            type: string
            enum: [endpoint, completion, evolution]
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemStatus"
          description: Stato degli elementi da esportare (default approved)
      responses:
        "200":
          description: Issue in Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /analysis-items/{id}:
    patch:
      operationId: updateAnalysisItem
      tags: [architect]
      summary: Rivede un elemento della proposta (approva, scarta, rimanda, modifica)
      description: >-
        Approvando un elemento dei capitoli tool, agent o skill la proposta viene applicata.
        Se non è applicabile risponde 400 e l'elemento resta in attesa.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisItemUpdate"
      responses:
        "200":
          description: Elemento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /agents/{id}/skills:
    get:
      operationId: listAgentSkills
      tags: [architect]
      summary: Elenca le skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Skill dell'agente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSkill"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/skills/{skillId}:
    delete:
      operationId: deleteAgentSkill
      tags: [architect]
      summary: Elimina una skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/SkillIdParam"
      responses:
        "204":
          description: Skill eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── GitHub ─────────────────────────────────────────────────────────────────

  /github/installations:
    get:
      operationId: listGithubInstallations
      tags: [github]
      summary: Installazioni dell'App GitHub collegate all'utente
      description: >-
        Installazioni salvate per l'utente corrente, con il link per gestirle e quello per
        installare l'App su un altro account. 404 se GitHub non è configurato.
      responses:
        "200":
          description: Installazioni e link di installazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubInstallations"
        "404":
          $ref: "#/components/responses/NotFound"

  /github/repos:
    get:
      operationId: listGithubRepos
      tags: [github]
      summary: Repository visibili all'App nelle installazioni dell'utente
      description: >-
        Repository di tutte le installazioni dell'utente, ordinati per nome completo, senza doppioni.
        Un'installazione revocata (401/404 da GitHub) viene eliminata per l'utente e saltata.
        404 se GitHub non è configurato; 502 se GitHub non risponde.
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GithubRepo"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ─── Dashboard ──────────────────────────────────────────────────────────────

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche aggregate del hub
      responses:
        "200":
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Models ─────────────────────────────────────────────────────────────────

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: Elenca i modelli selezionabili per gli agenti (model_name di LiteLLM)
      responses:
        "200":
          description: Lista di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  # ─── Account AI ─────────────────────────────────────────────────────────────

  /ai/accounts:
    get:
      operationId: listAiAccounts
      tags: [ai]
      summary: Elenca gli account AI dell'utente e l'account di sistema
      description: >-
        Account dell'utente corrente (il predefinito per primo, poi per nome) seguiti dall'account di
        sistema, se configurato. La chiave non è mai esposta: solo keySet.
      responses:
        "200":
          description: Account AI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAccount"
    post:
      operationId: createAiAccount
      tags: [ai]
      summary: Crea un account AI e ne legge i modelli
      description: >-
        Valida il base URL (solo custom può indicarlo; gli altri provider usano quello predefinito),
        legge /models del provider con la chiave e salva account e modelli. Se il provider non
        fornisce l'elenco dei modelli l'account si salva comunque (status ok, zero modelli, aggiunta
        manuale). Ogni altro errore del provider → 400 con il messaggio fisso e nulla di salvato. Il
        primo account dell'utente diventa predefinito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountInput"
      responses:
        "201":
          description: Account creato e verificato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}:
    patch:
      operationId: updateAiAccount
      tags: [ai]
      summary: Modifica un account AI
      description: >-
        Nome, chiave (assente o "" = invariata, null = rimossa, solo custom), base URL e
        allowPrivateNetwork (solo custom). Una chiave o un base URL nuovi rileggono i modelli come
        verifyAiAccount. Account di sistema → 403; account di un altro utente → 404.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountUpdate"
      responses:
        "200":
          description: Account aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAiAccount
      tags: [ai]
      summary: Elimina un account AI e i suoi modelli
      description: >-
        409 "account usato da: <nomi>" se un agente o un'analisi in coda o in corso usa uno dei suoi
        modelli; le analisi concluse perdono solo il collegamento (aiModelId null) e tengono modello e
        costo. Se era il predefinito, diventa predefinito l'account più vecchio rimasto all'utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Account eliminato
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/accounts/{id}/verify:
    post:
      operationId: verifyAiAccount
      tags: [ai]
      summary: Rilegge i modelli del provider
      description: >-
        Aggiunge i modelli nuovi e aggiorna nome, contesto e prezzi (non quelli inseriti a mano) degli
        esistenti; i modelli non più elencati restano. Un errore del provider non fa fallire la
        richiesta: l'account torna con status error e lastError.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Stato dell'account dopo la verifica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}/default:
    post:
      operationId: setDefaultAiAccount
      tags: [ai]
      summary: Rende l'account il predefinito dell'utente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account predefinito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/accounts/{id}/models:
    get:
      operationId: listAiAccountModels
      tags: [ai]
      summary: Elenca i modelli di un account (nascosti compresi)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Modelli dell'account, per nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAiAccountModel
      tags: [ai]
      summary: Aggiunge a mano un modello all'account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: Modello aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/models/{id}:
    patch:
      operationId: updateAiModel
      tags: [ai]
      summary: Modifica nome, prezzi o visibilità di un modello
      description: Un prezzo indicato (anche null) rende la fonte dei prezzi "manual".
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Modello aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: Modelli selezionabili dall'utente, raggruppati per account
      description: >-
        Account dell'utente (il predefinito per primo, poi per nome; quelli in errore in fondo) e
        account di sistema per ultimo, se configurato. I modelli nascosti sono esclusi.
      responses:
        "200":
          description: Gruppi di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModelGroup"

  /ai/estimate:
    get:
      operationId: estimateAnalysisCost
      tags: [ai]
      summary: Stima del costo di un'analisi
      description: >-
        Massimo = maxTokens × (0.95 × prezzo input + 0.05 × prezzo output) / 1e6; tipico = 60% del
        massimo; USD arrotondati a 4 decimali, null se un prezzo manca.
      parameters:
        - name: aiModelId
          in: query
          required: true
          schema:
            type: integer
        - name: maxTokens
          in: query
          required: false
          description: Tetto di token dell'analisi, come in AnalysisStart (default 1000000)
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
      responses:
        "200":
          description: Stima
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    ToolIdParam:
      name: toolId
      in: path
      required: true
      schema:
        type: integer

    SkillIdParam:
      name: skillId
      in: path
      required: true
      schema:
        type: integer

  responses:
    TooManyRequests:
      description: Troppe richieste
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflitto con lo stato corrente della risorsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Login richiesto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Risorsa non accessibile all'utente corrente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadGateway:
      description: Servizio esterno non raggiungibile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: Corpo della richiesta troppo grande
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── GitHub ─────────────────────────────────────────────────────────────────
    GithubInstallation:
      type: object
      required: [installationId, accountLogin, accountType, repositorySelection, manageUrl]
      properties:
        installationId:
          type: integer
        accountLogin:
          type: string
        accountType:
          type: string
          description: User o Organization
        repositorySelection:
          type: string
          description: all o selected
        manageUrl:
          type: string
          description: Pagina di GitHub in cui gestire l'installazione

    GithubInstallations:
      type: object
      required: [installUrl, installations]
      properties:
        installUrl:
          type: string
          description: Pagina di GitHub in cui installare l'App
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GithubInstallation"

    GithubRepo:
      type: object
      required: [installationId, fullName, defaultBranch, private]
      properties:
        installationId:
          type: integer
        fullName:
          type: string
          description: proprietario/nome
        defaultBranch:
          type: string
        private:
          type: boolean

    # ── Auth ───────────────────────────────────────────────────────────────────

    CurrentUser:
      type: object
      required: [email, name, picture, identities, githubEnabled]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
        picture:
          type: ["string", "null"]
        identities:
          type: array
          description: Account esterni collegati (Google, GitHub)
          items:
            $ref: "#/components/schemas/LinkedIdentity"
        githubEnabled:
          type: boolean
          description: Se il login e il collegamento con GitHub sono configurati sul server

    AuthProviders:
      type: object
      required: [google, github]
      properties:
        google:
          type: boolean
        github:
          type: boolean
          description: Se il login con GitHub è configurato sul server

    LinkedIdentity:
      type: object
      required: [provider, username, email]
      properties:
        provider:
          type: string
          enum: [google, github]
        username:
          type: ["string", "null"]
          description: Login GitHub (null per Google)
        email:
          type: ["string", "null"]

    # ── App ────────────────────────────────────────────────────────────────────

    AppStatus:
      type: string
      enum: [active, inactive]

    AuthConfig:
      type: object
      required: [header, scheme]
      description: Come l'app riceve le credenziali (scheme null = valore grezzo)
      properties:
        header:
          type: string
          minLength: 1
        scheme:
          type: ["string", "null"]

    SourceType:
      type: string
      enum: [github, zip, none]
      description: Da dove l'architetto legge il codice dell'app

    App:
      type: object
      required: [id, name, slug, baseUrl, status, serviceSecretSet, sourceType, sourceRepo, sourceBranch, sourceTokenSet, sourceInstallationId, openapiUrl, functionalDescription, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
        internalBaseUrl:
          type: ["string", "null"]
          description: URL raggiunto dall'esecutore al posto di baseUrl (rete interna)
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecretSet:
          type: boolean
          description: Indica se il segreto di servizio è impostato (il valore non è mai esposto)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
          description: Repository GitHub nel formato owner/nome
        sourceBranch:
          type: ["string", "null"]
        sourceTokenSet:
          type: boolean
          description: Indica se il token GitHub di sola lettura è impostato (il valore non è mai esposto)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App da cui l'architetto scarica il repo (con un token ristretto
            a quel repo); null = token manuale della fase 3
        openapiUrl:
          type: ["string", "null"]
          description: URL dell'OpenAPI dell'app, letto (GET) dall'architetto
        functionalDescription:
          type: ["string", "null"]
          description: Descrizione funzionale dell'app per l'architetto
        status:
          $ref: "#/components/schemas/AppStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppInput:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: string
          description: Segreto di servizio (solo scrittura, salvato cifrato)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: string
          description: Token GitHub di sola lettura (solo scrittura, salvato cifrato)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo (solo con sourceType github);
            altrimenti 400 "installazione non trovata o non tua"
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"

    AppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: ["string", "null"]
          description: Segreto di servizio (solo scrittura); null lo cancella
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: ["string", "null"]
          description: Token GitHub di sola lettura (solo scrittura); null lo cancella
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo; null torna al token manuale.
            Passando a un sourceType diverso da github diventa null da sola
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"

    # ── Agent ──────────────────────────────────────────────────────────────────

    AgentStatus:
      type: string
      enum: [active, inactive, draft]

    AgentRole:
      type: string
      enum: [general, area]

    Agent:
      type: object
      required: [id, appId, name, aiModelId, status, role, defaultIdentity, toolIds, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
          description: >-
            Id del modello come testo (compatibilità): con aiModelId impostato è il modelId del
            modello scelto
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello scelto tra quelli degli account AI; le run usano l'account di questo modello
            (chi configura paga). Null = vecchio percorso del gateway
        status:
          $ref: "#/components/schemas/AgentStatus"
        role:
          $ref: "#/components/schemas/AgentRole"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        toolIds:
          type: array
          items:
            type: integer
          description: ID dei tool del catalogo assegnati all'agente
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [appId, name]
      properties:
        appId:
          type: integer
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: string
        model:
          type: string
          description: Solo compatibilità; con aiModelId è ignorato
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello di un account AI dell'utente o dell'account di sistema (400 "modello non
            disponibile" altrimenti)
        status:
          $ref: "#/components/schemas/AgentStatus"

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
          description: Solo compatibilità; con aiModelId è ignorato
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Se diverso da quello salvato deve essere un modello dell'utente o dell'account di
            sistema (400 altrimenti); uguale a quello salvato non viene ricontrollato
        status:
          $ref: "#/components/schemas/AgentStatus"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"

    AgentToolsInput:
      type: object
      required: [toolIds]
      properties:
        toolIds:
          type: array
          items:
            type: integer

    # ── Model ──────────────────────────────────────────────────────────────────

    Model:
      type: object
      required: [id, label, isDefault]
      properties:
        id:
          type: string
          description: model_name di LiteLLM, da usare in Agent.model
        label:
          type: string
        isDefault:
          type: boolean
          description: Modello usato quando un agente viene creato senza model

    # ── Tool ───────────────────────────────────────────────────────────────────

    ToolKind:
      type: string
      enum: [http, ui, composite]

    ToolIdentity:
      type: string
      enum: [user, service]

    ToolStatus:
      type: string
      enum: [draft, active, disabled]

    AppTool:
      type: object
      required:
        - id
        - appId
        - name
        - kind
        - identity
        - requiresConfirmation
        - readOnly
        - status
        - paramsSchema
        - definition
        - needsVerification
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema dei parametri accettati dal tool
        definition:
          type: object
          additionalProperties: true
          description: Definizione dell'esecuzione (dipende da kind)
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
          description: Evidenze da cui il tool è stato derivato (proposte dall'architetto)
        needsVerification:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ToolEvidence:
      type: object
      required: [source, location]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    AppToolInput:
      type: object
      required: [name, kind, definition]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    AppToolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    # ── Run ────────────────────────────────────────────────────────────────────

    RunStatus:
      type: string
      enum: [pending, running, succeeded, failed, awaiting_client, cancelled]

    Run:
      type: object
      required: [id, agentId, status, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: ["string", "null"]
          description: Input testuale passato all'agente
        output:
          type: ["string", "null"]
          description: Output prodotto dall'agente
        errorMessage:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        pendingAction:
          oneOf:
            - $ref: "#/components/schemas/PendingAction"
            - type: "null"
          description: Azione in attesa del client (solo con stato awaiting_client)
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o la run usa il vecchio gateway (costo parziale)

    PendingActionKind:
      type: string
      enum: [confirmation, ui]

    PendingAction:
      type: object
      required: [kind, toolName, args, summary]
      properties:
        kind:
          $ref: "#/components/schemas/PendingActionKind"
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        summary:
          type: string

    RunStep:
      type: object
      required: [id, runId, position, type, createdAt]
      properties:
        id:
          type: integer
        runId:
          type: integer
        position:
          type: integer
        type:
          type: string
          description: "model (chiamata al modello) o tool (chiamata a un tool)"
        toolName:
          type: ["string", "null"]
        args:
          type: ["object", "null"]
          additionalProperties: true
        ok:
          type: ["boolean", "null"]
        httpStatus:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RunDecision:
      type: string
      enum: [approved, rejected]

    RunResume:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/RunDecision"

    RunTrigger:
      type: object
      properties:
        input:
          type: string
          description: Input testuale da passare all'agente

    # ── Dashboard ──────────────────────────────────────────────────────────────

    DashboardStats:
      type: object
      required: [totalApps, totalAgents, totalRuns, successfulRuns, failedRuns, activeAgents]
      properties:
        totalApps:
          type: integer
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalRuns:
          type: integer
        successfulRuns:
          type: integer
        failedRuns:
          type: integer
        avgDurationMs:
          type: ["number", "null"]

    # ── Architetto ─────────────────────────────────────────────────────────────

    AnalysisStatus:
      type: string
      enum: [queued, running, completed, failed, interrupted]

    AnalysisChapter:
      type: string
      enum: [tool, agent, skill, endpoint, completion, evolution]

    ItemDiff:
      type: string
      enum: [new, changed, removed, unchanged]
      description: Differenza rispetto allo stato approvato

    ItemStatus:
      type: string
      enum: [pending, approved, discarded, postponed]
      description: postponed solo per i capitoli endpoint, completion ed evolution

    AnalysisSources:
      type: object
      required: [code, openapi, description]
      properties:
        code:
          $ref: "#/components/schemas/SourceType"
        openapi:
          type: boolean
        description:
          type: boolean

    Analysis:
      type: object
      required: [id, appId, model, aiModelId, status, sources, maxTokens, tokensUsed, costUsd, phase, error, createdAt, finishedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        model:
          type: string
        aiModelId:
          type: ["integer", "null"]
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        sources:
          $ref: "#/components/schemas/AnalysisSources"
        maxTokens:
          type: integer
        tokensUsed:
          type: integer
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o l'analisi usa il vecchio gateway (costo parziale)
        phase:
          type: ["string", "null"]
          description: Fase corrente
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    AnalysisLogEntry:
      type: object
      required: [at, phase, message]
      properties:
        at:
          type: string
          format: date-time
        phase:
          type: string
        message:
          type: string

    AnalysisEvidence:
      type: object
      required: [source, location, note]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    AnalysisItem:
      type: object
      required: [id, analysisId, chapter, ref, position, payload, diff, evidence, status, reviewNote, appliedAt]
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        chapter:
          $ref: "#/components/schemas/AnalysisChapter"
        ref:
          type: string
          description: Chiave stabile nell'analisi, es. tool:rosa_squadra
        position:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: Contenuto della proposta, la cui forma dipende dal capitolo
        diff:
          $ref: "#/components/schemas/ItemDiff"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisEvidence"
        status:
          $ref: "#/components/schemas/ItemStatus"
        reviewNote:
          type: ["string", "null"]
        appliedAt:
          type: ["string", "null"]
          format: date-time

    AnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/Analysis"
        - type: object
          required: [architectureMap, log, items]
          properties:
            architectureMap:
              type: ["object", "null"]
              additionalProperties: true
            log:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisLogEntry"
            items:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisItem"

    AnalysisStart:
      type: object
      description: Indicare esattamente uno tra aiModelId e model (altrimenti 400 "scegli un modello")
      properties:
        aiModelId:
          type: integer
          description: Modello di un account AI dell'utente o dell'account di sistema
        model:
          type: string
          minLength: 1
          description: Compatibilità, modello AI come model_name di LiteLLM
        maxTokens:
          type: integer
          minimum: 50000
          maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)

    AnalysisItemUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"
        payload:
          type: object
          additionalProperties: true
        reviewNote:
          type: ["string", "null"]

    IssueExport:
      type: object
      required: [markdown, count]
      properties:
        markdown:
          type: string
        count:
          type: integer

    AgentSkill:
      type: object
      required: [id, agentId, name, description, instructions, toolNames, paramsSchema, status]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        instructions:
          type: string
        toolNames:
          type: array
          items:
            type: string
        paramsSchema:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: string
          enum: [draft, active]

    # ── Account AI ─────────────────────────────────────────────────────────────

    AiProvider:
      type: string
      enum: [deepseek, openrouter, huggingface, mistral, groq, together, custom, system_gateway]

    AiAccountStatus:
      type: string
      enum: [unverified, ok, error]

    AiAccount:
      type: object
      required: [id, name, provider, baseUrl, allowPrivateNetwork, isDefault, status, lastError, lastCheckedAt, keySet, isSystem, modelCount]
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        baseUrl:
          type: string
        allowPrivateNetwork:
          type: boolean
          description: Consente http e indirizzi privati (solo provider custom)
        isDefault:
          type: boolean
        status:
          $ref: "#/components/schemas/AiAccountStatus"
        lastError:
          type: ["string", "null"]
          description: Messaggio fisso dell'ultimo errore del provider
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        keySet:
          type: boolean
          description: Indica se la chiave è impostata (il valore non è mai esposto)
        isSystem:
          type: boolean
          description: Account di sistema (gateway di Casello), non modificabile
        modelCount:
          type: integer
          description: Numero di modelli dell'account (nascosti compresi)

    AiAccountInput:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Chiave del provider (solo scrittura, salvata cifrata); vuota solo per custom
        baseUrl:
          type: ["string", "null"]
          maxLength: 2048
          description: Solo custom (obbligatorio); gli altri provider usano il base URL predefinito
        allowPrivateNetwork:
          type: boolean
          description: Solo custom

    AiAccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Assente o "" = invariata; null la rimuove (solo custom); un valore la sostituisce
        baseUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Solo custom
        allowPrivateNetwork:
          type: boolean
          description: Solo custom

    AiModel:
      type: object
      required: [id, accountId, modelId, displayName, contextTokens, priceInput, priceOutput, priceSource, hidden]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        modelId:
          type: string
          description: Id del modello presso il provider (es. deepseek-chat)
        displayName:
          type: string
        contextTokens:
          type: ["integer", "null"]
        priceInput:
          type: ["number", "null"]
          description: USD per milione di token di input
        priceOutput:
          type: ["number", "null"]
          description: USD per milione di token di output
        priceSource:
          type: ["string", "null"]
          enum: [provider, manual, seed, null]
        hidden:
          type: boolean

    AiModelInput:
      type: object
      required: [modelId]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        contextTokens:
          type: ["integer", "null"]
          minimum: 1
          maximum: 100000000

    AiModelUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        hidden:
          type: boolean

    AiModelGroup:
      type: object
      required: [account, models]
      properties:
        account:
          $ref: "#/components/schemas/AiAccount"
        models:
          type: array
          items:
            $ref: "#/components/schemas/AiModel"

    CostEstimate:
      type: object
      required: [maxUsd, typicalUsd]
      properties:
        maxUsd:
          type: ["number", "null"]
          description: Costo massimo in USD (null se un prezzo manca)
        typicalUsd:
          type: ["number", "null"]
          description: Costo tipico in USD (60% del massimo)
