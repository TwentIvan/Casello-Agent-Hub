openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casello — hub per agentificare applicazioni
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login (Google, GitHub) e sessione (tutte le altre route richiedono la sessione, tranne /healthz e /auth/providers)
  - name: apps
    description: Applicazioni registrate
  - name: agents
    description: Configurazioni agenti
  - name: tools
    description: Catalogo dei tool delle app e loro assegnazione agli agenti
  - name: runs
    description: Esecuzioni degli agenti
  - name: dashboard
    description: Statistiche aggregate
  - name: models
    description: Modelli AI selezionabili
  - name: github
    description: Installazioni e repository dell'App GitHub di Casello
  - name: ai
    description: Account AI dell'utente (provider, chiave, modelli e prezzi) e stima dei costi
  - name: catalog
    description: Catalogo dei modelli per provider e suo aggiornamento
  - name: architect
    description: Analisi dell'architetto (proposte su tool, agenti, skill, endpoint ed evoluzione) e skill degli agenti
  - name: plan-chat
    description: Chat con il bot sul piano di un'app (conversazioni, messaggi e proposte)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  # /auth/login e /auth/callback sono redirect del flusso OIDC (Google), non chiamate JSON.
  # Lo stesso vale per /auth/github/login, /auth/github/link e /auth/github/callback (GitHub).

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Utente della sessione corrente
      description: >-
        Con la sessione del login o con un token personale (api:read o api:write); auth dice quale.
      responses:
        "200":
          description: Utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: Metodi di accesso disponibili
      description: Pubblica (senza sessione), serve alla pagina di login per mostrare i pulsanti.
      responses:
        "200":
          description: Metodi di accesso configurati sul server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Chiude la sessione
      responses:
        "204":
          description: Sessione chiusa

  /auth/github:
    delete:
      operationId: unlinkGithub
      tags: [auth]
      summary: Scollega l'account GitHub e le sue installazioni
      description: >
        Rimuove l'identità GitHub dell'utente corrente e le installazioni dell'App a lui collegate.
        Risponde 409 se l'utente resterebbe senza modo di entrare (nessun'altra identità ed email
        non ammessa).
      responses:
        "204":
          description: Account GitHub scollegato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/tokens:
    get:
      operationId: listApiTokens
      tags: [auth]
      summary: Elenca i token personali dell'utente
      description: >-
        Token personali (server MCP e /api, secondo gli ambiti), i più recenti per primi, revocati
        compresi. Non contiene mai il valore del token né il suo hash. Solo con il login: con un
        token risponde 403.
      responses:
        "200":
          description: Token dell'utente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      tags: [auth]
      summary: Crea un token personale
      description: >-
        Il valore del token (prefisso cas_) compare solo in questa risposta: a riposo resta solo
        l'hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [auth]
      summary: Revoca un token personale
      description: 404 se il token non è dell'utente o è già revocato.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Token revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Apps ───────────────────────────────────────────────────────────────────

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: Elenca tutte le app registrate
      responses:
        "200":
          description: Lista di app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
    post:
      operationId: createApp
      tags: [apps]
      summary: Registra una nuova app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: App creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}:
    get:
      operationId: getApp
      tags: [apps]
      summary: Recupera una app per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: App trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Aggiorna una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdate"
      responses:
        "200":
          description: App aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Elimina una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: App eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Agents ─────────────────────────────────────────────────────────────────

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: Elenca tutti gli agenti
      parameters:
        - name: appId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per app
      responses:
        "200":
          description: Lista di agenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Crea un nuovo agente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Recupera un agente per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Agente trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Aggiorna un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Elimina un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Agente eliminato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: L'agente generale di un'app non si può eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Tools ──────────────────────────────────────────────────────────────────

  /apps/{id}/tools:
    get:
      operationId: listAppTools
      tags: [tools]
      summary: Elenca i tool del catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Lista di tool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppTool"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAppTool
      tags: [tools]
      summary: Aggiunge un tool al catalogo di un'app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolInput"
      responses:
        "201":
          description: Tool creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/tools/{toolId}:
    patch:
      operationId: updateAppTool
      tags: [tools]
      summary: Aggiorna un tool del catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppToolUpdate"
      responses:
        "200":
          description: Tool aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTool"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAppTool
      tags: [tools]
      summary: Elimina un tool dal catalogo
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/ToolIdParam"
      responses:
        "204":
          description: Tool eliminato
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/tools:
    put:
      operationId: setAgentTools
      tags: [tools]
      summary: Imposta i tool di un agente
      description: >-
        Sostituisce l'insieme dei tool assegnati all'agente. I tool devono appartenere
        alla stessa app dell'agente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentToolsInput"
      responses:
        "200":
          description: Agente con i tool aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Runs ───────────────────────────────────────────────────────────────────

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Elenca le esecuzioni (dalla più recente, paginate)
      parameters:
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
          description: Filtra per agente
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
          description: Filtra per stato
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Numero massimo di esecuzioni restituite
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Restituisce solo le esecuzioni con id minore di questo (paginazione a cursore)
      responses:
        "200":
          description: Lista di esecuzioni, dalla più recente (id decrescente)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /agents/{id}/runs:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Avvia un'esecuzione dell'agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, usato per i tool con identità user.
            Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      description: >-
        Crea la run e la avvia in background: risponde subito con la run in stato pending.
        Lo stato (running, poi succeeded o failed) si segue con GET /runs/{id}.
      responses:
        "202":
          description: Esecuzione avviata (stato pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Tetto di spesa mensile raggiunto (dell'agente o dell'utente che paga il modello): la run non
            viene creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Recupera un'esecuzione per ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/steps:
    get:
      operationId: listRunSteps
      tags: [runs]
      summary: Elenca i passi di un'esecuzione (in ordine di posizione)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Passi dell'esecuzione
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStep"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Riprende un'esecuzione in attesa del client
      description: >-
        Conferma o rifiuta l'azione in sospeso di una run in stato awaiting_client e la
        riavvia in background. Risponde 409 se la run non è in pausa o la pausa è scaduta.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: X-App-User-Token
          in: header
          required: false
          schema:
            type: string
          description: >-
            Token dell'utente finale nell'app, se quello dato all'avvio non è più in memoria
            (riavvio del server o pausa lunga). Non viene mai salvato né scritto nei log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunResume"
      responses:
        "202":
          description: Esecuzione ripresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Annulla un'esecuzione non ancora conclusa
      description: >-
        Porta a cancelled una run pending, running o awaiting_client, interrompe le chiamate
        in corso (modello e tool) e non avvia altri passi. Durata, token e costo già registrati
        restano. Risponde 409 se la run è già conclusa (succeeded, failed, cancelled).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esecuzione annullata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─── Architetto ─────────────────────────────────────────────────────────────

  /apps/{id}/analyses:
    get:
      operationId: listAnalyses
      tags: [architect]
      summary: Elenca le analisi dell'architetto di una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: startAnalysis
      tags: [architect]
      summary: Avvia un'analisi leggendo le sorgenti configurate sull'app
      description: >-
        Avvia in background l'analisi con le sorgenti dell'app (repository GitHub, OpenAPI,
        descrizione funzionale). Risponde 409 se per l'app c'è già un'analisi in corso o se chi paga il
        modello ha raggiunto il tetto di spesa mensile (solo executor cloud). Con
        sourceInstallationId non serve il token manuale, ma l'utente corrente deve avere quell'installazione
        (altrimenti 403 "installazione non trovata o non tua"). Con executor local l'analisi resta in coda
        finché un agente locale (via MCP) non la prende: niente modello (aiModelId e model vietati) e
        nessun controllo sulle sorgenti, il codice lo legge l'agente sul proprio clone.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStart"
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /apps/{id}/analyses/zip:
    post:
      operationId: startZipAnalysis
      tags: [architect]
      summary: Avvia un'analisi caricando il codice come archivio zip
      description: >-
        Il corpo è l'archivio zip (application/zip, al massimo 50 MB). Il codice resta solo in
        memoria per la durata dell'analisi. Risponde 409 se per l'app c'è già un'analisi in corso.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: aiModelId
          in: query
          required: false
          schema:
            type: integer
          description: Modello di un account AI (esattamente uno tra aiModelId e model)
        - name: model
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Compatibilità, modello AI come model_name di LiteLLM
        - name: maxTokens
          in: query
          required: false
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)
        - name: executor
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AnalysisExecutor"
          description: Con local risponde 400 "con l'agente locale lo zip non serve"
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Analisi avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      tags: [architect]
      summary: Recupera un'analisi con mappa, log ed elementi della proposta
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /analyses/{id}/release:
    post:
      operationId: releaseAnalysis
      tags: [architect]
      summary: Rilascia la lease di un'analisi locale, che torna in coda
      description: >-
        Solo per un'analisi locale in coda o in corso (altrimenti 409): la lease dell'agente viene
        azzerata e un altro agente (o lo stesso) può riprenderla dalla prima fase senza esito.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi di nuovo in coda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /analyses/{id}/cancel:
    post:
      operationId: cancelAnalysis
      tags: [architect]
      summary: Annulla un'analisi locale
      description: >-
        Solo per un'analisi locale in coda o in corso (altrimenti 409): si chiude come failed con
        errore "annullata dalla console"; gli elementi già consegnati restano.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Analisi annullata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /analyses/{id}/issues:
    get:
      operationId: exportAnalysisIssues
      tags: [architect]
      summary: Esporta in Markdown gli elementi di un capitolo o di tutta l'analisi
      description: >-
        Con `chapter`: issue per endpoint, completion ed evolution, documentazione compatta per
        tool, agent e skill. Senza `chapter`: un unico Markdown con tutti i capitoli non vuoti
        nell'ordine delle fasi, ciascuno sotto un titolo `#`.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: chapter
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AnalysisChapter"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemStatus"
          description: Stato degli elementi da esportare (default approved)
      responses:
        "200":
          description: Issue in Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /analysis-items/{id}:
    patch:
      operationId: updateAnalysisItem
      tags: [architect]
      summary: Rivede un elemento della proposta (approva, scarta, rimanda, modifica)
      description: >-
        Approvando un elemento dei capitoli tool, agent o skill la proposta viene applicata.
        Se non è applicabile risponde 400 e l'elemento resta in attesa.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisItemUpdate"
      responses:
        "200":
          description: Elemento aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /agents/{id}/skills:
    get:
      operationId: listAgentSkills
      tags: [architect]
      summary: Elenca le skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Skill dell'agente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSkill"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{id}/skills/{skillId}:
    delete:
      operationId: deleteAgentSkill
      tags: [architect]
      summary: Elimina una skill di un agente
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/SkillIdParam"
      responses:
        "204":
          description: Skill eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── GitHub ─────────────────────────────────────────────────────────────────

  /github/installations:
    get:
      operationId: listGithubInstallations
      tags: [github]
      summary: Installazioni dell'App GitHub collegate all'utente
      description: >-
        Installazioni salvate per l'utente corrente, con il link per gestirle e quello per
        installare l'App su un altro account. 404 se GitHub non è configurato.
      responses:
        "200":
          description: Installazioni e link di installazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubInstallations"
        "404":
          $ref: "#/components/responses/NotFound"

  /github/repos:
    get:
      operationId: listGithubRepos
      tags: [github]
      summary: Repository visibili all'App nelle installazioni dell'utente
      description: >-
        Repository di tutte le installazioni dell'utente, ordinati per nome completo, senza doppioni.
        Un'installazione revocata (401/404 da GitHub) viene eliminata per l'utente e saltata.
        404 se GitHub non è configurato; 502 se GitHub non risponde.
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GithubRepo"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ─── Dashboard ──────────────────────────────────────────────────────────────

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche aggregate del hub
      responses:
        "200":
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /budget:
    get:
      operationId: getBudget
      tags: [dashboard]
      summary: Tetti e spesa del mese corrente
      description: >-
        Spesa del mese (calendario, ora italiana) sugli account AI dell'utente corrente e sugli agenti con
        un tetto, più le run in corso o in attesa che spendono su un tetto già raggiunto (da poter annullare).
      responses:
        "200":
          description: Riepilogo del mese
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    put:
      operationId: updateBudget
      tags: [dashboard]
      summary: Imposta il tetto di spesa mensile dell'utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Riepilogo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Models ─────────────────────────────────────────────────────────────────

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: Elenca i modelli selezionabili per gli agenti (model_name di LiteLLM)
      responses:
        "200":
          description: Lista di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  # ─── Account AI ─────────────────────────────────────────────────────────────

  /ai/providers:
    get:
      operationId: listAiProviders
      tags: [ai]
      summary: Provider del registro per la creazione degli account AI
      description: >-
        Provider della tabella providers (registro e scoperti), senza system_gateway: prima i gestiti
        per nome, poi quelli in arrivo, poi i non gestiti.
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProviderInfo"

  /ai/accounts:
    get:
      operationId: listAiAccounts
      tags: [ai]
      summary: Elenca gli account AI dell'utente e l'account di sistema
      description: >-
        Account dell'utente corrente (il predefinito per primo, poi per nome) seguiti dall'account di
        sistema, se configurato. La chiave non è mai esposta: solo keySet.
      responses:
        "200":
          description: Account AI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAccount"
    post:
      operationId: createAiAccount
      tags: [ai]
      summary: Crea un account AI e ne legge i modelli
      description: >-
        Il provider si legge dalla tabella providers: sconosciuto → 400; in arrivo (coming) → 400.
        Valida il base URL (lo indicano custom, i provider non gestiti e i gestiti senza indirizzo
        predefinito; gli altri usano quello predefinito), legge /models del provider con la chiave e
        salva account e modelli. Se il provider non
        fornisce l'elenco dei modelli l'account si salva comunque (status ok, zero modelli, aggiunta
        manuale). Ogni altro errore del provider → 400 con il messaggio fisso e nulla di salvato. Il
        primo account dell'utente diventa predefinito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountInput"
      responses:
        "201":
          description: Account creato e verificato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}:
    patch:
      operationId: updateAiAccount
      tags: [ai]
      summary: Modifica un account AI
      description: >-
        Nome, chiave (assente o "" = invariata, null = rimossa, solo custom), base URL e
        allowPrivateNetwork (solo custom). Una chiave o un base URL nuovi rileggono i modelli come
        verifyAiAccount. Account di sistema → 403; account di un altro utente → 404.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAccountUpdate"
      responses:
        "200":
          description: Account aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAiAccount
      tags: [ai]
      summary: Elimina un account AI e i suoi modelli
      description: >-
        409 "account usato da: <nomi>" se un agente o un'analisi in coda o in corso usa uno dei suoi
        modelli; le analisi concluse perdono solo il collegamento (aiModelId null) e tengono modello e
        costo. Se era il predefinito, diventa predefinito l'account più vecchio rimasto all'utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Account eliminato
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/accounts/{id}/verify:
    post:
      operationId: verifyAiAccount
      tags: [ai]
      summary: Rilegge i modelli del provider
      description: >-
        Aggiunge i modelli nuovi e aggiorna nome, contesto e prezzi (non quelli inseriti a mano) degli
        esistenti; i modelli non più elencati restano. Un errore del provider non fa fallire la
        richiesta: l'account torna con status error e lastError.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Stato dell'account dopo la verifica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/accounts/{id}/default:
    post:
      operationId: setDefaultAiAccount
      tags: [ai]
      summary: Rende l'account il predefinito dell'utente
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account predefinito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccount"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/accounts/{id}/models:
    get:
      operationId: listAiAccountModels
      tags: [ai]
      summary: Elenca i modelli di un account (nascosti compresi)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Modelli dell'account, per nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAiAccountModel
      tags: [ai]
      summary: Aggiunge a mano un modello all'account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: Modello aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ai/models/{id}:
    patch:
      operationId: updateAiModel
      tags: [ai]
      summary: Modifica nome, prezzi o visibilità di un modello
      description: Un prezzo indicato (anche null) rende la fonte dei prezzi "manual".
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Modello aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ai/models/{id}/probe:
    post:
      operationId: probeAiModel
      tags: [ai]
      summary: Prova un modello con una chiamata da 1 token
      description: >-
        Solo per i modelli degli account dell'utente (non di sistema). Una chiamata con un messaggio
        minimo e max_tokens 1, a carico dell'account; aggiorna esito e data dell'ultima prova e la
        disponibilità. Massimo 5 prove al minuto per IP.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Esito della prova (anche quando il provider rifiuta la chiamata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelProbeResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: Modelli selezionabili dall'utente, raggruppati per account
      description: >-
        Account dell'utente (il predefinito per primo, poi per nome; quelli in errore in fondo) e
        account di sistema per ultimo, se configurato. I modelli nascosti sono esclusi; quelli non
        selezionabili restano con `selectable: false`. Al massimo un modello consigliato per gruppo.
      responses:
        "200":
          description: Gruppi di modelli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModelGroup"

  /ai/estimate:
    get:
      operationId: estimateAnalysisCost
      tags: [ai]
      summary: Stima del costo di un'analisi
      description: >-
        Massimo = maxTokens × (0.95 × prezzo input + 0.05 × prezzo output) / 1e6; tipico = 60% del
        massimo; USD arrotondati a 4 decimali, null se un prezzo manca.
      parameters:
        - name: aiModelId
          in: query
          required: true
          schema:
            type: integer
        - name: maxTokens
          in: query
          required: false
          description: Tetto di token dell'analisi, come in AnalysisStart (default 1000000)
          schema:
            type: integer
            minimum: 50000
            maximum: 2000000
      responses:
        "200":
          description: Stima
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog/models:
    get:
      operationId: listCatalogModels
      tags: [catalog]
      summary: Catalogo dei modelli, a pagine
      description: >-
        Modelli con almeno un'offerta visibile (le `retired` sono escluse senza `includeRetired`). `q` cerca,
        senza distinguere maiuscole, in chiave canonica, famiglia, versione, autore e id presso i provider.
        `cheapestOffer` è l'offerta con prezzi noti e somma input+output minima; `maxPrice` filtra su quella
        somma. `usable`: solo modelli offerti dal provider di un account dell'utente. `inMyAccounts`: un
        modello di un account dell'utente è collegato a una delle offerte. Ordine predefinito per nome
        (famiglia, versione); `price` crescente (senza prezzo in fondo), `released` e `context` decrescenti.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: mode
          in: query
          required: false
          description: Tipo del modello; `all` per tutti
          schema:
            type: string
            enum: [all, chat, embedding, image_generation, image_edit, audio_transcription, audio_speech, video_generation, rerank, moderation, ocr, search, realtime, responses, completion, other]
            default: chat
        - name: author
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 100
        - name: provider
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/AiProvider"
        - name: tools
          in: query
          required: false
          schema:
            type: boolean
        - name: vision
          in: query
          required: false
          schema:
            type: boolean
        - name: reasoning
          in: query
          required: false
          schema:
            type: boolean
        - name: usable
          in: query
          required: false
          schema:
            type: boolean
        - name: maxPrice
          in: query
          required: false
          description: USD per milione di token, input+output dell'offerta più economica
          schema:
            type: number
            minimum: 0
        - name: minContext
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: includeRetired
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, price, released, context]
            default: name
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Pagina di modelli
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModelPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /catalog/models/{id}/offers:
    get:
      operationId: listCatalogModelOffers
      tags: [catalog]
      summary: Offerte di un modello del catalogo
      description: >-
        Tutte le offerte, anche ritirate, per prezzo (input+output) crescente; senza prezzo in fondo e le
        ritirate dopo tutte le altre.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Offerte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/providers:
    get:
      operationId: listCatalogProviders
      tags: [catalog]
      summary: Provider del catalogo
      description: >-
        Provider della tabella providers senza system_gateway: prima i gestiti, poi in arrivo, poi i non
        gestiti, per nome. `modelCount` conta i modelli con un'offerta non ritirata; `hasMyAccount` dice se
        l'utente ha un account presso il provider. `q` cerca in slug e nome.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiProviderStatus"
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogProvider"
        "400":
          $ref: "#/components/responses/BadRequest"

  /catalog/providers/{slug}/issue:
    get:
      operationId: getProviderIssue
      tags: [catalog]
      summary: Testo di issue per gestire un provider non gestito
      description: Solo per i provider `unmanaged`; 404 per gli altri.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiProvider"
      responses:
        "200":
          description: Titolo e corpo in markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderIssueText"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/status:
    get:
      operationId: getCatalogStatus
      tags: [catalog]
      summary: Ultimo aggiornamento del catalogo
      description: >-
        `running` dice se un aggiornamento è in corso. Il riepilogo contiene solo gli account
        dell'utente corrente.
      responses:
        "200":
          description: Stato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStatus"

  /catalog/refresh:
    post:
      operationId: refreshCatalog
      tags: [catalog]
      summary: Avvia l'aggiornamento del catalogo
      description: Risponde subito con l'esecuzione `running`; prosegue in background. Massimo 2 al minuto per IP.
      responses:
        "202":
          description: Aggiornamento avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRunView"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ─── Chat del piano ─────────────────────────────────────────────────────────

  /apps/{id}/plan:
    get:
      operationId: getAppPlan
      tags: [plan-chat]
      summary: Piano dell'app (endpoint, completamento, evoluzione)
      description: >-
        Voci dei capitoli endpoint, completion ed evolution dell'ultima analisi completata, più le voci
        nate in chat e approvate delle analisi precedenti. Senza analisi completata analysisId è null.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Piano dell'app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/plan/issues:
    post:
      operationId: createPlanIssues
      tags: [plan-chat]
      summary: Crea (o mostra in anteprima) le issue GitHub delle voci approvate del piano
      description: >-
        Le voci (endpoint, completamento, evoluzione approvate) diventano issue sul repository collegato
        tramite l'App GitHub. Con dryRun l'anteprima non chiama GitHub. Le voci già collegate o non ammesse
        risultano skipped. Massimo 5 creazioni al minuto per utente (le anteprime non contano).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanIssuesRequest"
      responses:
        "200":
          description: Anteprima (dryRun) o esito per voce
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlanIssuesPreview"
                  - $ref: "#/components/schemas/PlanIssuesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}/plan/issues/refresh:
    post:
      operationId: refreshPlanIssues
      tags: [plan-chat]
      summary: Rilegge da GitHub lo stato delle issue collegate alle voci del piano
      description: >-
        Legge le issue con l'etichetta casello del repository collegato (aggiornate dall'ultima lettura) e
        aggiorna stato e motivo della chiusura delle voci; un'issue non più nell'elenco resta com'era.
        Massimo 6 al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Riepilogo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanIssuesSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /apps/{id}/plan-conversations:
    get:
      operationId: listPlanConversations
      tags: [plan-chat]
      summary: Conversazioni dell'utente sul piano di una app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazioni, dalla più recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanConversation"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPlanConversation
      tags: [plan-chat]
      summary: Apre una conversazione sul piano
      description: >-
        Senza analysisId usa l'ultima analisi completata dell'app (nessuna: 409). Il modello deve essere
        di un account dell'utente o dell'account di sistema.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanConversationCreate"
      responses:
        "201":
          description: Conversazione creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /plan-conversations/{id}:
    get:
      operationId: getPlanConversation
      tags: [plan-chat]
      summary: Conversazione con messaggi e proposte
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Conversazione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlanConversation
      tags: [plan-chat]
      summary: Cambia il modello della conversazione
      description: Solo con nessun turno in corso (altrimenti 409).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanConversationUpdate"
      responses:
        "200":
          description: Conversazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePlanConversation
      tags: [plan-chat]
      summary: Elimina la conversazione (le voci accettate restano)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Conversazione eliminata
        "404":
          $ref: "#/components/responses/NotFound"

  /plan-conversations/{id}/messages:
    post:
      operationId: sendPlanMessage
      tags: [plan-chat]
      summary: Invia un messaggio e avvia il turno del bot
      description: >-
        Risponde subito col messaggio dell'utente; il bot risponde in background (turnStatus running,
        poi idle). 409 se un turno è già in corso, se il modello non è più disponibile o se chi paga il
        modello ha raggiunto il tetto di spesa mensile.
        Massimo 10 messaggi al minuto per utente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanMessageCreate"
      responses:
        "202":
          description: Messaggio accettato, turno avviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /plan-proposals/{id}/decision:
    post:
      operationId: decidePlanProposal
      tags: [plan-chat]
      summary: Accetta o rifiuta una proposta del bot
      description: 409 se la proposta è già decisa o la voce di destinazione è cambiata (proposta stale).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanProposalDecision"
      responses:
        "200":
          description: Proposta aggiornata ed eventuale voce creata o modificata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanProposalDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    ToolIdParam:
      name: toolId
      in: path
      required: true
      schema:
        type: integer

    SkillIdParam:
      name: skillId
      in: path
      required: true
      schema:
        type: integer

  responses:
    TooManyRequests:
      description: Troppe richieste
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflitto con lo stato corrente della risorsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Login richiesto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Risorsa non accessibile all'utente corrente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadGateway:
      description: Servizio esterno non raggiungibile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: Corpo della richiesta troppo grande
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── GitHub ─────────────────────────────────────────────────────────────────
    GithubInstallation:
      type: object
      required: [installationId, accountLogin, accountType, repositorySelection, manageUrl]
      properties:
        installationId:
          type: integer
        accountLogin:
          type: string
        accountType:
          type: string
          description: User o Organization
        repositorySelection:
          type: string
          description: all o selected
        manageUrl:
          type: string
          description: Pagina di GitHub in cui gestire l'installazione

    GithubInstallations:
      type: object
      required: [installUrl, installations]
      properties:
        installUrl:
          type: string
          description: Pagina di GitHub in cui installare l'App
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GithubInstallation"

    GithubRepo:
      type: object
      required: [installationId, fullName, defaultBranch, private]
      properties:
        installationId:
          type: integer
        fullName:
          type: string
          description: proprietario/nome
        defaultBranch:
          type: string
        private:
          type: boolean

    # ── Auth ───────────────────────────────────────────────────────────────────

    CurrentUser:
      type: object
      required: [email, name, picture, identities, githubEnabled, auth]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
        picture:
          type: ["string", "null"]
        identities:
          type: array
          description: Account esterni collegati (Google, GitHub)
          items:
            $ref: "#/components/schemas/LinkedIdentity"
        githubEnabled:
          type: boolean
          description: Se il login e il collegamento con GitHub sono configurati sul server
        auth:
          description: Come è autenticata la richiesta (sessione del login o token personale)
          oneOf:
            - $ref: "#/components/schemas/CurrentUserSessionAuth"
            - $ref: "#/components/schemas/CurrentUserTokenAuth"

    CurrentUserSessionAuth:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [session]

    CurrentUserTokenAuth:
      type: object
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [token]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    AuthProviders:
      type: object
      required: [google, github]
      properties:
        google:
          type: boolean
        github:
          type: boolean
          description: Se il login con GitHub è configurato sul server

    LinkedIdentity:
      type: object
      required: [provider, username, email]
      properties:
        provider:
          type: string
          enum: [google, github]
        username:
          type: ["string", "null"]
          description: Login GitHub (null per Google)
        email:
          type: ["string", "null"]

    # ── App ────────────────────────────────────────────────────────────────────

    AppStatus:
      type: string
      enum: [active, inactive]

    AuthConfig:
      type: object
      required: [header, scheme]
      description: Come l'app riceve le credenziali (scheme null = valore grezzo)
      properties:
        header:
          type: string
          minLength: 1
        scheme:
          type: ["string", "null"]

    SourceType:
      type: string
      enum: [github, zip, none]
      description: Da dove l'architetto legge il codice dell'app

    App:
      type: object
      required: [id, name, slug, baseUrl, status, serviceSecretSet, sourceType, sourceRepo, sourceBranch, sourceTokenSet, sourceInstallationId, openapiUrl, functionalDescription, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
        internalBaseUrl:
          type: ["string", "null"]
          description: URL raggiunto dall'esecutore al posto di baseUrl (rete interna)
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecretSet:
          type: boolean
          description: Indica se il segreto di servizio è impostato (il valore non è mai esposto)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
          description: Repository GitHub nel formato owner/nome
        sourceBranch:
          type: ["string", "null"]
        sourceTokenSet:
          type: boolean
          description: Indica se il token GitHub di sola lettura è impostato (il valore non è mai esposto)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App da cui l'architetto scarica il repo (con un token ristretto
            a quel repo); null = token manuale della fase 3
        openapiUrl:
          type: ["string", "null"]
          description: URL dell'OpenAPI dell'app, letto (GET) dall'architetto
        functionalDescription:
          type: ["string", "null"]
          description: Descrizione funzionale dell'app per l'architetto
        status:
          $ref: "#/components/schemas/AppStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppInput:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: string
          description: Segreto di servizio (solo scrittura, salvato cifrato)
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: string
          description: Token GitHub di sola lettura (solo scrittura, salvato cifrato)
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo (solo con sourceType github);
            altrimenti 400 "installazione non trovata o non tua"
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"

    AppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        baseUrl:
          type: string
          minLength: 1
        internalBaseUrl:
          type: ["string", "null"]
        userAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceAuth:
          oneOf:
            - $ref: "#/components/schemas/AuthConfig"
            - type: "null"
        serviceSecret:
          type: ["string", "null"]
          description: Segreto di servizio (solo scrittura); null lo cancella
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceRepo:
          type: ["string", "null"]
        sourceBranch:
          type: ["string", "null"]
        sourceToken:
          type: ["string", "null"]
          description: Token GitHub di sola lettura (solo scrittura); null lo cancella
        sourceInstallationId:
          type: ["integer", "null"]
          description: >-
            Installazione della GitHub App dell'utente che vede sourceRepo; null torna al token manuale.
            Passando a un sourceType diverso da github diventa null da sola
        openapiUrl:
          type: ["string", "null"]
        functionalDescription:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AppStatus"

    # ── Agent ──────────────────────────────────────────────────────────────────

    AgentStatus:
      type: string
      enum: [active, inactive, draft]

    AgentRole:
      type: string
      enum: [general, area]

    Agent:
      type: object
      required: [id, appId, name, aiModelId, status, role, defaultIdentity, toolIds, monthlyBudgetUsd, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
          description: >-
            Id del modello come testo (compatibilità): con aiModelId impostato è il modelId del
            modello scelto
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello scelto tra quelli degli account AI; le run usano l'account di questo modello
            (chi configura paga). Null = vecchio percorso del gateway
        status:
          $ref: "#/components/schemas/AgentStatus"
        role:
          $ref: "#/components/schemas/AgentRole"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        toolIds:
          type: array
          items:
            type: integer
          description: ID dei tool del catalogo assegnati all'agente
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD delle run dell'agente; null = nessun limite
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [appId, name]
      properties:
        appId:
          type: integer
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: string
        model:
          type: string
          description: Solo compatibilità; con aiModelId è ignorato
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Modello di un account AI dell'utente o dell'account di sistema (400 "modello non
            disponibile" altrimenti)
        status:
          $ref: "#/components/schemas/AgentStatus"

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        systemPrompt:
          type: ["string", "null"]
        model:
          type: string
          description: Solo compatibilità; con aiModelId è ignorato
        aiModelId:
          type: ["integer", "null"]
          description: >-
            Se diverso da quello salvato deve essere un modello dell'utente o dell'account di
            sistema (400 altrimenti); uguale a quello salvato non viene ricontrollato
        status:
          $ref: "#/components/schemas/AgentStatus"
        area:
          type: ["string", "null"]
        defaultIdentity:
          $ref: "#/components/schemas/ToolIdentity"
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite

    AgentToolsInput:
      type: object
      required: [toolIds]
      properties:
        toolIds:
          type: array
          items:
            type: integer

    # ── Model ──────────────────────────────────────────────────────────────────

    Model:
      type: object
      required: [id, label, isDefault]
      properties:
        id:
          type: string
          description: model_name di LiteLLM, da usare in Agent.model
        label:
          type: string
        isDefault:
          type: boolean
          description: Modello usato quando un agente viene creato senza model

    # ── Tool ───────────────────────────────────────────────────────────────────

    ToolKind:
      type: string
      enum: [http, ui, composite]

    ToolIdentity:
      type: string
      enum: [user, service]

    ToolStatus:
      type: string
      enum: [draft, active, disabled]

    AppTool:
      type: object
      required:
        - id
        - appId
        - name
        - kind
        - identity
        - requiresConfirmation
        - readOnly
        - status
        - paramsSchema
        - definition
        - needsVerification
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        appId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema dei parametri accettati dal tool
        definition:
          type: object
          additionalProperties: true
          description: Definizione dell'esecuzione (dipende da kind)
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
          description: Evidenze da cui il tool è stato derivato (proposte dall'architetto)
        needsVerification:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ToolEvidence:
      type: object
      required: [source, location]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    AppToolInput:
      type: object
      required: [name, kind, definition]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    AppToolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        kind:
          $ref: "#/components/schemas/ToolKind"
        identity:
          $ref: "#/components/schemas/ToolIdentity"
        requiresConfirmation:
          type: boolean
        readOnly:
          type: boolean
        status:
          $ref: "#/components/schemas/ToolStatus"
        paramsSchema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        evidence:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ToolEvidence"
        needsVerification:
          type: boolean

    # ── Run ────────────────────────────────────────────────────────────────────

    RunStatus:
      type: string
      enum: [pending, running, succeeded, failed, awaiting_client, cancelled]

    Run:
      type: object
      required: [id, agentId, status, createdAt, cachedTokens]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          type: ["string", "null"]
          description: Input testuale passato all'agente
        output:
          type: ["string", "null"]
          description: Output prodotto dall'agente
        errorMessage:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        pendingAction:
          oneOf:
            - $ref: "#/components/schemas/PendingAction"
            - type: "null"
          description: Azione in attesa del client (solo con stato awaiting_client)
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        cachedTokens:
          type: integer
          description: Quanti dei token di prompt il provider ha letto dalla cache (0 se non lo riporta)
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o la run usa il vecchio gateway (costo parziale)

    PendingActionKind:
      type: string
      enum: [confirmation, ui]

    PendingAction:
      type: object
      required: [kind, toolName, args, summary]
      properties:
        kind:
          $ref: "#/components/schemas/PendingActionKind"
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        summary:
          type: string

    RunStep:
      type: object
      required: [id, runId, position, type, createdAt]
      properties:
        id:
          type: integer
        runId:
          type: integer
        position:
          type: integer
        type:
          type: string
          description: "model (chiamata al modello) o tool (chiamata a un tool)"
        toolName:
          type: ["string", "null"]
        args:
          type: ["object", "null"]
          additionalProperties: true
        ok:
          type: ["boolean", "null"]
        httpStatus:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RunDecision:
      type: string
      enum: [approved, rejected]

    RunResume:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/RunDecision"

    RunTrigger:
      type: object
      properties:
        input:
          type: string
          description: Input testuale da passare all'agente

    # ── Dashboard ──────────────────────────────────────────────────────────────

    DashboardStats:
      type: object
      required: [totalApps, totalAgents, totalRuns, successfulRuns, failedRuns, cancelledRuns, activeAgents]
      properties:
        totalApps:
          type: integer
        totalAgents:
          type: integer
        activeAgents:
          type: integer
        totalRuns:
          type: integer
        successfulRuns:
          type: integer
        failedRuns:
          type: integer
        cancelledRuns:
          type: integer
        avgDurationMs:
          type: ["number", "null"]

    # ── Tetti di spesa ─────────────────────────────────────────────────────────

    UserBudget:
      type: object
      required: [capUsd, spentUsd, unpricedCount]
      properties:
        capUsd:
          type: ["number", "null"]
          description: Tetto mensile in USD; null = nessun limite
        spentUsd:
          type: number
          description: Spesa nota del mese sugli account AI dell'utente (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer
          description: Esecuzioni del mese con token consumati ma senza prezzo (la spesa reale è più alta)

    AgentBudget:
      type: object
      required: [agentId, agentName, appId, capUsd, spentUsd, unpricedCount]
      properties:
        agentId:
          type: integer
        agentName:
          type: string
        appId:
          type: integer
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese delle run dell'agente, con qualsiasi modello
        unpricedCount:
          type: integer

    AccountBudget:
      type: object
      required: [accountId, accountName, capUsd, spentUsd, unpricedCount]
      properties:
        accountId:
          type: integer
        accountName:
          type: string
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese su tutti i modelli dell'account (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer

    ModelBudget:
      type: object
      required: [aiModelId, modelName, accountId, accountName, capUsd, spentUsd, unpricedCount]
      properties:
        aiModelId:
          type: integer
        modelName:
          type: string
        accountId:
          type: integer
        accountName:
          type: string
        capUsd:
          type: number
        spentUsd:
          type: number
          description: Spesa nota del mese sul modello (run, analisi cloud, chat del piano)
        unpricedCount:
          type: integer

    BudgetActiveRun:
      type: object
      required: [id, agentId, agentName, status]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        agentName:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"

    Budget:
      type: object
      required: [month, user, agents, accounts, models, activeRuns]
      properties:
        month:
          type: string
          description: Mese corrente, AAAA-MM (ora italiana)
        user:
          $ref: "#/components/schemas/UserBudget"
        agents:
          type: array
          description: Agenti con un tetto impostato
          items:
            $ref: "#/components/schemas/AgentBudget"
        accounts:
          type: array
          description: Account AI dell'utente con un tetto impostato
          items:
            $ref: "#/components/schemas/AccountBudget"
        models:
          type: array
          description: Modelli degli account dell'utente con un tetto impostato
          items:
            $ref: "#/components/schemas/ModelBudget"
        activeRuns:
          type: array
          description: >-
            Run pending, running o awaiting_client che spendono su un tetto già raggiunto (dell'utente, del
            loro agente, del loro modello o del suo account)
          items:
            $ref: "#/components/schemas/BudgetActiveRun"

    BudgetUpdate:
      type: object
      required: [monthlyBudgetUsd]
      properties:
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto mensile in USD (arrotondato al centesimo); null = nessun limite

    # ── Architetto ─────────────────────────────────────────────────────────────

    AnalysisStatus:
      type: string
      enum: [queued, running, completed, failed, interrupted]

    AnalysisExecutor:
      type: string
      enum: [cloud, local]
      description: Chi esegue l'analisi, il cloud di Casello o un agente locale via MCP

    AnalysisChapter:
      type: string
      enum: [tool, agent, skill, endpoint, completion, evolution]

    ItemDiff:
      type: string
      enum: [new, changed, removed, unchanged]
      description: Differenza rispetto allo stato approvato

    ItemStatus:
      type: string
      enum: [pending, approved, discarded, postponed]
      description: postponed solo per i capitoli endpoint, completion ed evolution

    AnalysisSources:
      type: object
      required: [code, openapi, description]
      properties:
        code:
          $ref: "#/components/schemas/SourceType"
        openapi:
          type: boolean
        description:
          type: boolean

    Analysis:
      type: object
      required: [id, appId, model, aiModelId, status, executor, sources, maxTokens, tokensUsed, cachedTokens, costUsd, phase, error, leaseLabel, leaseUntil, createdAt, finishedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        model:
          type: string
        aiModelId:
          type: ["integer", "null"]
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        executor:
          $ref: "#/components/schemas/AnalysisExecutor"
        sources:
          $ref: "#/components/schemas/AnalysisSources"
        maxTokens:
          type: integer
        tokensUsed:
          type: integer
          description: Token usati pesati per il budget (quelli letti dalla cache contano al 10%)
        cachedTokens:
          type: integer
          description: Token di prompt letti dalla cache del provider, per intero
        costUsd:
          type: ["number", "null"]
          description: Costo in USD; null se un prezzo manca o l'analisi usa il vecchio gateway (costo parziale)
        phase:
          type: ["string", "null"]
          description: Fase corrente
        error:
          type: ["string", "null"]
        leaseLabel:
          type: ["string", "null"]
          description: Etichetta dell'agente locale che ha l'analisi in carico (solo con lease attiva)
        leaseUntil:
          type: ["string", "null"]
          format: date-time
          description: Scadenza della lease dell'agente locale
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    AnalysisPhaseDelivery:
      type: object
      required: [phase, submittedAt]
      properties:
        phase:
          type: string
        submittedAt:
          type: string
          format: date-time

    AnalysisLogEntry:
      type: object
      required: [at, phase, message]
      properties:
        at:
          type: string
          format: date-time
        phase:
          type: string
        message:
          type: string

    AnalysisEvidence:
      type: object
      required: [source, location, note]
      properties:
        source:
          type: string
        location:
          type: string
        note:
          type: string

    ItemIssue:
      type: object
      required: [repo, number, url, state, stateReason, checkedAt]
      properties:
        repo:
          type: string
          description: Repository della issue, nella forma proprietario/nome
        number:
          type: integer
        url:
          type: string
        state:
          type: string
          enum: [open, closed]
        stateReason:
          type: ["string", "null"]
          description: Motivo di chiusura riportato da GitHub (es. completed, not_planned)
        checkedAt:
          type: ["string", "null"]
          format: date-time
          description: Ultimo controllo dello stato su GitHub

    AnalysisItem:
      type: object
      required: [id, analysisId, chapter, ref, position, payload, diff, evidence, status, reviewNote, appliedAt, origin, issue]
      properties:
        id:
          type: integer
        analysisId:
          type: integer
        origin:
          type: string
          enum: [architect, chat]
          description: Chi ha creato la voce (l'architetto o una proposta accettata in chat)
        chapter:
          $ref: "#/components/schemas/AnalysisChapter"
        ref:
          type: string
          description: Chiave stabile nell'analisi, es. tool:rosa_squadra
        position:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: Contenuto della proposta, la cui forma dipende dal capitolo
        diff:
          $ref: "#/components/schemas/ItemDiff"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisEvidence"
        status:
          $ref: "#/components/schemas/ItemStatus"
        reviewNote:
          type: ["string", "null"]
        appliedAt:
          type: ["string", "null"]
          format: date-time
        issue:
          oneOf:
            - $ref: "#/components/schemas/ItemIssue"
            - type: "null"
          description: Issue GitHub collegata alla voce (null se non creata o ancora in prenotazione)

    # ── Chat del piano ────────────────────────────────────────────────────────
    PlanTurnStatus:
      type: string
      enum: [idle, running]

    PlanConversation:
      type: object
      required: [id, appId, analysisId, aiModelId, title, tokensUsed, costUsd, turnStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        appId:
          type: integer
        analysisId:
          type: integer
        aiModelId:
          type: ["integer", "null"]
        title:
          type: string
        tokensUsed:
          type: integer
        costUsd:
          type: ["number", "null"]
          description: null = costo parziale (prezzo mancante)
        turnStatus:
          $ref: "#/components/schemas/PlanTurnStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlanMessage:
      type: object
      required: [id, role, content, error, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Markdown
        error:
          type: boolean
          description: Messaggio del bot che riporta un errore
        createdAt:
          type: string
          format: date-time

    PlanProposal:
      type: object
      required: [id, messageId, kind, chapter, title, payload, rationale, targetItemId, status, itemId, decidedAt, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        kind:
          type: string
          enum: [add, update, discard]
        chapter:
          $ref: "#/components/schemas/AnalysisChapter"
        title:
          type: string
          description: Titolo della voce proposta (per discard, quello della voce di destinazione)
        payload:
          type: ["object", "null"]
          additionalProperties: true
          description: Contenuto proposto (add e update), null per discard
        rationale:
          type: string
        targetItemId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, stale]
        itemId:
          type: ["integer", "null"]
          description: Voce creata o modificata all'accettazione
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    PlanConversationDetail:
      allOf:
        - $ref: "#/components/schemas/PlanConversation"
        - type: object
          required: [messages, proposals, newerAnalysisId]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/PlanMessage"
            proposals:
              type: array
              items:
                $ref: "#/components/schemas/PlanProposal"
            newerAnalysisId:
              type: ["integer", "null"]
              description: Id di un'analisi completata più recente di quella della conversazione, se esiste

    AppPlan:
      type: object
      required: [analysisId, items, issues]
      properties:
        analysisId:
          type: ["integer", "null"]
          description: Ultima analisi completata dell'app (null se non ce n'è)
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisItem"
        issues:
          $ref: "#/components/schemas/PlanIssuesSummary"

    PlanIssuesSummary:
      type: object
      required: [available, unavailableReason, repo, open, closed, approvedWithoutIssue, checkedAt]
      properties:
        available:
          type: boolean
          description: L'utente può creare issue (repository collegato tramite un'installazione sua)
        unavailableReason:
          type: ["string", "null"]
        repo:
          type: ["string", "null"]
          description: Repository delle issue (null se non disponibile)
        open:
          type: integer
          description: Voci del piano con issue aperta
        closed:
          type: integer
          description: Voci del piano con issue chiusa
        approvedWithoutIssue:
          type: integer
          description: Voci approvate di endpoint, completamento ed evoluzione senza issue
        checkedAt:
          type: ["string", "null"]
          format: date-time
          description: Lettura dello stato più vecchia tra le voci collegate

    PlanConversationCreate:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: integer
          description: Modello di un account AI dell'utente o dell'account di sistema
        analysisId:
          type: integer
          description: Analisi di riferimento (default l'ultima completata dell'app)

    PlanConversationUpdate:
      type: object
      required: [aiModelId]
      properties:
        aiModelId:
          type: integer

    PlanMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000

    PlanIssuesRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: integer
        dryRun:
          type: boolean
          description: Solo anteprima, senza chiamare GitHub

    PlanIssuesPreview:
      type: object
      required: [repo, issues]
      properties:
        repo:
          type: string
        issues:
          type: array
          items:
            type: object
            required: [itemId, title, body, labels, skipped]
            properties:
              itemId:
                type: integer
              title:
                type: string
              body:
                type: string
              labels:
                type: array
                items:
                  type: string
              skipped:
                type: boolean
                description: Voce già collegata o non ammessa (non verrebbe creata)

    PlanIssuesResult:
      type: object
      required: [repo, results]
      properties:
        repo:
          type: string
        results:
          type: array
          items:
            type: object
            required: [itemId, outcome]
            properties:
              itemId:
                type: integer
              outcome:
                type: string
                enum: [created, skipped, failed]
              number:
                type: integer
              url:
                type: string
              error:
                type: string

    PlanProposalDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject]

    PlanProposalDecisionResult:
      type: object
      required: [proposal, item]
      properties:
        proposal:
          $ref: "#/components/schemas/PlanProposal"
        item:
          oneOf:
            - $ref: "#/components/schemas/AnalysisItem"
            - type: "null"
          description: Voce creata o modificata (null se rifiutata)

    AnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/Analysis"
        - type: object
          required: [architectureMap, log, items, deliveredPhases]
          properties:
            deliveredPhases:
              type: array
              description: Fasi consegnate dall'agente locale, in ordine di fase (vuoto per le analisi cloud)
              items:
                $ref: "#/components/schemas/AnalysisPhaseDelivery"
            architectureMap:
              type: ["object", "null"]
              additionalProperties: true
            log:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisLogEntry"
            items:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisItem"

    AnalysisStart:
      type: object
      description: >-
        Con executor cloud (default) indicare esattamente uno tra aiModelId e model (altrimenti 400
        "scegli un modello"); con executor local nessuno dei due.
      properties:
        executor:
          $ref: "#/components/schemas/AnalysisExecutor"
        aiModelId:
          type: integer
          description: Modello di un account AI dell'utente o dell'account di sistema
        model:
          type: string
          minLength: 1
          description: Compatibilità, modello AI come model_name di LiteLLM
        maxTokens:
          type: integer
          minimum: 50000
          maximum: 2000000
          description: Tetto di token per l'analisi (default 1000000)

    AnalysisItemUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ItemStatus"
        payload:
          type: object
          additionalProperties: true
        reviewNote:
          type: ["string", "null"]

    IssueExport:
      type: object
      required: [markdown, count]
      properties:
        markdown:
          type: string
        count:
          type: integer

    AgentSkill:
      type: object
      required: [id, agentId, name, description, instructions, toolNames, paramsSchema, status]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        instructions:
          type: string
        toolNames:
          type: array
          items:
            type: string
        paramsSchema:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: string
          enum: [draft, active]

    # ── Account AI ─────────────────────────────────────────────────────────────

    AiProvider:
      type: string
      pattern: "^[a-z0-9_-]{1,64}$"
      description: Slug di un provider della tabella providers (system_gateway, con il trattino basso, è un valore storico)

    AiProviderProtocol:
      type: string
      enum: [openai_compatible, anthropic, bedrock, vertex, azure, unknown]

    AiProviderStatus:
      type: string
      enum: [managed, coming, unmanaged]
      description: >-
        managed: esecutore disponibile; coming: protocollo noto ancora senza esecutore (non selezionabile);
        unmanaged: sconosciuto al registro, configurabile come compatibile OpenAI con indirizzo dell'utente

    AiProviderInfo:
      type: object
      required: [slug, name, protocol, status, defaultBaseUrl, editableBaseUrl]
      properties:
        slug:
          $ref: "#/components/schemas/AiProvider"
        name:
          type: string
        protocol:
          $ref: "#/components/schemas/AiProviderProtocol"
        status:
          $ref: "#/components/schemas/AiProviderStatus"
        defaultBaseUrl:
          type: ["string", "null"]
          description: Indirizzo predefinito; null se lo inserisce l'utente
        editableBaseUrl:
          type: boolean
          description: L'utente inserisce l'indirizzo (custom, provider non gestiti e gestiti senza indirizzo predefinito)

    AiAccountStatus:
      type: string
      enum: [unverified, ok, error]

    AiAccount:
      type: object
      required: [id, name, provider, baseUrl, allowPrivateNetwork, isDefault, status, lastError, lastCheckedAt, keySet, isSystem, modelCount, monthlyBudgetUsd]
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        baseUrl:
          type: string
        allowPrivateNetwork:
          type: boolean
          description: Consente http e indirizzi privati (solo custom e provider non gestiti); loopback, link-local e metadati restano vietati
        isDefault:
          type: boolean
        status:
          $ref: "#/components/schemas/AiAccountStatus"
        lastError:
          type: ["string", "null"]
          description: Messaggio fisso dell'ultimo errore del provider
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        keySet:
          type: boolean
          description: Indica se la chiave è impostata (il valore non è mai esposto)
        isSystem:
          type: boolean
          description: Account di sistema (gateway di Casello), non modificabile
        modelCount:
          type: integer
          description: Numero di modelli dell'account (nascosti compresi)
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD su tutti i modelli dell'account; null = nessun limite

    AiAccountInput:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Chiave del provider (solo scrittura, salvata cifrata); vuota solo per custom
        baseUrl:
          type: ["string", "null"]
          maxLength: 2048
          description: Obbligatorio per custom, provider non gestiti e gestiti senza indirizzo predefinito; gli altri usano il base URL predefinito
        allowPrivateNetwork:
          type: boolean
          description: Solo custom e provider non gestiti

    ApiTokenInfo:
      type: object
      required: [id, name, createdAt, expiresAt, lastUsedAt, revokedAt, scopes]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    ApiTokenScope:
      type: string
      enum: [mcp, api:read, api:write]
      description: mcp = server MCP; api:read = solo lettura su /api; api:write = lettura e scrittura su /api

    ApiTokenCreate:
      type: object
      required: [name, expiresInDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
        scopes:
          type: array
          description: Almeno uno, senza ripetizioni; se omesso vale solo mcp
          items:
            $ref: "#/components/schemas/ApiTokenScope"

    ApiTokenCreated:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: Valore del token, mostrato una sola volta
        info:
          $ref: "#/components/schemas/ApiTokenInfo"

    AiAccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        apiKey:
          type: ["string", "null"]
          maxLength: 4096
          description: Assente o "" = invariata; null la rimuove (solo custom); un valore la sostituisce
        baseUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Solo se il provider ha l'indirizzo modificabile (vedi AiProviderInfo.editableBaseUrl)
        allowPrivateNetwork:
          type: boolean
          description: Solo custom e provider non gestiti
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite

    AiModel:
      type: object
      required:
        [id, accountId, modelId, displayName, contextTokens, priceInput, priceOutput, priceSource, hidden,
         availability, supportsTools, status, deprecationDate, releasedAt, selectable, recommended, lastProbeAt,
         lastProbeOk, monthlyBudgetUsd]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        modelId:
          type: string
          description: Id del modello presso il provider (es. deepseek-chat)
        displayName:
          type: string
        contextTokens:
          type: ["integer", "null"]
        priceInput:
          type: ["number", "null"]
          description: USD per milione di token di input
        priceOutput:
          type: ["number", "null"]
          description: USD per milione di token di output
        priceSource:
          type: ["string", "null"]
          enum: [provider, manual, seed, catalog, null]
        hidden:
          type: boolean
        availability:
          type: string
          enum: [available, unavailable, unknown]
          description: Disponibilità vista da Casello (verifica dell'account, chiamate reali, prove)
        supportsTools:
          type: ["boolean", "null"]
          description: Supporto degli strumenti (null = non noto)
        status:
          type: string
          enum: [available, unavailable, retired]
          description: >-
            Stato effettivo: ritirato se il catalogo lo dà ritirato o la dismissione è passata, poi non
            disponibile, altrimenti disponibile
        deprecationDate:
          type: ["string", "null"]
          format: date-time
          description: Data di dismissione dal catalogo
        releasedAt:
          type: ["string", "null"]
          format: date-time
          description: Data di rilascio dal catalogo
        selectable:
          type: boolean
          description: Disponibile e con strumenti non esclusi
        recommended:
          type: boolean
          description: Preselezione del gruppo (solo in GET /ai/models)
        lastProbeAt:
          type: ["string", "null"]
          format: date-time
        lastProbeOk:
          type: ["boolean", "null"]
        monthlyBudgetUsd:
          type: ["number", "null"]
          description: Tetto di spesa mensile in USD sul modello; null = nessun limite

    AiModelProbeResult:
      type: object
      required: [ok, error, costUsd, model]
      properties:
        ok:
          type: boolean
        error:
          type: ["string", "null"]
          description: Messaggio fisso dell'errore del provider
        costUsd:
          type: ["number", "null"]
          description: Costo della prova in USD (null se un prezzo manca o la prova non è riuscita)
        model:
          $ref: "#/components/schemas/AiModel"

    AiModelInput:
      type: object
      required: [modelId]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        contextTokens:
          type: ["integer", "null"]
          minimum: 1
          maximum: 100000000

    AiModelUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        priceInput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        priceOutput:
          type: ["number", "null"]
          minimum: 0
          maximum: 999999.999999
        hidden:
          type: boolean
        monthlyBudgetUsd:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
          description: Tetto di spesa mensile in USD (arrotondato al centesimo); null = nessun limite

    AiModelGroup:
      type: object
      required: [account, models]
      properties:
        account:
          $ref: "#/components/schemas/AiAccount"
        models:
          type: array
          items:
            $ref: "#/components/schemas/AiModel"

    CostEstimate:
      type: object
      required: [maxUsd, typicalUsd]
      properties:
        maxUsd:
          type: ["number", "null"]
          description: Costo massimo in USD (null se un prezzo manca)
        typicalUsd:
          type: ["number", "null"]
          description: Costo tipico in USD (60% del massimo)

    # ── Catalogo dei modelli ───────────────────────────────────────────────────

    CatalogModelMode:
      type: string
      enum: [chat, embedding, image_generation, image_edit, audio_transcription, audio_speech, video_generation, rerank, moderation, ocr, search, realtime, responses, completion, other]

    CatalogOfferStatus:
      type: string
      enum: [available, deprecated, retired]

    CatalogCheapestOffer:
      type: object
      required: [provider, priceInput, priceOutput]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        priceInput:
          type: number
          description: USD per milione di token
        priceOutput:
          type: number
          description: USD per milione di token

    CatalogModelSummary:
      type: object
      required: [id, canonicalKey, author, family, version, mode, supportsTools, supportsVision, supportsReasoning, releasedAt, offerCount, providerCount, cheapestOffer, inMyAccounts]
      properties:
        id:
          type: integer
        canonicalKey:
          type: string
        author:
          type: string
        family:
          type: string
        version:
          type: string
        mode:
          $ref: "#/components/schemas/CatalogModelMode"
        supportsTools:
          type: ["boolean", "null"]
        supportsVision:
          type: ["boolean", "null"]
        supportsReasoning:
          type: ["boolean", "null"]
        releasedAt:
          type: ["string", "null"]
          format: date-time
        offerCount:
          type: integer
          description: Offerte visibili (senza le ritirate, salvo includeRetired)
        providerCount:
          type: integer
          description: Provider distinti tra le offerte visibili
        cheapestOffer:
          oneOf:
            - $ref: "#/components/schemas/CatalogCheapestOffer"
            - type: "null"
        inMyAccounts:
          type: boolean

    CatalogModelPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogModelSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CatalogOffer:
      type: object
      required: [id, provider, providerName, providerStatus, providerModelId, priceInput, priceOutput, contextTokens, supportsTools, status, deprecationDate, inMyAccounts]
      properties:
        id:
          type: integer
        provider:
          $ref: "#/components/schemas/AiProvider"
        providerName:
          type: string
        providerStatus:
          $ref: "#/components/schemas/AiProviderStatus"
        providerModelId:
          type: string
        priceInput:
          type: ["number", "null"]
          description: USD per milione di token
        priceOutput:
          type: ["number", "null"]
          description: USD per milione di token
        contextTokens:
          type: ["integer", "null"]
        supportsTools:
          type: ["boolean", "null"]
        status:
          $ref: "#/components/schemas/CatalogOfferStatus"
        deprecationDate:
          type: ["string", "null"]
          format: date-time
        inMyAccounts:
          type: boolean

    CatalogProvider:
      type: object
      required: [slug, name, protocol, status, origin, firstSeenAt, modelCount, hasMyAccount]
      properties:
        slug:
          $ref: "#/components/schemas/AiProvider"
        name:
          type: string
        protocol:
          $ref: "#/components/schemas/AiProviderProtocol"
        status:
          $ref: "#/components/schemas/AiProviderStatus"
        origin:
          type: string
          enum: [registry, discovered]
        firstSeenAt:
          type: string
          format: date-time
        modelCount:
          type: integer
        hasMyAccount:
          type: boolean

    ProviderIssueText:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
          description: Markdown in italiano

    CatalogChange:
      type: object
      required: [provider, modelId, version]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        modelId:
          type: string
        version:
          type: string

    CatalogSummaryView:
      type: object
      required: [firstRun, added, retired, deprecating, priceChanged, newProviders, accounts]
      properties:
        firstRun:
          type: boolean
        added:
          type: array
          items:
            $ref: "#/components/schemas/CatalogChange"
        retired:
          type: array
          items:
            $ref: "#/components/schemas/CatalogChange"
        deprecating:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CatalogChange"
              - type: object
                required: [deprecationDate]
                properties:
                  deprecationDate:
                    type: string
        priceChanged:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CatalogChange"
              - type: object
                required: [oldInput, oldOutput, newInput, newOutput]
                properties:
                  oldInput:
                    type: ["number", "null"]
                  oldOutput:
                    type: ["number", "null"]
                  newInput:
                    type: ["number", "null"]
                  newOutput:
                    type: ["number", "null"]
        newProviders:
          type: array
          description: Provider scoperti in questa esecuzione (non gestiti)
          items:
            type: object
            required: [slug, name, count]
            properties:
              slug:
                $ref: "#/components/schemas/AiProvider"
              name:
                type: string
              count:
                type: integer
        accounts:
          type: array
          description: Solo gli account dell'utente corrente
          items:
            type: object
            required: [accountId, accountName, missing]
            properties:
              accountId:
                type: integer
              accountName:
                type: string
              missing:
                type: array
                items:
                  type: string

    CatalogRunView:
      type: object
      required: [id, trigger, status, startedAt, finishedAt, error, summary]
      properties:
        id:
          type: integer
        trigger:
          type: string
          enum: [scheduled, manual]
        status:
          type: string
          enum: [running, completed, partial, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
        summary:
          oneOf:
            - $ref: "#/components/schemas/CatalogSummaryView"
            - type: "null"

    CatalogStatus:
      type: object
      required: [running, latest, lastCompleted]
      properties:
        running:
          type: boolean
        latest:
          oneOf:
            - $ref: "#/components/schemas/CatalogRunView"
            - type: "null"
        lastCompleted:
          description: Ultima esecuzione completed o partial, da cui leggere le novità
          oneOf:
            - $ref: "#/components/schemas/CatalogRunView"
            - type: "null"
